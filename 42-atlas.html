{id:"walk",grp:"Strings",tit:"Strings, the terminator & the walking loop",
lead:"There is no string type in C. There are characters in a row and a zero byte marking the end — and that byte is the only thing standing between you and other people's memory.",
theory:[
 A("char *str = \"cat\";\n\naddress:  1000   1001   1002   1003\ncontent:   'c'    'a'    't'   '\\0'\n            ▲                    ▲\n       str points here     THE END FLAG"),
 W("The terminator is neither optional nor automatic. Without it, every function keeps walking until it stumbles on a zero by accident. Sometimes garbage prints, sometimes it crashes, sometimes it works — and fails on grading day."),
 P("A frequent confusion: <code>'0'</code> is the zero character and equals 48; <code>'\\0'</code> is the zero byte and equals 0. It occupies a real byte, which is why <code>\"cat\"</code> has length three but takes <b>four</b> bytes."),
 K("That gap between <b>length</b> and <b>bytes occupied</b> is precisely what causes the forgotten <code>+1</code> in allocation later. Fix the idea now and you save hours in C07."),
 P("An empty string is not a string with nothing in it. It holds one byte, the terminator, so reading position zero is always safe."),
 H("The mother pattern"),
 C("i = 0;\nwhile (str[i] != '\\0')\n{\n\ti++;\n}"),
 P("<code>while (str[i])</code> is identical, since the terminator is zero and zero is false. Write the explicit form while learning — it shows intent to whoever grades you."),
 H("Where the loop actually stops"),
 A("str = \"cat\"\n\ni:      0    1    2    3\nstr[i]:'c'  'a'  't'  '\\0'\n                       ▲\n          loop stops HERE, without entering"),
 W("When the loop ends, the index sits <b>exactly on the terminator</b> and the body never ran there. So when you copy a string, the flag is never copied. You place it yourself, after the loop."),
 I("The sentence to keep: <i>the while exits just before processing the terminator.</i> Every missing-flag bug you will ever write comes from forgetting it."),
 H("Two ways to reach a character"),
 C("str[i]        /* the content of cell i */\n*(str + i)    /* walk i cells, then look */"),
 P("Identical — brackets are sugar for the second form. Mind the parentheses though: <code>*(word + 2)</code> navigates, while <code>*word + 2</code> fetches the first character and adds two to it. Same symbols, unrelated results."),
 K("Use brackets. Pointer arithmetic is elegant and earns you nothing in an exam, while costing you bugs.")],
quiz:[
 Q("How many bytes does \"cat\" occupy?",["3","4","5","6","Depends on the system"],1,"Three letters plus the terminator.","Length is three, space taken is four. Confusing the two is exactly what produces the missing plus-one when you start allocating memory."),
 Q("With str = \"cat\", what is i when the walking loop stops?",["2","3","4","0","Undefined"],1,"Occupied indexes are 0, 1 and 2, so the condition fails at 3.","And the body never executed at that position — which is why a copy has to write the terminator by hand afterwards."),
 Q("str[i] is equivalent to which expression?",["&str + i","*(str + i)","*str + i","str + *i","&(str[i])"],1,"Add the offset to the address first, then look inside.","The third option is the trap: it dereferences first and then adds, yielding a number derived from the first character rather than a navigation."),
 Q("What is an empty string, in memory?",["Nothing at all","A NULL pointer","One byte holding the terminator","A pointer to zero","An array of length zero"],2,"One real byte, which is why reading position zero is safe.","Assignments test with an empty string constantly, and the correct behaviour usually falls out for free if your loop condition is written properly."),
 Q("Why write while (str[i] != '\\0') instead of while (str[i])?",["The short form is invalid","The short form is slower","They are identical; the long form states intent","The long form is required by the Norm","The short form fails on empty strings"],2,"Both compile to the same thing and both pass the Norm.","At defence you may be asked why the short form works. If you cannot answer <i>because the terminator is zero and zero is false</i>, the short form is costing you.")],
debug:[
 D("i = 0;\nwhile (src[i] != '\\0')\n{\n\tdst[i] = src[i];\n\ti++;\n}\nreturn (dst);","The copy prints correctly followed by garbage. Why?",["dst was never allocated","The terminator is never written into dst","The condition should test dst","The index starts wrong","src was not terminated"],1,"The loop stops at the source terminator without copying it, so the destination has no end flag.","Sometimes it appears to work, when the following memory happens to be zero. That intermittency is what makes it dangerous rather than merely annoying."),
 D("i = 0;\nwhile (str[i] != '\\0')\n\ti++;\nstr[i - 1] = '\\0';","This is meant to leave the string unchanged. What does it actually do?",["Nothing","Removes the last character","Adds a character","Crashes","Doubles the string"],1,"The index sits on the terminator, so stepping back one lands on the final real character and overwrites it.","Off-by-one applied to the terminator. If you want to keep the string intact you write at the index itself, not one before it."),
 D("while (str[i] != '\\0')\n{\n\tft_putchar(str[i]);\n\ti++;\n}","With a fresh function, this sometimes prints nothing and sometimes garbage. Why?",["str is NULL","The index was never initialised","The terminator test is wrong","ft_putchar is broken","The loop needs braces"],1,"An uninitialised index holds whatever was on the stack, so the walk starts at a random offset.","It may start beyond the terminator and print nothing, or start inside and print a fragment. Uninitialised variables produce exactly this kind of inconsistent symptom."),
 D("char\ts[3];\n\ns[0] = 'h';\ns[1] = 'i';\ns[2] = '\\0';\ns[3] = '\\0';","Three of these four lines are fine. Which one is not, and why?",["Line 1, the array is too small","Line 3, the terminator is misplaced","Line 4, index 3 is outside an array of size 3","Line 2, the character needs double quotes","None, it is correct"],2,"An array of size three has valid indexes 0, 1 and 2 only.","Line three already terminated the string correctly. The extra write is a buffer overflow by one byte — silent, and corrupting whatever sits next."),
 D("if (str[i] == \"a\")\n\tn++;","This does not compile. Why?",["Double quotes make a string, not a character","The comparison should be assignment","str must be an array","The index is missing","n must be initialised"],0,"Double quotes create a pointer to a two-byte string; single quotes create one character.","Comparing a char against a char pointer is a type mismatch. With -Werror it is refused outright, which is the flags doing exactly the job they exist for.")],
practice:[
 R("Write the walk-to-the-terminator skeleton from memory.","Three pieces and the right stop condition.","i = 0;\nwhile (str[i] != '\\0')\n{\n\ti++;\n}",["Index set before the loop","<code>!=</code> against the quoted terminator","Braces opened and closed","Step in the body"],"Write it ten times by hand. Once automatic, you will notice only the body ever changes between exercises."),
 R("A copy loop just ended with <code>i</code> in the right place. Write the single line that finishes the string.","The loop exited before doing this.","copy[i] = '\\0';",["Assigns at <code>copy[i]</code>, not one past it","Quoted terminator with the backslash","Semicolon present"],"The loop stops at the terminator without copying it, leaving the index exactly where the flag belongs."),
 R("Write <code>count_char</code>: how many times a given character appears in a string.","The mother pattern with a counter inside.","int\tcount_char(char *str, char target)\n{\n\tint\ti;\n\tint\tn;\n\n\ti = 0;\n\tn = 0;\n\twhile (str[i] != '\\0')\n\t{\n\t\tif (str[i] == target)\n\t\t\tn++;\n\t\ti++;\n\t}\n\treturn (n);\n}",["Two declarations with a blank line after","Counter and index kept separate","Step outside the if"],"Two counters advancing under different conditions is the shape of a great many exercises."),
 R("Write the same character access twice: once with brackets, once with pointer arithmetic, for the third character of <code>word</code>.","Remember which index is the third one.","word[2]\n*(word + 2)",["Index 2, not 3","Parentheses around the addition","Asterisk outside the parentheses"],"Drop those parentheses and the meaning changes entirely, which is the main argument for brackets.")],
assign:[
 S("C01","ft_strlen","int ft_strlen(char *str);","None","Count the characters of a string, not counting the terminator.","The return type is int here rather than the library's size_t. Follow the brief, not your memory of the real function."),
 S("C04","ft_strlen","int ft_strlen(char *str);","None","The same function again inside the conversion module.","Deliberate repetition. Rewriting from memory instead of copying the old file is the whole point of it appearing twice."),
 S("C02","ft_putstr_non_printable","void ft_putstr_non_printable(char *str);","write","Print a string, but render every non-printable character as a backslash followed by its two-digit hexadecimal value in lowercase.","Values below sixteen still need two digits, so a leading zero is required. That padding is where most attempts fail.")],
chall:[
 X("ft_strlen","Count the characters of a string.","P2","A function, not a program. Check the required return type in the brief."),
 X("ft_strrev","Reverse a string in place and return it.","P2","In place means no second buffer. Two indexes moving towards each other, and the return value is the parameter itself."),
 X("rev_print","Print a string backwards followed by a newline.","P1, P2","Find the end first, then walk back. Two passes, and an empty argument must still behave.")]},

{id:"copy",grp:"Strings",tit:"Copying & bounded copying",
lead:"Copying looks trivial until the destination is too small, or the bound is measured against the wrong thing. Three library functions exist precisely because two of them are dangerous.",
theory:[
 P("Copying is the walking loop with an assignment inside, plus the flag you place yourself afterwards. That is the whole mechanism. What varies between the three variants is <b>what limits the work</b>."),
 TB(["Function","What the limit means","Guarantees a terminator?"],[["<code>strcpy</code>","no limit at all","yes, it copies the source's"],["<code>strncpy</code>","at most n characters <b>from the source</b>","<b>no</b>"],["<code>strlcpy</code>","the total <b>size of the destination</b>","yes, if size is above zero"]]),
 W("<b>strncpy has two behaviours, not one.</b> If the source is shorter than n, it copies it and then pads the remaining bytes with zeros — not one zero, all of them. If the source is n characters or longer, it copies n and writes <b>no terminator at all</b>, leaving something that is not a valid string."),
 K("That second case looks like a bug and is the documented behaviour. The brief says <i>reproduce</i>, not <i>improve</i>. Run <code>man strncpy</code> and read the prose, not the example."),
 H("What strlcpy returns"),
 P("It does not return the destination. It returns the <b>length of the source</b> — the number of characters it would have written had there been room. That lets a caller detect truncation by comparing the result against the size it passed in."),
 W("The destination must have room for the content <b>plus</b> the terminator. None of these functions checks, and none allocates. Overflowing here is silent and corrupts whatever sits next in memory."),
 H("The read-only trap"),
 C("char\tmine[] = \"porto\";\nchar\t*borrowed = \"porto\";"),
 TB(["","<code>char *s = \"...\"</code>","<code>char s[] = \"...\"</code>"],[["What it is","pointer to a constant","your own array"],["Where it lives","read-only section","your stack"],["<code>s[0] = 'P';</code>","<b>crash</b>","works"],["<code>sizeof(s)</code>","8, the pointer","6, the contents"]]),
 I("Both compile without a warning. <code>argv[1]</code> <b>is</b> writable because arguments live in your memory; a literal written in your source is not. That difference is why some briefs forbid modifying the input and others allow it.")],
quiz:[
 Q("With strncpy, the source is shorter than n. What happens to the rest of the destination?",["Left untouched","One terminator is added","Every remaining byte is filled with zeros","It is filled with spaces","Undefined"],2,"The padding is complete, not a single terminator.","This is the half of the behaviour almost everyone misses, and it is the half that a thorough tester checks. It also means strncpy can be far more expensive than it looks."),
 Q("With strncpy, the source is longer than n. Is the destination a valid string?",["Yes, always","Yes, if n is above zero","No, no terminator is written","Only if the source had one","It depends on the compiler"],2,"It copies exactly n characters and stops, terminator or not.","The name suggests safety and delivers the opposite. This is precisely why strlcpy was invented and why its bound means something different."),
 Q("What does strlcpy return?",["The destination pointer","The number of bytes copied","The length of the source","The remaining space","Zero on success"],2,"The source length, so the caller can detect truncation.","Comparing the return value against the size you passed tells you whether everything fit. Returning the destination, as strcpy does, would carry no information at all."),
 Q("char *s = \"abc\"; s[0] = 'A'; What happens?",["s becomes Abc","Compile error","A crash at run time","The assignment is silently ignored","Undefined but usually fine"],2,"The literal lives in read-only memory.","Its cousin, the array form, copies the literal onto your stack and is fully writable. The declarations look almost identical, which is what makes this so common."),
 Q("Whose responsibility is the destination's size?",["The copy function checks it","The compiler checks it","The caller, entirely","The operating system","malloc"],2,"None of these functions allocates or verifies anything.","This is the defining property of the C string library and the reason buffer overflows dominated security bugs for decades. The bounded variants shift the responsibility but never remove it.")],
debug:[
 D("i = 0;\nwhile (i < n)\n{\n\tdest[i] = src[i];\n\ti++;\n}","Copying with a bound. What is missing compared with a correct bounded copy?",["The terminator, and no check for the source ending early","Nothing","The index should start at 1","The bound should be <code>&lt;=</code>","dest must be allocated first"],0,"It walks past the source's terminator when the source is shorter than n, copying garbage.","A correct version stops at whichever comes first, with the source check guarded by short-circuit, and then decides what to do about the remaining bytes."),
 D("char\tdest[5];\n\ni = 0;\nwhile (src[i] != '\\0')\n{\n\tdest[i] = src[i];\n\ti++;\n}\ndest[i] = '\\0';","This is correct C and still dangerous. Why?",["The terminator is misplaced","Nothing bounds the loop to the size of dest","The array should be a pointer","The index is wrong","<code>src</code> may be NULL"],1,"The loop is bounded by the source, not by the destination's capacity.","With a source longer than four characters you write past the array. The fix is a second condition on the index — and, by short-circuit, the bound check belongs first."),
 D("unsigned int\ti;\n\ni = size - 1;\nwhile (i >= 0)\n\ti--;","This never ends. Why?",["The condition should be <code>&gt;</code>","An unsigned value is never below zero, so the test is always true","size is uninitialised","The step is wrong","It needs braces"],1,"When an unsigned counter drops below zero it wraps to the maximum instead.","Backwards loops with unsigned counters are a classic trap. Either use a signed type, or restructure the condition so it never needs to represent minus one."),
 D("char\t*dest;\n\ndest = \"aaaaa\";\ni = 0;\nwhile (src[i] != '\\0')\n{\n\tdest[i] = src[i];\n\ti++;\n}","This crashes. Where is the mistake?",["The loop is unbounded","dest points at a literal, which is read-only","src is not terminated","The index is uninitialised","dest needs a size"],1,"Assigning a literal to a pointer makes it point into read-only memory.","Changing the declaration to an array form copies the literal onto the stack and makes it writable. The loop is separately unbounded, but the crash comes first."),
 D("dest[size - 1] = '\\0';","Part of a bounded copy. When is this line wrong?",["Never","When size is zero","When size equals the source length","When dest is a pointer","When the source is empty"],1,"With size zero the index is minus one, writing before the start of the buffer.","Any bounded string function needs an explicit decision about size zero, and the documented behaviour is usually to write nothing at all rather than to guess.")],
practice:[
 R("Write a modifiable string holding <code>cat</code>, then uppercase its first letter.","Only one of the two declaration forms allows this.","char\tmine[] = \"cat\";\n\nmine[0] = 'C';",["Square brackets, not an asterisk","Double quotes on the literal","Single quotes on the character"],"With the pointer form the same assignment crashes at run time, with no compiler warning."),
 R("Fix this so it works, changing only the declaration:<br><code>char *s = \"abc\"; s[1] = 'B';</code>","One character moves.","char\ts[] = \"abc\";\n\ns[1] = 'B';",["Asterisk replaced by brackets","Literal unchanged","Assignment line unchanged"],"The array form copies the literal onto your stack rather than pointing at the original."),
 R("Write a copy loop bounded by <b>both</b> the source terminator and a maximum <code>n</code>, in the safe order.","Two conditions. One of them protects the other.","i = 0;\nwhile (i < n && src[i] != '\\0')\n{\n\tdest[i] = src[i];\n\ti++;\n}",["Bound check comes first","<code>&&</code> joining them","Assignment inside the body","Step present"],"Putting the index bound first means the source is never read at an offset you have not validated."),
 R("Write the loop that pads the remaining bytes of a destination with terminators, from index <code>i</code> up to <code>n</code>.","A second loop, continuing from where the first stopped.","while (i < n)\n{\n\tdest[i] = '\\0';\n\ti++;\n}",["Continues from the existing index, not from zero","Bound is <code>&lt; n</code>","Writes the quoted terminator"],"Reusing the index rather than resetting it is what makes the two loops compose into one pass.")],
assign:[
 S("C02","ft_strcpy","char *ft_strcpy(char *dest, char *src);","None","Reproduce the behaviour of strcpy: copy the source into the destination, terminator included, and return the destination.","The return value is easy to forget because you never use it in your own test. The Moulinette does use it."),
 S("C02","ft_strncpy","char *ft_strncpy(char *dest, char *src, unsigned int n);","None","Reproduce strncpy, including both of its behaviours.","Read the man page prose. The padding case and the no-terminator case are both required, and the second one feels wrong until you accept that reproduce means reproduce."),
 S("C02","ft_strlcpy","unsigned int ft_strlcpy(char *dest, char *src, unsigned int size);","None","Reproduce strlcpy, whose bound is the destination size and whose return value is the source length.","Two things differ from the previous exercise at once: what the limit measures, and what comes back. And size zero needs a decision.")],
chall:[
 X("ft_strcpy","Copy a string into a destination, terminator included, returning the destination.","P2, P6","Return the destination pointer, and remember the flag is not copied by the loop."),
 X("search_and_replace","Given a string and two single characters, print the string with every occurrence of one replaced by the other.","P1, P6","The second and third arguments must each be exactly one character. Anything else, and the brief says print only a newline.")]},
{id:"compare",grp:"Strings",tit:"Comparing, searching & sets",
lead:"Walking two strings at once, deciding when they differ, and answering questions about membership. The whole family runs on one idea: which index advances, and when.",
theory:[
 P("Comparison returns a <b>difference</b>, not a yes or no. Zero means identical; negative means the first string sorts earlier; positive means later. The sign comes from subtracting the two characters at the first position where they disagree."),
 C("while (s1[i] != '\\0' && s1[i] == s2[i])\n\ti++;\nreturn (s1[i] - s2[i]);"),
 K("Notice why that needs no special case for the end: the terminator is zero, so subtracting it against a real character yields the right sign automatically. A string that is a prefix of a longer one comes out negative for free."),
 W("<b>The signed char trap.</b> On most systems a plain <code>char</code> runs from -128 to 127, so any byte above 127 is negative. Subtracting two of those inverts the result. The library casts to <code>unsigned char</code> first, and so should you."),
 W("<b>Using the call directly as a condition inverts your meaning.</b> Zero is false, so <code>if (ft_strcmp(a, b))</code> fires when the strings <i>differ</i>. Compare against zero explicitly, always."),
 H("Bounded comparison"),
 P("A maximum means the loop stops for two reasons instead of one. When that bound is an <code>unsigned int</code>, never subtract from it — write the condition so the arithmetic sits on the other side, or a bound of zero runs away from you."),
 H("Searching one string inside another"),
 P("Substring search needs <b>two indexes moving at different speeds</b>: one marking where the current attempt started, one advancing through the candidate match. A mismatch resets the second and nudges the first forward by one."),
 A("haystack: a  b  a  b  c\n          ▲\n          i (attempt start)\n             ▲\n             j (match progress)\n\nmismatch -> j back to 0, i moves to 1"),
 I("An empty needle is found immediately, at the very beginning. Briefs state this, and it usually falls out for free when the loop is written properly."),
 H("Subsequence versus substring"),
 P("Two questions that look alike. A <b>substring</b> must appear contiguously. A <b>subsequence</b> only needs its characters in order, with anything in between. The second is far cheaper: one index per string, and the first advances only on a match."),
 H("Sets: have I seen this already?"),
 TB(["Approach","How","Trade-off"],[["Look back","before emitting, scan what you already emitted","slower, no extra memory"],["Mark table","an array of 256 slots, one per possible byte","fast, needs the array"]]),
 P("Both are accepted. The first is easier to defend out loud; the second shows you understood that a character <i>is</i> an index.")],
quiz:[
 Q("What does a comparison function return when the strings are identical?",["1","0","-1","The length","Undefined"],1,"Zero means no difference was found.","Which is why using the call directly as a condition inverts your meaning. Zero is false, so the branch fires when they differ."),
 Q("Why cast to unsigned char before subtracting?",["It is faster","Because plain char may be signed, giving wrong signs above 127","To avoid overflow","The Norm requires it","To handle NULL"],1,"Bytes above 127 become negative in a signed char and invert the comparison.","It only surfaces with accented or extended characters, which is why it survives casual testing. Graders test with them precisely because it is a known blind spot."),
 Q("\"Port\" against \"Porto\" — what is the sign of the result?",["Positive","Negative","Zero","Undefined","Depends on the length"],1,"At the fifth position the first holds the terminator, zero, against the letter o.","Zero minus a positive value is negative, so a prefix always sorts earlier. No special case needed."),
 Q("What distinguishes a subsequence from a substring?",["Nothing","A substring must be contiguous, a subsequence need not be","A subsequence must be contiguous","Subsequences ignore case","Substrings ignore spaces"],1,"Order matters for both; adjacency matters only for the substring.","The subsequence version needs one index per string. The substring version needs a restart mechanism, which is considerably more work."),
 Q("You must print characters with no repeats. Which approach uses no extra memory?",["A table of 256 slots","Sorting first","Scanning what you already emitted","Using a hash","It cannot be done"],2,"Looking back trades time for space.","With short inputs the difference is irrelevant. Choose the one you can explain confidently, because that is what gets tested at defence.")],
debug:[
 D("while (s1[i] == s2[i] && s1[i] != '\\0')\n\ti++;","Two problems live in this single line. Which?",["Only the order is wrong","Only the index is uninitialised","The order is wrong and the index is uninitialised","The comparison should be an assignment","Nothing is wrong"],2,"The guard must come first, and nothing has set the index.","Comparing before verifying you are inside reads past the terminator of the shorter string. Short-circuit protects you only when the protective test is written first."),
 D("if (ft_strcmp(a, b))\n\tft_putstr(\"equal\");","This prints the wrong word. Why?",["The function returns a pointer","Zero means equal, and zero is false","The arguments are swapped","It needs double negation","strcmp is forbidden"],1,"The condition is true exactly when the strings differ.","Writing the comparison against zero removes the ambiguity for good. It then reads as a question rather than as a truth value, which is what it actually is."),
 D("unsigned int\tn;\n\ni = 0;\nwhile (i < n - 1 && s1[i] == s2[i])\n\ti++;","With n at zero this runs almost forever. Why?",["The strings are too short","Subtracting from an unsigned zero wraps to the maximum","The order is wrong","i should be unsigned too","The comparison is inverted"],1,"Zero minus one on an unsigned type produces the largest representable value.","Move the arithmetic to the other side so the test becomes index plus one against n. Same meaning, no wraparound."),
 D("j = 0;\nwhile (str[i] != '\\0')\n{\n\tif (str[i] == find[j])\n\t\tj++;\n\ti++;\n}","Used to answer the substring question, this is wrong. Why?",["It never resets j on a mismatch","The indexes are swapped","It should use <code>&&</code>","find may be empty","It reads past the end"],0,"Without a reset it accepts characters scattered anywhere, which answers the subsequence question instead.","The two problems look almost identical and need different machinery. Deciding which the brief asks for, before writing, saves the whole rewrite."),
 D("i = 0;\nwhile (s1[i] != '\\0' && s2[i] != '\\0')\n{\n\tif (s1[i] != s2[i])\n\t\treturn (1);\n\ti++;\n}\nreturn (0);","This calls two strings equal when they are not. When?",["Never","When one is a prefix of the other","When both are empty","When they differ in the last character","When one contains a space"],1,"The loop ends as soon as either string finishes, so the longer one's extra characters are never examined.","Guarding both feels safer and is weaker. Guarding one and comparing against the other catches the length difference automatically, because the terminator takes part in the comparison.")],
practice:[
 R("Write the comparison loop condition that walks two strings safely, in the correct order.","One guard, one comparison.","while (s1[i] != '\\0' && s1[i] == s2[i])\n\ti++;",["Terminator guard first","<code>&&</code> joining them","Only one string needs guarding","Step present"],"Guarding the first string alone suffices: if the second ends earlier, its terminator differs from the first's character and the loop stops anyway."),
 R("Write the return line that turns two characters into a signed difference, safe for extended bytes.","One cast on each side.","return ((unsigned char)s1[i] - (unsigned char)s2[i]);",["Cast on both operands","Subtraction, not comparison","Whole expression in parentheses"],"Casting only one side is worse than casting neither, because the mismatch then hides behind an implicit promotion."),
 R("Write <code>in_set</code>: returns 1 if a character appears anywhere in a set string, 0 otherwise.","The walking loop with an early return.","int\tin_set(char c, char *set)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (set[i] != '\\0')\n\t{\n\t\tif (set[i] == c)\n\t\t\treturn (1);\n\t\ti++;\n\t}\n\treturn (0);\n}",["Returns 1 from inside the loop","Returns 0 after it","Step outside the if"],"This helper underpins every set exercise and every split that takes a separator string."),
 R("Write the subsequence check: does every character of <code>a</code> appear inside <code>b</code>, in order?","Two indexes. Only one advances unconditionally.","i = 0;\nj = 0;\nwhile (b[j] != '\\0')\n{\n\tif (a[i] == b[j])\n\t\ti++;\n\tj++;\n}",["Both indexes initialised","<code>i</code> advances only on a match","<code>j</code> advances every pass","The loop is driven by <code>b</code>"],"Afterwards, checking whether a's index landed on its terminator answers the question.")],
assign:[
 S("C03","ft_strcmp","int ft_strcmp(char *s1, char *s2);","None","Reproduce strcmp.","The return value is a difference, not a flag. The extended-character case separates a working version from a correct one."),
 S("C03","ft_strncmp","int ft_strncmp(char *s1, char *s2, unsigned int n);","None","Reproduce strncmp, comparing at most n characters.","The bound is unsigned. Write the condition so nothing is ever subtracted from it, or a bound of zero will run away."),
 S("C03","ft_strstr","char *ft_strstr(char *str, char *to_find);","None","Reproduce strstr: find the first occurrence of one string inside another and return a pointer to it.","Two indexes at different speeds, with a reset on mismatch. An empty needle returns the haystack itself.")],
chall:[
 X("ft_strcmp","Compare two strings and return their difference.","P2, P6","Zero means equal. The sign matters, and the terminator takes part."),
 X("wdmatch","Given two strings, print the first if its characters appear in order inside the second.","P1, P6","Subsequence, not substring. Print nothing at all when it does not match."),

{id:"concat",grp:"Strings",tit:"Concatenating & buffer safety",
lead:"Joining strings is where buffer overflows are born. The mechanism is two loops; the danger is that nothing in the language checks whether the result fits.",
theory:[
 P("Concatenation is two walks in sequence. First you travel to the end of the destination without touching it. Then, from that point, you copy the source in. Finally you place the terminator yourself."),
 A("dest before:  [ o ][ l ][ a ][\\0][   ][   ][   ][   ]\n                              ▲\n                the first walk stops here — copying begins here"),
 W("<b>The destination must already be a valid string.</b> If its terminator is missing, or sits outside its allocated space, the first walk runs into memory that is not yours before any copying starts."),
 W("<b>Nothing checks the size.</b> The destination needs room for its current contents, plus the source, plus one byte. These functions never allocate and never verify. Overflowing is completely silent."),
 K("This is more dangerous than copying, because the required size depends on <b>two</b> contents rather than one. You cannot judge it by looking at either string alone."),
 H("What each bound actually measures"),
 TB(["Function","The limit means","Returns"],[["<code>strcat</code>","nothing — no limit","the destination"],["<code>strncat</code>","at most n characters <b>from the source</b>","the destination"],["<code>strlcat</code>","the total <b>size of the destination buffer</b>","the length it tried to create"]]),
 I("Same distinction as in the copy family, and it catches people twice. In the n variant the bound counts source characters; in the l variant it counts the whole buffer, existing contents included."),
 P("The l variant returns the length of the string it would have produced. Comparing that against the size you passed reveals truncation — information the other two simply discard."),
 H("The hidden cost"),
 P("Every call walks the destination from the start just to find its end. Concatenating inside a loop therefore re-walks an ever-growing string on each pass, turning what looks linear into something quadratic. Worth knowing before your first large project."),
 W("Overlapping buffers are undefined. If source and destination share memory, nothing is guaranteed — no diagnostic, no consistency.")],
quiz:[
 Q("Before copying begins, what must the destination already have?",["Enough space only","A valid terminator inside its own bounds","Its first byte zeroed by the compiler","The same length as the source","Nothing in particular"],1,"The first walk searches for that terminator, and searches beyond the buffer if it is not there.","This is why appending into an uninitialised array is undefined even when the array is huge. Uninitialised memory rarely holds a zero exactly where you need one."),
 Q("In the n variant, what does the bound count?",["Bytes in the destination","Characters taken from the source","The total result length","Bytes of free space","Words"],1,"It limits how much of the source is taken, not how large the result may grow.","So the destination must hold its existing length plus n plus one. The bound alone tells you nothing about safety — which is exactly the flaw the l variant was invented to fix."),
 Q("What does the l variant return?",["The destination","The number of bytes appended","The length it attempted to create","Zero on success","The remaining space"],2,"That value, compared against the size you passed, reveals truncation.","Returning the destination carries no information — the caller already had it. This return value is the entire reason the function exists."),
 Q("Why is concatenating inside a loop a performance trap?",["malloc is slow","Each call re-walks the whole destination to find its end","The terminator is rewritten","It fragments memory","It is not a trap"],1,"The search for the end restarts from the beginning every single time.","With n appends onto a growing string, total work grows with the square of the length. Tracking the end position yourself restores a single pass."),
 Q("Source and destination overlap in memory. What is guaranteed?",["Truncation","Nothing — the behaviour is undefined","It works but slowly","It returns NULL","The overlap is skipped"],1,"Undefined means no diagnostic and no consistency.","It may work on your machine and corrupt data on another. The same overlap question returns later with memory-moving functions, where two variants exist precisely because of it.")],
debug:[
 D("i = 0;\nwhile (dest[i] != '\\0')\n\ti++;\nj = 0;\nwhile (src[j] != '\\0')\n{\n\tdest[i] = src[j];\n\tj++;\n}","The result is wrong. What is missing?",["The destination index never advances while copying","The end search is wrong","<code>j</code> should start at <code>i</code>","The loops should be merged","Nothing is missing"],0,"Only the source index moves, so every character overwrites the same position.","Either advance both indexes, or keep one and offset the destination access by the other. Mixing the two approaches halfway is what produces this."),
 D("i = 0;\nwhile (dest[i] != '\\0')\n\ti++;\nj = 0;\nwhile (src[j] != '\\0')\n{\n\tdest[i + j] = src[j];\n\tj++;\n}\nreturn (dest);","This is nearly correct. What is still missing?",["The terminator after the appended part","The return value","The initial search","A bound on <code>j</code>","Nothing"],0,"The loop stops at the source terminator without copying it, so the result has no end flag.","The flag belongs at the sum of the two indexes, where the loop left off. Same rule as copying: the loop exits just before the terminator."),
 D("char\tdest[10] = \"hello\";\n\nft_strcat(dest, \" world\");","This compiles and corrupts memory. Why?",["The array is not a string","The result needs twelve bytes and only ten exist","The source is a literal","The array should be a pointer","strcat is forbidden"],1,"Five existing characters, six appended, plus the terminator makes twelve.","Nothing warns you. The extra bytes land on whatever follows on the stack, and the failure appears much later, somewhere unrelated to the cause."),
 D("char\tdest[20];\n\nft_strcat(dest, \"hello\");","The array is plenty large. Why is this still undefined?",["The source is too short","The destination was never initialised, so it holds no terminator","20 is not a power of two","strcat needs three arguments","Nothing is wrong"],1,"The end search walks through uninitialised bytes until it happens to meet a zero.","It may find one immediately and appear to work, or run past the array entirely. Setting the first byte to the terminator first makes it a valid empty string."),
 D("i = 0;\nwhile (dest[i] != '\\0' && i < size)\n\ti++;","A bounded version searches for the end like this. What is wrong?",["The bound should be <code>&lt;=</code>","The two conditions are in the wrong order","<code>size</code> should be signed","The index should start at 1","Nothing is wrong"],1,"The buffer is read before the bound has been verified.","With a destination holding no terminator inside its size, this reads one position beyond before the guard is consulted. The cheap, safe test always goes first.")],
practice:[
 R("Write the first phase of a concatenation: walk to the end of the destination without modifying it.","The mother pattern, applied to the destination.","i = 0;\nwhile (dest[i] != '\\0')\n\ti++;",["Index initialised","Tests the destination, not the source","No assignment inside the loop"],"Afterwards the index sits exactly where the appended content must begin, which is the entire purpose of this phase."),
 R("Write the second phase: copy the source in starting at index <code>i</code>, then finish the string properly.","Two indexes, and the flag afterwards.","j = 0;\nwhile (src[j] != '\\0')\n{\n\tdest[i + j] = src[j];\n\tj++;\n}\ndest[i + j] = '\\0';",["Destination offset by <code>i</code>","Only <code>j</code> drives the loop","Terminator written after the loop at the summed index"],"Using the sum rather than advancing both keeps the loop condition simple and the intent obvious."),
 R("Write the safe end-search condition when the buffer size is known.","Guard first, access second.","while (i < size && dest[i] != '\\0')\n\ti++;",["Bound check first","<code>&&</code> joining them","No subtraction from the size"],"If the loop ends because the bound was reached rather than a terminator found, the buffer was never a valid string and the caller needs to know."),
 R("Write the two lines that turn a freshly declared array into a valid empty string, ready to append to.","One assignment is enough.","char\tdest[20];\n\ndest[0] = '\\0';",["Writes at index 0","Quoted terminator","Declaration itself left uninitialised"],"One byte turns undefined behaviour into a well-defined empty string. It costs nothing and removes a whole class of bug.")],
assign:[
 S("C03","ft_strcat","char *ft_strcat(char *dest, char *src);","None","Reproduce strcat: append the source to the destination and return the destination.","Two phases, and the terminator is yours to place. The destination must already be a valid string before you start."),
 S("C03","ft_strncat","char *ft_strncat(char *dest, char *src, unsigned int nb);","None","Reproduce strncat, appending at most nb characters from the source.","Unlike the copy family's n variant, this one always terminates the result. Check the man page rather than assuming symmetry."),
 S("C03","ft_strlcat","unsigned int ft_strlcat(char *dest, char *src, unsigned int size);","None","Reproduce strlcat, whose bound is the whole destination buffer and whose return value reports the intended length.","Two departures at once: what the bound measures, and what comes back. A size smaller than the existing content still needs a defined answer.")],
