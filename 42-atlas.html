{id:"transform",grp:"Strings",tit:"Transforming a string in place",
lead:"Reading a string is safe. Rewriting it as you walk introduces a new question on every character: does this one change, and does the answer depend on what came before it?",
theory:[
 P("An in-place transformation is the walking loop with an assignment back into the same array. No second buffer, no allocation, and the function usually returns the very pointer it received."),
 C("i = 0;\nwhile (str[i] != '\\0')\n{\n\tstr[i] = transform(str[i]);\n\ti++;\n}\nreturn (str);"),
 W("<b>You can only do this if the memory is yours.</b> A string declared as a pointer to a literal lives in read-only memory and crashes on the first write. The array form is a writable copy. Arguments received from the command line are writable."),
 H("Stateless versus stateful transformations"),
 P("Swapping case, shifting letters, mirroring the alphabet — each character is decided entirely on its own. These are <b>stateless</b>, and the loop body is a single conditional expression."),
 P("Capitalising words is different. Whether a letter becomes uppercase depends on <b>what preceded it</b>. That makes it stateful, and the state is usually just the answer to one question: was the previous character a separator?"),
 K("Give that state a name in your head before you write code: <i>am I at the start of a word right now?</i> Everything else follows from it."),
 H("The guard always comes first"),
 W("Applying a conversion unconditionally mangles everything that is not a letter. A space shifted by 32 becomes an unprintable byte; a digit becomes punctuation. Classify first, convert second — always."),
 H("Alphanumeric, not just alphabetic"),
 P("Capitalisation briefs usually treat digits as part of a word, so a letter following a digit is <b>not</b> a word start. Read which characters count as separators before deciding what your state machine does."),
 I("Write a tiny helper for the transformation and a tiny helper for the test, then let the loop stay four lines. Three small functions read better than one clever one, and they fit the Norm's line limit comfortably.")],
quiz:[
 Q("Why does an in-place transformation usually return the pointer it received?",["To signal success","So calls can be chained and the caller keeps a handle","Because the Norm requires it","To free the caller from tracking it","It returns a copy"],1,"Returning the same pointer lets the result be used directly inside another expression.","It carries no new information, but it matches the library convention. The brief will state the return type — follow it even when your own tests never use the value."),
 Q("Which transformation is stateful?",["Swapping the case of every letter","Shifting each letter by thirteen","Capitalising the first letter of each word","Mirroring the alphabet","Uppercasing everything"],2,"The decision depends on the previous character, not just the current one.","Everything else in the list is decided per character in isolation. Recognising which kind you are facing tells you immediately whether you need a state variable."),
 Q("A capitalisation brief treats digits as part of a word. What does that mean for the letter after a digit?",["It becomes uppercase","It stays lowercase, because it is not at a word start","It is skipped","It becomes a separator","Undefined"],1,"The digit did not end the word, so the letter is inside it.","This is the detail that separates a passing attempt from a failing one, and it is stated in the brief rather than being a convention you can guess."),
 Q("What happens if you convert without a guard?",["Only letters change","Non-letters get shifted into other characters","The loop stops early","The terminator is lost","Nothing"],1,"Arithmetic applies to whatever byte is there, letter or not.","A space becomes an unprintable control byte and a digit becomes punctuation. The symptom is a mangled string that still has the right length."),
 Q("You must transform a string received as a command-line argument. Is writing to it allowed?",["Never","Yes, those live in writable memory","Only after copying it","Only if it is short","Only the first character"],1,"Program arguments are placed in memory belonging to your process.","A literal written in your source is not. That is why some briefs forbid modifying the input while others allow it — they are talking about where the string lives.")],
debug:[
 D("i = 0;\nwhile (str[i] != '\\0')\n{\n\tstr[i] = str[i] - 'A' + 'a';\n\ti++;\n}","Applied to a mixed string, what goes wrong?",["Nothing","Every non-uppercase character is mangled too","Only the first letter changes","It hangs","It writes past the end"],1,"The conversion runs unconditionally, so spaces, digits and lowercase letters are all shifted.","A space drops to an unprintable value and a lowercase letter runs past z. Every transformation needs its classification test wrapped around it."),
 D("char\t*s;\n\ns = \"hello\";\ni = 0;\nwhile (s[i] != '\\0')\n{\n\ts[i] = s[i] - 32;\n\ti++;\n}","This crashes immediately. Why?",["The loop is unbounded","The pointer refers to a literal, which is read-only","The subtraction overflows","The index is uninitialised","32 is the wrong constant"],1,"Assigning a literal to a pointer makes it point into read-only memory.","Declaring it as an array copies the literal onto the stack and makes it writable. The unconditional conversion is a separate bug, but the crash arrives first."),
 D("start = 1;\ni = 0;\nwhile (str[i] != '\\0')\n{\n\tif (start == 1 && str[i] >= 'a' && str[i] <= 'z')\n\t\tstr[i] = str[i] - 32;\n\ti++;\n}","Only the very first letter is capitalised. Why?",["The state is never updated inside the loop","The range test is wrong","The index starts wrong","<code>start</code> should be zero","It needs an else"],0,"Nothing ever sets the state back on or off, so after the first character it stays whatever it was.","A stateful transformation needs the state recomputed on every pass, based on the character just processed. Forgetting that turns it into a one-shot."),
 D("if (str[i] == ' ')\n\tstart = 1;\nelse\n\tstart = 0;\nif (start == 1)\n\tstr[i] = to_upper(str[i]);","The capitalisation lands one character late. Why?",["The state is updated before it is used","The comparison should be <code>!=</code>","<code>to_upper</code> is wrong","The else is unnecessary","Nothing is wrong"],0,"By the time the state is read, it already describes the current character rather than the previous one.","Either read the state before updating it, or base the test on the character at the previous index. Mixing the two orders is what produces the off-by-one."),
 D("while (str[i] != '\\0')\n{\n\tstr[i] = to_lower(str[i]);\n}\ni++;","This hangs. What is wrong?",["The helper is broken","The step sits outside the loop because braces are missing around both statements","The condition is inverted","The index needs to be unsigned","Nothing is wrong"],1,"The braces enclose only the assignment; the increment runs once, after the loop has already ended.","Indentation is lying here. Whenever a loop body should contain two statements, check that the braces actually enclose both.")],
practice:[
 R("Write <code>to_upper</code>: returns the uppercase form if the character is a lowercase letter, unchanged otherwise.","Guard first, convert second.","char\tto_upper(char c)\n{\n\tif (c >= 'a' && c <= 'z')\n\t\treturn (c - 'a' + 'A');\n\treturn (c);\n}",["Range check before converting","<code>c - 'a' + 'A'</code>, not <code>c - 32</code>","Non-letters returned unchanged"],"The guard is what makes it safe on mixed input, which is exactly what every real brief tests with."),
 R("Write the in-place loop that applies a transformation helper to every character and returns the string.","The mother pattern with an assignment back into the array.","i = 0;\nwhile (str[i] != '\\0')\n{\n\tstr[i] = to_upper(str[i]);\n\ti++;\n}\nreturn (str);",["Assignment writes back into <code>str[i]</code>","Step present","Returns the parameter itself"],"Splitting the decision into a helper keeps this loop at four lines and well inside the Norm's limit."),
 R("Write the two lines that compute whether position <code>i</code> starts a word, using only the previous character.","Position zero has no previous character — protect it.","if (i == 0 || str[i - 1] == ' ' || str[i - 1] == '\\t')\n\tstart = 1;",["<code>i == 0</code> tested first","Both separators checked","Uses index <code>i - 1</code>, not <code>i</code>"],"Testing the index first means the previous position is never read when it does not exist. Short-circuit is doing the protecting."),
 R("Write a swap-case transformation for a single character: uppercase becomes lowercase and the reverse, everything else unchanged.","Two guards, two conversions, one fall-through.","char\tswap_case(char c)\n{\n\tif (c >= 'a' && c <= 'z')\n\t\treturn (c - 'a' + 'A');\n\tif (c >= 'A' && c <= 'Z')\n\t\treturn (c - 'A' + 'a');\n\treturn (c);\n}",["Two separate range checks","Both conversions written as distances","Unchanged character returned last"],"Three returns and no else. Once a return has fired, anything after it is unreachable, so the else adds nothing.")],
assign:[
 S("C02","ft_strupcase","char *ft_strupcase(char *str);","None","Uppercase every lowercase letter in the string and return it.","Stateless, and the guard is the whole exercise. Digits and punctuation must survive untouched."),
 S("C02","ft_strlowcase","char *ft_strlowcase(char *str);","None","Lowercase every uppercase letter and return the string.","The mirror of the previous one. If the first took an hour, this should take minutes."),
 S("C02","ft_strcapitalize","char *ft_strcapitalize(char *str);","None","Uppercase the first letter of every word and lowercase the rest, returning the string.","Stateful. Read the brief carefully on what counts as part of a word — digits usually do, which changes where words begin.")],
chall:[
 X("str_capitalizer","For each argument, print it with the first letter of every word uppercase and the rest lowercase, one per line.","P1, P4, P5","Several arguments, one line each. And every other letter must be lowered, not merely left alone."),
 X("rstr_capitalizer","The same idea, but the <b>last</b> letter of each word is the one uppercased.","P1, P4, P5","A word of a single letter is both first and last. Decide what that means before coding."),
 X("ulstr","Print the string with the case of every letter swapped.","P1, P4","Non-letters pass through untouched. Test with digits and punctuation, not only words.")]},
{id:"words",grp:"Strings",tit:"Words, separators & tokenising",
lead:"Nine exercises rest on two boundary tests. Get them right once, write them down, and you have bought yourself a whole category.",
theory:[
 P("The definition repeats in every brief: a <b>word</b> is a stretch of string delimited by spaces or tabs, or by the start and end of the string. Nothing else counts as a separator unless the brief says so."),
 A("\"  hi there  \"\n ▲▲ ▲  ▲    ▲\n ││ │  │    └── end of a word\n ││ │  └─────── inside a word\n ││ └────────── START of a word\n └┴──────────── separators"),
 H("The two tests"),
 TB(["Boundary","Condition"],[["<b>Start</b> of a word","not a separator <b>AND</b> (position is 0 <b>OR</b> the previous one is a separator)"],["<b>End</b> of a word","not a separator <b>AND</b> (the next one is a separator <b>OR</b> it is the terminator)"]]),
 W("<b>The <i>position is 0</i> clause is not decoration.</b> Without it, reading the previous position when the index is zero reaches one byte before the string. Short-circuit only saves you if that test is written <b>first</b>."),
 H("The base moves"),
 C("while (str[i] == ' ' || str[i] == '\\t')\n\ti++;"),
 C("while (str[i] != '\\0' && str[i] != ' ' && str[i] != '\\t')\n\ti++;"),
 P("Skip separators, then skip a word. Alternating those two loops walks a string word by word, and that alternation is the skeleton of nearly every exercise in this category."),
 K("Notice the second loop needs the terminator guard and the first does not. The terminator is not a separator, so the skip-separators loop stops at it naturally — but the skip-word loop would run straight past."),
 H("Leading and trailing separators"),
 P("Almost every failing attempt in this category dies on the edges: separators before the first word, or after the last. Test with a string that has both, and with a string made of nothing but separators."),
 I("The briefs always say spaces <b>and tabs</b>, never just spaces — and they test with tabs. Writing the separator test as a two-part condition from the very first exercise saves you rewriting all nine.")],
quiz:[
 Q("How do you test whether position i starts a word?",["It is not a separator","The previous one is a separator","It is not a separator AND (i is 0 OR the previous is a separator)","It is not a separator AND the next is not","i is 0"],2,"A word start is a useful character preceded by a separator, or by nothing at all.","The second option reads outside the string when the index is zero. The fourth describes being inside a word rather than at its beginning."),
 Q("Why does the skip-word loop need a terminator guard when the skip-separator loop does not?",["It does not","Because the terminator is not a separator, so only the word loop would run past it","Because words are longer","Because of short-circuit","Because tabs are involved"],1,"The separator loop stops at the terminator automatically, since a terminator is neither space nor tab.","The word loop, testing only that the character is not a separator, would happily walk past the end. This asymmetry catches people constantly."),
 Q("A brief says words are separated by spaces and tabs. What should you test with?",["Only spaces","Only tabs","Both, plus leading and trailing runs of them","Newlines","Nothing special"],2,"The edges are where these exercises fail.","Graders test with a string of nothing but separators, and with separators at both ends. If your first word logic assumes the string starts with a letter, all of it collapses."),
 Q("Where does the danger sit in reading str[i - 1]?",["It is always safe","When the index is zero it reaches before the string","When the string is long","Only with tabs","Only inside a loop"],1,"Index minus one at position zero is one byte outside your memory.","This is why the index test is written first: short-circuit then guarantees the risky read never happens. Order is protection, not preference."),
 Q("How many words are in a string made entirely of separators?",["One","Zero","Undefined","Depends on the length","One per separator"],1,"No non-separator character ever appears, so no word ever starts.","Your code must produce a sensible result for this rather than crashing or printing a stray separator. It is a stated case in several briefs.")],
debug:[
 D("while (str[i] != ' ' && str[i] != '\\t')\n\ti++;","Given a string with no separators, what happens?",["It stops at the end","It runs past the terminator into other memory","It returns zero","It skips the first word","Nothing"],1,"Only separators stop it, and the terminator is not a separator.","Adding the terminator test — first, so short-circuit protects the rest — turns this from undefined behaviour into a correct word skip."),
 D("if (str[i - 1] == ' ' && str[i] != ' ')\n\tstart = 1;","This crashes on some inputs. When?",["When the string is empty","When the index is zero","When the string ends with a space","When tabs are used","Never"],1,"At position zero this reads one byte before the string begins.","The fix is to test the index first, so short-circuit prevents the access entirely. Reordering the same conditions is the whole repair."),
 D("i = 0;\nwhile (str[i] == ' ')\n\ti++;\nwhile (str[i] != ' ' && str[i] != '\\0')\n{\n\tft_putchar(str[i]);\n\ti++;\n}","This prints the first word — usually. When does it fail?",["Never","When the string is empty","When the separators are tabs","When the word is one letter","When the string ends in a space"],2,"Only the space is treated as a separator, so a leading tab is printed as part of the word.","Every brief in this family says spaces and tabs. Writing a two-part separator test from the start prevents this across all nine exercises."),
 D("i = 0;\nwhile (str[i] != '\\0')\n{\n\tif (str[i] != ' ')\n\t\tn++;\n\ti++;\n}","This is meant to count words. What does it actually count?",["Words","Non-space characters","Spaces","Nothing","Letters only"],1,"It increments on every useful character rather than only at word starts.","Counting words means counting <i>transitions</i> into a word, which needs the boundary test rather than a plain character test."),
 D("while (str[i] != '\\0')\n{\n\twhile (str[i] != ' ' && str[i] != '\\0')\n\t\ti++;\n\twhile (str[i] == ' ')\n\t\ti++;\n}","With trailing spaces this hangs. Why?",["The inner loops conflict","After the trailing spaces both inner loops stop, and the outer one never advances","The terminator test is missing","<code>i</code> is unsigned","It needs braces"],1,"When the index lands on the terminator neither inner loop moves it, and the outer condition is still true.","Any nested-loop walk needs a guarantee that at least one index advances on every outer pass. Otherwise a position where all inner loops decline to move becomes a trap.")],
practice:[
 R("Write the loop that skips spaces and tabs starting at index <code>i</code>.","Two characters, joined by or.","while (str[i] == ' ' || str[i] == '\\t')\n\ti++;",["Space written as a quoted space","Tab written as <code>'\\t'</code>","<code>||</code> joining them","Step in the body"],"No terminator guard needed here: a terminator is neither space nor tab, so the loop stops on its own."),
 R("Write the mirror loop: skip a whole word, safely.","Three conditions, and one of them protects the other two.","while (str[i] != '\\0' && str[i] != ' ' && str[i] != '\\t')\n\ti++;",["Terminator guard first","Both separators tested","<code>&&</code> throughout","Step present"],"This is where the asymmetry lives: the word loop needs the guard, the separator loop does not."),
 R("Write the full condition testing whether position <code>i</code> is the start of a word.","Three parts, and the order is what protects you.","if (str[i] != ' ' && str[i] != '\\t' && (i == 0 || str[i - 1] == ' '))",["Current character tested first","<code>i == 0</code> before <code>str[i - 1]</code>","Parentheses around the or group"],"Put the index test second and you read before the string on the very first character."),
 R("Write a loop that counts how many words a string contains.","Count transitions into a word, not characters.","i = 0;\nn = 0;\nwhile (str[i] != '\\0')\n{\n\tif (str[i] != ' ' && str[i] != '\\t'\n\t\t&& (i == 0 || str[i - 1] == ' ' || str[i - 1] == '\\t'))\n\t\tn++;\n\ti++;\n}",["Counts only at word starts","Both separators handled on both sides","Line wrapped to stay under 80 columns","Step outside the if"],"Counting words first, then acting on them, is the structure behind splitting a string into an array later.")],
assign:[
 S("C07","ft_split","char **ft_split(char *str, char *charset);","malloc","Split a string into words, using every character of the charset as a separator, and return a NULL-terminated array of strings.","Three problems stacked: deciding what a word is, counting them before allocating, and terminating both the array and each string."),
 S("C09","ft_split","char **ft_split(char *str, char *charset);","malloc","The same function again, this time as part of your own library.","Reappearing on purpose. Rewriting from memory rather than copying the old file is the entire point.")],
chall:[
 X("first_word","Print the first word of the argument, followed by a newline.","P1, P5","Leading separators are allowed. With no word at all, print only the newline."),
 X("last_word","Print the last word of the argument, followed by a newline.","P1, P5","Trailing separators are allowed, which is the mirror trap of the previous one."),
 X("epur_str","Print the argument with exactly one space between words and none at the edges.","P1, P5","The classic edge case is a string of nothing but separators."),
 X("expand_str","The same as the previous one, but with three spaces between words.","P1, P5","Identical machinery, different separator. Do them back to back and the second costs minutes."),
 X("rostring","Print the argument with its first word moved to the end, separated by single spaces.","P1, P5, P10","The output spacing is normalised even though the input is not."),
 X("rev_wstr","Print the argument with its words in reverse order.","P1, P5, P10","Read the brief's guarantee about spacing before deciding how much normalising you must do.")]},
/* ========== PHASE 3 — POINTERS & MEMORY ========== */
{id:"pointers",grp:"Pointers & memory",tit:"Pointers, indirection & why they exist",
lead:"A function receives copies. That single fact is the whole reason pointers exist — and once it lands, the asterisks stop looking like decoration.",
theory:[
 A("     box `score`               box `p`\n     ┌──────────────┐        ┌──────────────┐\n     │      7       │        │     1000     │ ← the ADDRESS of score\n     └──────────────┘        └──────────────┘\n      lives at 1000           lives at 2000"),
 TB(["Symbol","Reads as"],[["<code>&amp;</code>","<b>the address of</b>"],["<code>*</code>","<b>go there and look inside</b>"]]),
 C("int\tscore;\nint\t*p;\n\nscore = 7;\np = &score;\n*p = 99;"),
 P("At the end <code>score</code> holds 99, and the word <code>score</code> never appeared on the line that changed it. That is the entire trick."),
 H("The problem being solved"),
 C("void\ttries(int n)\n{\n\tn = n * 2;\n}"),
 P("Call that with a variable and nothing happens outside. The function worked on a new box holding a copy, and the copy died when it returned. Passing the <b>address</b> instead is what lets it reach back."),
 K("<b>The trio that always repeats:</b> asterisk in the parameter declaration, asterisk in the use inside the body, ampersand at the call site. Written three times in a row it stops looking strange."),
 W("<b>A real ambiguity in C.</b> In a <i>declaration</i>, <code>int *p</code> means <i>p is a pointer</i>. In an <i>expression</i>, <code>*p = 7</code> means <i>go to the address and write</i>. Same symbol, two jobs."),
 H("The confusion table"),
 TB(["You write","It is"],[["<code>p</code>","the address"],["<code>*p</code>","the content"],["<code>p++</code>","point at the next cell"],["<code>(*p)++</code>","add one to the value stored there"]]),
 P("There is also <code>*p++</code>, which by precedence advances the pointer and yields the old value. Common in idiomatic C; avoid it here — code you cannot explain at defence is worth less than plain code you can."),
 H("Levels of indirection"),
 P("The number of asterisks in the type is the number of hops to the value. One asterisk, one hop. <code>*pp</code> out of two declared is still an address — halfway there. Read declarations right to left: <code>char **s</code> is <i>s is a pointer to a pointer to char</i>."),
 I("A function that must change one of the caller's <b>pointers</b> takes a double pointer. That is the entire explanation for the extra asterisk you meet later in list exercises.")],
quiz:[
 Q("int x = 5; int *p = &x; *p = 20; What is x?",["5","20","1000","Undefined","0"],1,"The asterisk follows the address and writes at the destination.","And p itself still holds the address. A pointer occupies eight bytes on a 64-bit system regardless of what it points at."),
 Q("What is the difference between p++ and (*p)++?",["None","p++ adds one to the value","p++ advances the pointer, (*p)++ adds one to the value pointed at","(*p)++ does not compile","Both advance the pointer"],2,"The increment applies to whatever sits immediately before it.","Without parentheses that is the pointer itself. The parenthesised form reaches through first and then increments what it found."),
 Q("int **two points at a pointer that points at 42. How do you reach 42?",["two","*two","**two","&two","***two"],2,"Two asterisks in the type, two hops to the value.","One asterisk leaves you holding an address rather than a value — a distinction that produces very confusing compiler messages if you get it wrong."),
 Q("Why does a function that swaps two of the caller's variables need pointers?",["For speed","Because it receives copies otherwise","Because ints are large","Because return can only give one value, and copies cannot be reached","Both the second and the fourth"],4,"Both reasons are true and they reinforce each other.","return hands back a single value, and the parameters are copies. Receiving addresses is the only way to reach back into the caller for more than one thing."),
 Q("In a declaration, what does the asterisk mean?",["Multiply","Dereference","That the variable holds an address","Nothing","Comment"],2,"In a declaration it describes the type; only in an expression does it dereference.","This dual role is genuinely confusing at first. The reliable rule: if you are naming a new variable, the asterisk is part of the type.")],
debug:[
 D("void\treset(int n)\n{\n\tn = 0;\n}","Why does the caller's variable never change?",["A return is missing","It received a copy, not the original","The variable should be global","n was never initialised","reset is a reserved name"],1,"The parameter is a new box holding a copy, which dies when the function returns.","Two legitimate fixes: return the value and assign in the caller, or take the address. The first suits calculations, the second suits changing several things at once."),
 D("void\treset(int *n)\n{\n\tn = 0;\n}","The signature was fixed but the bug remains. What is still wrong?",["The parameter should not be a pointer","The body assigns to the pointer instead of through it","It needs a return","The caller must pass a copy","Nothing"],1,"Setting the pointer to zero makes it point at nothing; it never touches the caller's value.","This half-fix is extremely common: the signature is updated and the body is forgotten. It usually produces a compiler warning, which -Werror turns into a refusal."),
 D("int\t*p;\n\n*p = 5;","This crashes. Why?",["The type is wrong","p was never given an address, so it holds garbage","5 is too large","It needs a cast","Pointers cannot hold ints"],1,"Writing through an uninitialised pointer sends the value to a random location.","If the garbage happens to be zero it is a clean segmentation fault. If not, it may corrupt something silently — which is much worse."),
 D("swap(&x, y);","One of these two arguments is wrong for a function taking two int pointers. Which, and why?",["The first, it needs no ampersand","The second, it passes a value where an address is required","Both are wrong","Neither is wrong","The order is wrong"],1,"The second argument passes the contents instead of the location.","The compiler flags the type mismatch, and -Werror stops the build. Without those flags it would compile and treat the value as a memory address."),
 D("int\ttab[3];\nint\t*p;\n\np = &tab;","This produces a type warning. Why?",["Arrays cannot be pointed at","The array name is already an address, so the ampersand adds a level","tab must be initialised","The sizes differ","Nothing is wrong"],1,"An array name already decays to the address of its first element.","Taking its address again yields a pointer to the whole array, a different type. Writing the assignment without the ampersand is the fix.")],
practice:[
 R("Write three lines: declare an int called <code>score</code>, a pointer to it, and set the score to 99 <b>through the pointer</b>.","Ampersand once, asterisk twice.","int\tscore;\nint\t*p;\n\nscore = 0;\np = &score;\n*p = 99;",["Declarations uninitialised at the top","<code>p = &amp;score;</code> with the ampersand","<code>*p = 99;</code> with the asterisk","The name score does not appear on the last line"],"That final line is the whole idea: changing a box without naming it."),
 R("Write <code>add_into</code>: takes a pointer to an int and a value, adding the value into the caller's variable.","Dereference on both sides of the assignment.","void\tadd_into(int *total, int value)\n{\n\t*total = *total + value;\n}",["First parameter is a pointer","Second is a plain int","Both sides dereferenced","Returns void"],"You would call it with an ampersand on the first argument and a bare value on the second."),
 R("Write <code>set_both</code>: takes two int addresses and a value, writing it into both.","Two pointer parameters, two dereferences.","void\tset_both(int *a, int *b, int value)\n{\n\t*a = value;\n\t*b = value;\n}",["Both first parameters are pointers","Third is a plain int","Both assignments dereference"],"Three named parameters is comfortably inside the Norm's limit of four."),
 R("Write four lines: an int holding 42, a pointer to it, a pointer to that pointer, and the expression that reaches the value from the last one.","Count the asterisks in the type, then use that many.","int\tn;\nint\t*one;\nint\t**two;\n\nn = 42;\none = &n;\ntwo = &one;\n**two",["Three declarations with zero, one and two asterisks","Each assignment uses an ampersand","Final access uses two asterisks"],"One asterisk out of two leaves you holding an address, which is exactly the mistake the nine-asterisk exercise exists to burn out of you.")],
assign:[
 S("C01","ft_ft","void ft_ft(int *nbr);","None","Set the value pointed at to a fixed number.","Deliberately trivial. It exists so you cannot avoid noticing that the asterisk in the body is doing all the work."),
 S("C01","ft_ultimate_ft","void ft_ultimate_ft(int *********nbr);","None","The same idea, buried under nine levels of indirection.","Absurd on purpose. Count the asterisks in the type, use exactly that many in the body, and the rule is yours forever."),
 S("C01","ft_swap","void ft_swap(int *a, int *b);","None","Exchange the values of the two integers the pointers refer to.","A temporary is unavoidable: writing into the first destroys the value you still need for the second."),
 S("C01","ft_div_mod","void ft_div_mod(int a, int b, int *div, int *mod);","None","Divide a by b, storing the quotient and the remainder in the two locations given.","Two results from one call, which is exactly what return alone cannot do. This is the argument for pointers in one exercise."),
 S("C01","ft_ultimate_div_mod","void ft_ultimate_div_mod(int *a, int *b);","None","Divide the first by the second, storing the quotient in the first and the remainder in the second.","Both parameters are inputs and outputs at once, so the order of your writes matters. Save what you need before overwriting.")],
chall:[
 X("ft_swap","Exchange the values of two integers through pointers.","P11","A temporary is required. Without it the first assignment destroys what the second needs.")]},
{id:"arrays",grp:"Pointers & memory",tit:"Arrays, decay, sorting & grids",
lead:"An array knows its own size — right up until you pass it to a function, where it quietly becomes a bare address and the size evaporates.",
theory:[
 C("int\ttab[3];\n\ntab[0] = 10;\ntab[1] = 20;\ntab[2] = 30;"),
 P("The name of an array is the address of its first element. Indexing is arithmetic on that address, which is why <code>tab[i]</code> and <code>*(tab + i)</code> are the same thing."),
 H("Decay, and why every function takes a size"),
 C("char\tarray[] = \"porto\";\nchar\t*pointer = array;"),
 P("<code>sizeof(array)</code> gives six — five letters plus the terminator. <code>sizeof(pointer)</code> gives eight, the size of an address."),
 W("<b>Passing an array to a function decays it into a plain pointer.</b> Inside the function, <code>sizeof</code> starts returning eight no matter how large the array really was. Any attempt to compute the length inside is silently wrong."),
 K("This is the entire reason every int-array brief carries a <code>size</code> or <code>length</code> parameter, while string functions rely on the terminator. Without a sentinel or an explicit count, a function has no way to know where data ends."),
 H("Pointer arithmetic advances by type"),
 A("int *p at address 1000:\n\n1000        1004        1008\n┌───────────┬───────────┬───────────┐\n│   int A   │   int B   │   int C   │\n└───────────┴───────────┴───────────┘\n  ▲           ▲\n  p           p+1   ← jumped 4 bytes, not 1"),
 P("A <code>char *</code> advances one byte; an <code>int *</code> advances four. Both pointers are eight bytes themselves — what changes is the stride, not the pointer."),
 W("Arithmetic is only defined <b>inside</b> the block the pointer belongs to. Building an address far outside an array is undefined even if you never read through it."),
 H("Sorting, and the swap at its heart"),
 P("Bubble sort is more than sufficient here: compare neighbours, exchange when out of order, repeat until a full pass makes no exchange. Slow, short, and easy to defend out loud."),
 C("tmp = tab[i];\ntab[i] = tab[j];\ntab[j] = tmp;"),
 I("Sorting strings uses the same structure with a comparison call in place of the operator — and you exchange the <b>pointers</b>, not the characters."),
 H("Two dimensions"),
 P("A grid is an array of arrays: <code>board[row][column]</code>. Movement across it is best expressed as a pair of deltas — minus one and zero for up, plus one and plus one for a diagonal — applied repeatedly until you leave the bounds or hit something.")],
quiz:[
 Q("Why do array functions take a size parameter?",["Style","Because the array decays to a pointer and the size is lost","Because sizeof is slow","Norm requirement","To allow NULL"],1,"Inside the function only an address exists.","sizeof on the original array gives the real size; on a parameter it gives eight. Either a sentinel marks the end, or the count arrives separately."),
 Q("For int *p and char *c, how many bytes do p + 1 and c + 1 advance?",["1 and 1","4 and 4","4 and 1","8 and 8","Depends on the array"],2,"Arithmetic moves in units of the pointed-to type.","The eight-and-eight option is the trap: it confuses the size of the pointer with the size of the stride. Both pointers are eight bytes; the jumps differ."),
 Q("Why does exchanging two values need a temporary?",["It does not","Because the first assignment destroys the value the second needs","Because of the Norm","To avoid overflow","Only for pointers"],1,"Writing into the first location loses what was there before you can move it.","This three-line shape is the heart of every sorting routine you will write, and of the swap exercise you already met."),
 Q("What does sizeof give for an int array parameter inside a function?",["The full array size","The number of elements","Eight, the size of a pointer","Four","A compile error"],2,"The parameter is a pointer, whatever the syntax suggests.","Writing the parameter as brackets rather than an asterisk changes nothing — both mean pointer. That syntax is arguably a mistake in the language."),
 Q("When is pointer arithmetic outside an array's bounds allowed?",["Always","Never, it is undefined even without dereferencing","Only when reading","Only one past the end for comparison purposes","Only with char"],3,"One past the end may be formed for comparison; anything further is undefined.","This is why loops are written to stop at the size rather than to compute distant addresses. In practice, staying strictly inside is the only habit worth having.")],
debug:[
 D("int\tf(int tab[])\n{\n\tint\tn;\n\n\tn = sizeof(tab) / sizeof(int);\n\treturn (n);\n}","This always returns the same small number. Why?",["sizeof is broken","The parameter is a pointer, so sizeof gives eight","tab must be const","The division is wrong","It should use a cast"],1,"Eight divided by four gives two, no matter how large the caller's array was.","The bracket syntax in a parameter list is misleading — it still means pointer. The size has to arrive as a separate parameter."),
 D("i = 0;\nwhile (i <= size)\n{\n\ttab[i] = 0;\n\ti++;\n}","What is wrong with the bound?",["Nothing","It writes one element past the end","It skips the first element","It should start at 1","size must be unsigned"],1,"Valid indexes run from zero to size minus one.","That single extra write lands on whatever follows the array. It may work for months and then corrupt an unrelated variable."),
 D("tab[i] = tab[j];\ntab[j] = tab[i];","Meant to exchange two elements. What actually happens?",["They are exchanged","Both end up holding the original second value","Both end up zero","A compile error","They are unchanged"],1,"The first assignment overwrites the destination before its value has been saved.","Both slots end up holding the same thing. A temporary variable is not optional here — it is the mechanism."),
 D("int\t*p;\nint\ttab[3];\n\np = tab;\np = p + 5;","Nothing is dereferenced, so is this safe?",["Yes, entirely","No, forming an address that far outside is undefined","Only if the array is larger","Only with char pointers","It is safe but slow"],1,"The standard permits forming an address at most one past the end; beyond that is undefined.","In practice most machines tolerate it, which is exactly why it survives testing. The habit worth having is never to build addresses you would not read."),
 D("while (i < rows)\n{\n\twhile (j < cols)\n\t{\n\t\tboard[i][j] = 0;\n\t\tj++;\n\t}\n\ti++;\n}","The first row is cleared and the rest are not. Why?",["The bounds are swapped","The inner index is never reset inside the outer loop","The grid is one-dimensional","<code>i</code> is uninitialised","The order of indexes is wrong"],1,"After the first row the inner index already equals the column count, so the inner loop never runs again.","Resetting the inner counter inside the outer body is the defining move of any two-dimensional walk.")],
practice:[
 R("Write <code>sum_tab</code>: takes an int array and its size, returns the sum of its elements.","You cannot discover the size inside — it must be a parameter.","int\tsum_tab(int *tab, int size)\n{\n\tint\ti;\n\tint\ttotal;\n\n\ti = 0;\n\ttotal = 0;\n\twhile (i < size)\n\t{\n\t\ttotal = total + tab[i];\n\t\ti++;\n\t}\n\treturn (total);\n}",["Two parameters","<code>&lt; size</code>, not <code>&lt;= size</code>","Total initialised before the loop"],"Writing the parameter as an asterisk or as brackets makes no difference — both are pointers."),
 R("Write the three lines that exchange two elements of an array using a temporary.","Save one before overwriting it.","tmp = tab[i];\ntab[i] = tab[j];\ntab[j] = tmp;",["Temporary holds the first value","Three separate assignments","Ordered so nothing is lost"],"This is the heart of every sorting routine. Getting it automatic pays off far beyond this category."),
 R("Write the inner comparison and exchange of a bubble sort pass, for ascending order.","Compare neighbours, exchange when out of order.","if (tab[i] > tab[i + 1])\n{\n\ttmp = tab[i];\n\ttab[i] = tab[i + 1];\n\ttab[i + 1] = tmp;\n}",["Compares neighbouring elements","Condition matches ascending order","Exchange uses a temporary","Braces around the block"],"The loop around this must stop one element early, since it looks at the position ahead."),
 R("Write the nested loop that fills a grid <code>board</code> of <code>rows</code> by <code>cols</code> with zeros.","Two counters, and one of them resets.","i = 0;\nwhile (i < rows)\n{\n\tj = 0;\n\twhile (j < cols)\n\t{\n\t\tboard[i][j] = 0;\n\t\tj++;\n\t}\n\ti++;\n}",["Inner index reset inside the outer loop","Both bounds strictly less than","Both loops have their step"],"The reset placement is the single most common bug in two-dimensional walks.")],
assign:[
 S("C01","ft_rev_int_tab","void ft_rev_int_tab(int *tab, int size);","None","Reverse the order of the elements of an integer array in place.","Two indexes moving towards each other, and they must stop when they meet. Running them to the ends undoes the work."),
 S("C01","ft_sort_int_tab","void ft_sort_int_tab(int *tab, int size);","None","Sort an integer array in ascending order in place.","Bubble sort is fine. The exchange needs a temporary, and the inner loop must stop one element early.")],
chall:[
 X("sort_int_tab","Sort an integer array in ascending order.","P12","The size arrives as an unsigned value. Repeated elements must survive, so no deduplication."),
 X("max","Return the largest value in an array of integers.","P13","An empty array has a defined answer stated in the brief. Read it rather than assuming zero is safe."),
 X("check_mate","Given a board, decide whether the king is under attack.","P1, P16","The board is square but its size varies. A piece only reaches the first obstacle along each direction.")]},
{id:"argv",grp:"Pointers & memory",tit:"Program arguments",
lead:"More than half of all short C exercises open the same way: check how many arguments arrived, act on one of them, print a newline. Learn the shape and you start every one of them for free.",
theory:[
 C("int\tmain(int argc, char **argv)"),
 A("$ ./program hello world\n\nargc = 3\nargv[0] = \"./program\"\nargv[1] = \"hello\"\nargv[2] = \"world\"\nargv[3] = NULL"),
 W("<b>argc counts the program name.</b> A brief saying <i>if the number of parameters is not one</i> means the count must be <b>two</b>. Reading it as one inverts the behaviour of the entire program — and then the argument you reach for is NULL."),
 P("A useful consequence: <code>argv[argc]</code> is always NULL, so you can walk the arguments on the sentinel alone and never touch the count."),
 H("Three levels, three types"),
 TB(["You write","It is","Type"],[["<code>argv</code>","the whole array","<code>char **</code>"],["<code>argv[1]</code>","one string","<code>char *</code>"],["<code>argv[1][0]</code>","one character","<code>char</code>"]]),
 K("Two different sentinels are in play at once: the array of strings ends with <b>NULL</b>, each string ends with the <b>terminator</b>. Two loops, two stop conditions, and swapping them is a classic error because both are zero underneath."),
 H("The shape that opens everything"),
 C("int\tmain(int argc, char **argv)\n{\n\tif (argc == 2)\n\t{\n\t\tft_putstr(argv[1]);\n\t}\n\tft_putchar('\\n');\n\treturn (0);\n}"),
 I("The newline sits <b>outside</b> the condition, so it prints in both the good case and the bad one — which is exactly what nearly every brief asks for, in a single line and with no else."),
 P("If you declare a parameter and never use it, the strict flags refuse to compile. Casting it to void on its own line is how you say <i>I know, and it is deliberate</i>."),
 W("Arguments live in writable memory, so modifying them in place is allowed. A literal written in your source is not. That difference decides whether a brief lets you transform the input directly.")],
quiz:[
 Q("./prog hello world — what is argc?",["1","2","3","4","Depends on the shell"],2,"Three words on the command line, the program name included.","Which is why a brief asking for one parameter means a count of two. This single off-by-one decides whole exercises."),
 Q("What type is argv[1][0]?",["char **","char *","char","int","void *"],2,"Each pair of brackets descends one level.","First you pick a string out of the array, then a character out of the string. Naming the type aloud as you write it stops the guessing."),
 Q("What is argv[argc]?",["The last argument","An empty string","NULL","Undefined","The program name"],2,"The array is NULL-terminated.","This lets you walk arguments without ever using the count, which some briefs prefer. It is also a second sentinel to keep straight from the string terminator."),
 Q("Why does the newline sit outside the if?",["Style","So it prints in both cases with one line and no else","The Norm demands it","To avoid a warning","It does not matter"],1,"Nearly every brief wants the result when arguments are right, and just a newline when they are not.","That placement removes an entire else branch from more than thirty short exercises. Small decision, large return."),
 Q("You declare argv and never use it. What happens under the strict flags?",["Nothing","A warning only","Compilation is refused","A segfault","argv becomes NULL"],2,"An unused parameter is a warning, and -Werror makes warnings fatal.","Casting it to void on its own line silences it honestly, without disabling the check for anything else.")],
debug:[
 D("int\tmain(int argc, char **argv)\n{\n\tif (argc != 1)\n\t\treturn (0);\n\tshow(argv[1]);\n\treturn (0);\n}","Where is the mistake?",["It should be <code>argc != 2</code>","<code>(void)argv</code> is missing","argv[1] should be argv[0]","The return is misplaced","Nothing is wrong"],0,"For a real argument to sit at index one, the count must be two.","As written, the call only happens when there are no arguments at all — and then index one holds NULL. Segfault on the very first test a grader runs."),
 D("i = 0;\nwhile (argv[i] != NULL)\n{\n\tft_putstr(argv[i]);\n\ti++;\n}","The brief says skip the program name. What is wrong?",["The sentinel is wrong","The index starts at zero","It should use argc","ft_putstr is wrong","Nothing"],1,"Index zero is the program name, so it gets printed too.","Starting at one is the whole fix. The NULL sentinel is otherwise a perfectly good way to drive the loop."),
 D("i = 1;\nj = 0;\nwhile (argv[i] != NULL)\n{\n\twhile (argv[i][j] != '\\0')\n\t\tj++;\n\ti++;\n}","Only the first argument is measured. Why?",["The outer condition is wrong","The inner index is never reset inside the outer loop","argv should be char *","The sentinel is wrong","It needs braces"],1,"After the first string the inner index is already past the end of every shorter one.","Resetting the inner counter inside the outer body is the defining move of any nested walk over an array of strings."),
 D("while (argv[i][j] != NULL)\n\tj++;","This compares the wrong things. What is wrong?",["The indexes are swapped","A character is compared against a pointer sentinel","j is uninitialised","It should be <code>&&</code>","Nothing"],1,"At two levels of indexing you hold a character, which ends with the terminator, not with NULL.","Both are zero underneath so it often compiles and even works. Writing the right one is what shows you know which sentinel you are standing on."),
 D("int\tmain(int argc, char **argv)\n{\n\tif (argc == 2)\n\t\tft_putstr(argv[1]);\n\telse\n\t\tft_putchar('\\n');\n\treturn (0);\n}","The brief wants a newline in both cases. What is wrong?",["The condition","The newline only prints in the failing case","argv is unused","The else is illegal","Nothing"],1,"With a valid argument the string prints and no newline follows.","Moving the newline outside the branch entirely handles both cases and lets the else disappear.")],
practice:[
 R("Write the argument boilerplate: act on the single argument when there is exactly one, and always end with a newline.","Watch where the newline goes.","int\tmain(int argc, char **argv)\n{\n\tif (argc == 2)\n\t{\n\t\tft_putstr(argv[1]);\n\t}\n\tft_putchar('\\n');\n\treturn (0);\n}",["Condition uses two, not one","Newline outside the if","No comment inside the body","Return in parentheses"],"Time yourself writing this from memory. Under ninety seconds means it is genuinely automatic."),
 R("Write a main that returns 1 when it did not receive exactly one argument, and 0 otherwise.","One parameter goes unused — say so explicitly.","int\tmain(int argc, char **argv)\n{\n\t(void)argv;\n\tif (argc != 2)\n\t\treturn (1);\n\treturn (0);\n}",["Condition uses two","<code>(void)argv;</code> present","Both returns in parentheses"],"Without the void cast the strict flags refuse the file for an unused parameter."),
 R("Write a loop printing the first character of every argument, skipping the program name.","Start at the right index and use the sentinel.","i = 1;\nwhile (argv[i] != NULL)\n{\n\tft_putchar(argv[i][0]);\n\ti++;\n}",["Starts at index 1","Stops at NULL","Two brackets to reach a character","Step present"],"Driving on the sentinel rather than the count works because the array is guaranteed NULL-terminated."),
 R("Write <code>total_chars</code>: takes a NULL-terminated array of strings and returns the total number of characters.","Two nested loops, two different sentinels.","int\ttotal_chars(char **tab)\n{\n\tint\ti;\n\tint\tj;\n\tint\tn;\n\n\ti = 0;\n\tn = 0;\n\twhile (tab[i] != NULL)\n\t{\n\t\tj = 0;\n\t\twhile (tab[i][j] != '\\0')\n\t\t{\n\t\t\tn++;\n\t\t\tj++;\n\t\t}\n\t\ti++;\n\t}\n\treturn (n);\n}",["Outer tests NULL, inner tests the terminator","Inner index reset inside the outer loop","Three declarations at the top"],"The reset is the whole exercise. Outside the outer loop, every string after the first is skipped.")],
assign:[
 S("C06","ft_print_params","—","write","Write a program that prints its arguments, one per line, excluding the program name.","This is a program, so it needs a main with both parameters. The first index to print is one, not zero."),
 S("C06","ft_rev_params","—","write","Print the arguments one per line, in reverse order, still excluding the program name.","Start from the last index and walk down. The stopping point is one, not zero."),
 S("C06","ft_sort_params","—","write","Print the arguments one per line in ascending order, excluding the program name.","Two things combine: a comparison and a sort. You exchange the pointers, not the characters.")],
chall:[
 X("aff_first_param","Print the first argument followed by a newline.","P1, P2","With too few arguments, print only the newline."),
 X("aff_last_param","Print the last argument followed by a newline.","P1, P2","Same shape, other end. Watch which index the last argument actually sits at."),
 X("aff_a","Print the first occurrence of a given letter in the argument.","P1, P2","If the letter is absent, the brief specifies exactly what to print. Read it twice."),
 X("aff_z","Print the first occurrence of a different given letter.","P1, P2","It looks identical to the previous one, and the not-found behaviour is deliberately not identical."),
 X("paramsum","Print how many arguments were received, excluding the program name.","P1, P8","With no arguments the answer is zero, and it still needs a newline.")]},
{id:"malloc",grp:"Pointers & memory",tit:"Dynamic memory",
lead:"Memory that outlives the function it was born in. From here on you are not only writing logic — you are managing a resource, and the language will not help you.",
theory:[
 C("#include <stdlib.h>\n\nchar\t*s;\n\ns = malloc(sizeof(char) * (n + 1));\nif (s == NULL)\n\treturn (NULL);"),
 TB(["","Stack","Heap"],[["How","<code>int x;</code>","<code>malloc()</code>"],["Who cleans","automatic","<b>you</b>, with <code>free()</code>"],["Size","fixed in the source","decided while running"],["Outlives the function","no","yes"]]),
 I("The stack is a hotel room, cleaned when you check out. The heap is a storage unit you keep paying for until you empty it yourself."),
 H("The four rules"),
 TB(["Rule","Why"],[["<b>Plus one for strings</b>","the terminator occupies a real byte"],["<b>Always check for NULL</b>","allocation can fail, and writing to NULL is fatal"],["<b>The memory arrives dirty</b>","it is not zeroed — you fill every byte"],["<b>Never return a local's address</b>","it dies when the function returns"]]),
 W("<b>The parentheses in <code>(n + 1)</code> are not optional.</b> Without them the multiplication happens first and the addition afterwards. With characters that accidentally still works, because the unit size is one. With any other type it is silently, badly wrong."),
 W("Writing one byte past the block corrupts the allocator's own bookkeeping. The program breaks much later, somewhere with no visible connection to the cause — which is what makes this the most expensive bug of the whole piscine."),
 H("The sequence that never changes"),
 P("Count how much you need. Allocate, with the extra byte if it is a string. Check for failure. Fill. Close with the sentinel. Return. Every allocating function you write follows those six steps in that order."),
 K("Arrays of strings need <b>two</b> levels of allocation: one block for the array of pointers, then one block per string, and a NULL in the final slot. Freeing them means walking that array before releasing it."),
 P("Reading memory after releasing it is use-after-free. It very often still works, because nothing has reused the block yet — which is exactly why it survives into production code and then fails unpredictably.")],
quiz:[
 Q("What does malloc return, and in what state is the memory?",["A size, zeroed","A typeless pointer, zeroed","A typeless pointer, dirty","A char pointer, zeroed","An int, dirty"],2,"A typeless pointer to uninitialised memory.","calloc would zero it, but the briefs generally forbid it. That is why you must fill everything by hand, including writing the terminator explicitly."),
 Q("Why does a string allocation need one extra byte?",["Alignment","For the terminator","For safety margin","Because malloc rounds up","It does not"],1,"The terminator occupies a real byte like any other character.","Length and bytes-occupied differ by exactly one for every string. Getting that idea straight early prevents this whole family of bugs."),
 Q("You allocated n bytes and wrote at index n. What happens?",["Nothing","A compile error","Silent corruption that surfaces much later","An immediate crash","The block grows"],2,"Valid indexes run from zero to n minus one.","It rarely crashes at the moment of the write. The allocator's internal structure is damaged and the failure appears somewhere unrelated, often much later."),
 Q("A function allocates and returns a string. Who frees it?",["The function","The compiler","The caller","Nobody","The operating system on exit"],2,"Ownership passes to the caller along with the pointer.","Briefs that return allocated memory are implicitly handing you responsibility. Documenting who frees what is one of the real habits of C."),
 Q("Why must a NULL check come before any write?",["Style","Because writing through NULL is a guaranteed crash","Because malloc is slow","To satisfy the Norm","It need not"],1,"NULL points nowhere, and dereferencing it is fatal.","The briefs also require returning NULL on failure, so the check serves two purposes: it protects you and it produces the specified behaviour.")],
debug:[
 D("s = malloc(sizeof(char) * n);\ns[n] = '\\0';","Two things are wrong. Which?",["Only the size","Only the missing check","The size is one byte short and the failure check is missing","The type is wrong","Nothing"],2,"The terminator lands outside the block, and a failed allocation would crash on that same line.","Both are one-line fixes and both are mandatory. The size error is the quieter of the two, which makes it the more dangerous."),
 D("s = malloc(sizeof(int) * n + 1);","Meant to allocate n integers plus one. What does it actually do?",["Exactly that","Allocates n integers plus one byte, not one integer","Allocates n plus one integers","Fails","Allocates nothing"],1,"Multiplication happens before addition, so the extra unit is a single byte.","With characters the unit is one byte and the mistake hides. With any larger type the shortfall is real. Parentheses make the intent explicit and correct."),
 D("char\t*make(void)\n{\n\tchar\tbuf[10];\n\n\tbuf[0] = 'a';\n\tbuf[1] = '\\0';\n\treturn (buf);\n}","What is wrong?",["The array is too small","It returns the address of a local, which dies on return","The terminator is misplaced","It needs a cast","Nothing"],1,"That stack space stops being valid the moment the function returns.","It frequently still works right afterwards, because nothing has reused the space yet. Allocating on the heap, or writing into a caller-supplied buffer, are the two real fixes."),
 D("free(tab);\nft_putchar(tab[0]);","Why is this dangerous even though it usually prints correctly?",["free is slow","Reading after release is undefined, and the block may be reused at any moment","tab was never allocated","The index is wrong","It is not dangerous"],1,"Once released, the block belongs to the allocator again.","It usually works right after the call and fails once something else allocates. That delay between cause and symptom is what makes it so hard to track down."),
 D("i = 0;\nwhile (tab[i] != NULL)\n\ti++;\nfree(tab);","Freeing an array of strings. What was forgotten?",["The loop does nothing useful","Each individual string must be freed before the array","tab should be freed twice","The sentinel is wrong","Nothing"],1,"Releasing the array of pointers loses the only handles you had on the strings.","Two levels of allocation need two levels of release, innermost first. The loop was already walking them — it simply needed a free inside it.")],
practice:[
 R("Write the allocation of a string of <code>n</code> characters plus the check that must never be skipped.","Two things: what else takes space, and what can go wrong.","s = malloc(sizeof(char) * (n + 1));\nif (s == NULL)\n\treturn (NULL);",["Unit size present","Parentheses around <code>(n + 1)</code>","The extra byte is there","Returns NULL in parentheses"],"This exact block opens every allocating function you will write from here on."),
 R("Write <code>fill_string</code>: allocates <code>n</code> characters, fills them all with <code>c</code>, terminates, and returns it.","Allocate, check, fill, close, return.","char\t*fill_string(int n, char c)\n{\n\tchar\t*s;\n\tint\t\ti;\n\n\ts = malloc(sizeof(char) * (n + 1));\n\tif (s == NULL)\n\t\treturn (NULL);\n\ti = 0;\n\twhile (i < n)\n\t{\n\t\ts[i] = c;\n\t\ti++;\n\t}\n\ts[n] = '\\0';\n\treturn (s);\n}",["Extra byte in the allocation","Check before filling","Loop stops at n, not beyond","Terminator written at index n"],"The complete six-step sequence in miniature. Every string-producing function is a variation on it."),
 R("Write a main that allocates room for five integers, checks it, zeroes them, and releases the memory.","No extra byte here — that is only for strings.","#include <stdlib.h>\n\nint\tmain(void)\n{\n\tint\t*tab;\n\tint\ti;\n\n\ttab = malloc(sizeof(int) * 5);\n\tif (tab == NULL)\n\t\treturn (1);\n\ti = 0;\n\twhile (i < 5)\n\t{\n\t\ttab[i] = 0;\n\t\ti++;\n\t}\n\tfree(tab);\n\treturn (0);\n}",["Correct unit size","No plus one","Returns 1 on failure","free before the final return"],"Returning a non-zero value on failure is the convention the shell reads. Zero means success."),
 R("Write the release of a NULL-terminated array of strings, innermost first.","Two levels allocated, two levels freed.","i = 0;\nwhile (tab[i] != NULL)\n{\n\tfree(tab[i]);\n\ti++;\n}\nfree(tab);",["Each string freed inside the loop","The array freed after the loop","Sentinel drives the loop"],"Reversing the order loses the pointers before you can use them, which leaks every string.")],
assign:[
 S("C07","ft_strdup","char *ft_strdup(char *src);","malloc","Allocate a copy of the source string and return it.","Measure first, then allocate with the extra byte, then copy. Three passes over the same string, and that is fine."),
 S("C07","ft_range","int *ft_range(int min, int max);","malloc","Return an allocated array containing every value from min up to but excluding max.","Work out the element count on paper before writing anything. And the brief states what happens when min is not below max."),
 S("C07","ft_ultimate_range","int ft_ultimate_range(int **range, int min, int max);","malloc","The same range, but delivered through a pointer parameter, with the size returned.","The double pointer exists because the function must change a pointer belonging to the caller. That is the whole lesson here."),
 S("C07","ft_strjoin","char *ft_strjoin(int size, char **strs, char *sep);","malloc","Join an array of strings into one allocated string, placing the separator between them.","The total length must be computed before allocating, separators included. And zero strings has a defined result."),
 S("C07","ft_split","char **ft_split(char *str, char *charset);","malloc","Split a string on any character of the charset into a NULL-terminated array of allocated strings.","Two levels of allocation and two sentinels. Count the words first, then allocate, then fill.")],
chall:[
 X("ft_strdup","Allocate and return a copy of a string.","P2, P10","The extra byte and the NULL check are both required, and the brief specifies the failure behaviour."),
 X("ft_range","Return an allocated array of the values between two bounds.","P10","Decide what happens when the first bound is not below the second before you allocate anything."),
 X("ft_rrange","The same range in the opposite order.","P10","Identical machinery with the fill loop reversed. Do it straight after the previous one."),
 X("ft_split","Split a string into an allocated array of words.","P5, P10","The separators are fixed by the brief here rather than supplied. The array ends with NULL."),
 X("ft_itoa","Convert an integer into an allocated string.","P8, P10","Count the digits before allocating, and remember the sign needs a byte. The most negative value has no positive twin.")]},
/* ========== PHASE 4 — NUMBERS ========== */
{id:"numbers",grp:"Numbers",tit:"Numbers, bases & conversion",
lead:"Two operations convert between text and numbers in any base. Learn them once and atoi, itoa, hexadecimal and binary all collapse into the same exercise.",
theory:[
 H("Text into number"),
 C("result = result * 10 + (str[i] - '0');"),
 P("Because 123 is 1, then 12, then 123 — each new digit pushes what you already have one place left. That single line is the heart of every text-to-number conversion."),
 P("A complete conversion has three phases: skip leading whitespace, handle signs, then accumulate digits until something that is not a digit appears. Briefs differ on how many signs are allowed and what they mean, so read yours."),
 H("Number into text"),
 C("n % 10    /* the LAST digit */\nn / 10    /* chops it off */"),
 A("123 % 10 = 3   ->  123 / 10 = 12\n 12 % 10 = 2   ->   12 / 10 = 1\n  1 % 10 = 1   ->    1 / 10 = 0   ← stop"),
 W("<b>This produces the digits backwards.</b> Two ways out: recursion, handling the division <i>before</i> printing the digit; or a buffer written from the end towards the front. Both are accepted; recursion is shorter to defend."),
 W("<b>The most negative integer has no positive twin.</b> The range is asymmetric by one, so negating it overflows. Either special-case it, work in a wider type, or work entirely in negatives and flip the sign only at the very end."),
 H("Any base at all"),
 TB(["Direction","Formula"],[["text into number","<code>result = result * base + value</code>"],["number into text","<code>n % base</code> gives the symbol, <code>n / base</code> chops"]]),
 P("The symbol comes from a base string such as the digits followed by letters, and a symbol's value is simply its <b>position</b> in that string. Swap the base string and everything else stays identical."),
 K("A base string must be validated before use: at least two symbols, no duplicates, and no sign characters or whitespace inside it. Briefs state these rules explicitly and test them."),
 I("Integer division truncates towards zero, and the remainder carries the sign of the left operand. Negative inputs therefore need care in every direction of conversion.")],
quiz:[
 Q("Which operation gives the last digit of a number in any base?",["Division by the base","The remainder of division by the base","Subtracting the base","Multiplying by the base","The base modulo the number"],1,"The remainder is always the final symbol in that base.","And the division chops it away. Repeating both until nothing is left extracts every digit, in reverse."),
 Q("Why does printing digits need reversal or recursion?",["Division is slow","The extraction produces them from last to first","The terminator gets in the way","Because of signs","It does not"],1,"You always reach the least significant digit first.","Recursion handles the division before emitting, so the deepest call prints first. A buffer written backwards achieves the same by other means."),
 Q("Why does negating the most negative integer break?",["C forbids negation","Its positive twin does not fit in the type","It is unsigned","A cast is missing","It does not break"],1,"The range holds one more negative value than positive ones.","Working in negatives throughout and flipping only at the end sidesteps it entirely, which is why several reference implementations do exactly that."),
 Q("What makes a base string invalid?",["Being longer than sixteen","Fewer than two symbols, or duplicates, or a sign character inside","Containing letters","Containing digits","Nothing"],1,"All three conditions are stated in the briefs and all three are tested.","Duplicates would make the conversion ambiguous, and a sign inside the base would make parsing undecidable. The rules are not arbitrary."),
 Q("What are 7 divided by 2 and 7 modulo 2, with integers?",["3.5 and 1","3 and 1","4 and 1","3 and 0.5","4 and 0"],1,"Integer division truncates and the modulo returns the remainder.","With a negative left operand the remainder is negative too, which surprises people coming from mathematics where it is usually defined otherwise.")],
debug:[
 D("result = result + (str[i] - '0');\ni++;","Accumulating a number from text. What is missing?",["The multiplication by the base before adding","The conversion","The index step","The initialisation","Nothing"],0,"Without shifting what you already have, every digit is simply summed.","The string 123 would produce six. The multiply-then-add order is the entire mechanism, and reversing it gives a different wrong answer."),
 D("while (str[i] >= '0' && str[i] <= '9')\n{\n\tresult = result * 10 + str[i];\n\ti++;\n}","The digits are recognised but the value is enormous. Why?",["The bound is wrong","The character was never converted to a number","It should divide","The index is wrong","result is uninitialised"],1,"The character's own value, forty-eight and upwards, is being accumulated.","Subtracting the zero character turns the symbol into the number it represents. Missing that conversion is the single most common slip here."),
 D("if (n < 0)\n{\n\tft_putchar('-');\n\tn = -n;\n}","Printing a negative number. When does this fail?",["Never","At the most negative value, which has no positive twin","When n is zero","When n is small","Only in other bases"],1,"Negating the extreme value overflows and leaves it negative.","The sign prints, the value stays negative, and every subsequent digit comes out wrong. Handling it as a special case or staying in negatives are the two standard fixes."),
 D("while (n > 0)\n{\n\tft_putchar(n % 10 + '0');\n\tn = n / 10;\n}","Printing a number. Two problems. Which?",["Only the order","Only zero","The digits come out reversed, and zero prints nothing","The conversion is wrong","Nothing"],2,"Extraction runs from the last digit backwards, and the loop never runs for zero.","Both are stated cases in the briefs. Recursion fixes the order, and zero needs an explicit branch or a differently shaped loop."),
 D("i = 0;\nwhile (base[i] != '\\0')\n{\n\tif (base[i] == '+' || base[i] == '-')\n\t\treturn (0);\n\ti++;\n}\nreturn (1);","Validating a base string. What is still unchecked?",["Nothing","Duplicate symbols and a length below two","Whitespace","Letters","The terminator"],1,"Signs are only one of the three rules.","Duplicates make conversion ambiguous, and a base of one symbol cannot represent anything. All three are tested, so all three need checking.")],
practice:[
 R("Write the two lines that accumulate one digit character into a running result, base ten.","Shift what you have, then add the new digit as a number.","result = result * 10 + (str[i] - '0');\ni++;",["Multiplication before addition","Subtracts the zero character","Parentheses around the conversion","Index advanced"],"Replace the ten with a base parameter and this single line converts from any base."),
 R("Write <code>digit_sum</code>: takes a positive integer and returns the sum of its digits.","Remainder gives the digit, division chops it away.","int\tdigit_sum(int n)\n{\n\tint\ttotal;\n\n\ttotal = 0;\n\twhile (n > 0)\n\t{\n\t\ttotal = total + (n % 10);\n\t\tn = n / 10;\n\t}\n\treturn (total);\n}",["Loop condition on n above zero","Remainder taken before dividing","Both operations use the same base"],"Swap the ten for a parameter and you have the engine of every base conversion."),
 R("Write <code>count_digits</code>: how many digits a positive integer has, with zero counting as one.","A loop that divides, plus one special case.","int\tcount_digits(int n)\n{\n\tint\tc;\n\n\tc = 0;\n\tif (n == 0)\n\t\treturn (1);\n\twhile (n > 0)\n\t{\n\t\tc++;\n\t\tn = n / 10;\n\t}\n\treturn (c);\n}",["Zero handled before the loop","Counter incremented each division","Loop stops when nothing is left"],"You need this before allocating, because the number of digits decides the buffer size."),
 R("Write <code>base_value</code>: given a symbol and a base string, return its position, or minus one if absent.","Walk the base string and compare.","int\tbase_value(char c, char *base)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (base[i] != '\\0')\n\t{\n\t\tif (base[i] == c)\n\t\t\treturn (i);\n\t\ti++;\n\t}\n\treturn (-1);\n}",["Returns the index, not the character","Returns minus one when absent","Step outside the if"],"A symbol's value is literally its position. That realisation makes arbitrary bases no harder than base ten.")],
assign:[
 S("C00","ft_putnbr","void ft_putnbr(int nb);","write","Display an integer on standard output.","The digits come out backwards and the extreme negative value has no positive twin. Both are required, not optional."),
 S("C04","ft_putnbr","void ft_putnbr(int nb);","write","The same function again inside the conversion module.","Repeated on purpose. If you copy your old file you learn nothing; if you rewrite it, the digit mechanism becomes permanent."),
 S("C04","ft_atoi","int ft_atoi(char *str);","None","Reproduce atoi: read an integer out of a string.","Three phases: whitespace, signs, digits. The brief specifies how multiple signs behave — do not guess."),
 S("C04","ft_putnbr_base","void ft_putnbr_base(int nbr, char *base);","write","Print a number in an arbitrary base, validating the base string first.","The validation rules are explicit: length, duplicates, and forbidden characters. An invalid base prints nothing at all."),
