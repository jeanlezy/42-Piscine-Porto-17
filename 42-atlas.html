{id:"recursion",grp:"Numbers",tit:"Recursion & mathematics",
lead:"A function that calls itself is not magic — it is a loop whose state lives on the stack. The whole skill is knowing where it stops.",
theory:[
 P("Every recursive function needs two parts: a <b>base case</b> that returns without recursing, and a <b>recursive case</b> that moves strictly closer to it. Miss either and the stack fills until the program dies."),
 A("factorial(3)\n  └─ 3 * factorial(2)\n        └─ 2 * factorial(1)\n              └─ 1 * factorial(0)\n                    └─ returns 1   ← base case\n\nunwinding: 1 -> 1 -> 2 -> 6"),
 K("Notice the work happens on the way <b>back up</b>. That property is what makes recursion the neat answer to printing digits in the right order: recurse first, emit afterwards."),
 W("<b>Moving closer is not automatic.</b> A recursive call with an unchanged argument, or one that changes in the wrong direction, recurses forever. Negative inputs are the usual culprit, which is why briefs specify what to return for them."),
 H("Iteration and recursion are interchangeable"),
 P("Anything you can write with a loop you can write recursively and the reverse. The briefs deliberately ask for both versions of the same function so you can feel the difference: the loop keeps state in a variable, the recursion keeps it on the stack."),
 H("The mathematics you actually need"),
 TB(["Question","Tool"],[["does a divide b?","the remainder is zero"],["is it prime?","try divisors while the square of the divisor does not exceed the number"],["greatest common divisor","replace the pair with the second and the remainder, until the second is zero"],["is it a power of two?","exactly one bit set"],["integer square root","try candidates while their square does not exceed the number"]]),
 I("Testing divisors up to the square root rather than up to half is not a micro-optimisation. Some briefs are time-limited, and the difference between the two is the difference between passing and timing out."),
 W("Overflow arrives fast with factorials and powers. The briefs state what to return when the result cannot be represented, and that clause is part of the exercise rather than an afterthought.")],
quiz:[
 Q("What are the two mandatory parts of a recursive function?",["A loop and a return","A base case and a step that moves towards it","A pointer and a counter","Two returns","A cast and a guard"],1,"One stops the descent, the other guarantees you reach it.","Having a base case is not enough if the argument never approaches it. Both halves must be present and must agree with each other."),
 Q("Why is recursion natural for printing digits in order?",["It is faster","Because the work happens while unwinding, after the deepest call","Because it uses less memory","Because division is recursive","It is not"],1,"You recurse on the chopped number first and emit afterwards.","The deepest call holds the most significant digit and returns first, so the output arrives in the right order without a buffer."),
 Q("Testing whether a number is prime, where should the divisor loop stop?",["At the number","At half the number","Where the divisor squared exceeds the number","At ten","At the square root, computed with a library call"],2,"Beyond that point any factor would already have been found as the smaller half of a pair.","Squaring the divisor avoids needing a square root function at all, which matters when the library is forbidden."),
 Q("What happens when a recursive call does not move closer to the base case?",["It returns zero","The stack fills until the program dies","It loops once","The compiler catches it","Undefined but harmless"],1,"Each call consumes stack space that is never released.","The crash message often looks unrelated to recursion, which is why the habit of checking the direction of movement before running is worth having."),
 Q("A factorial brief says the result may not be representable. What does that imply?",["Nothing","That a defined return value for that case is part of the exercise","That you need floating point","That recursion is banned","That the input is always small"],1,"Overflow behaviour is specified, not left to you.","Ignoring it produces a function that works for small inputs and silently lies for larger ones, which is exactly what gets tested.")],
debug:[
 D("int\tfact(int n)\n{\n\treturn (n * fact(n - 1));\n}","This never returns. What is missing?",["The parameter type","A base case","The multiplication","A cast","Nothing"],1,"Nothing ever stops the descent.","The argument does decrease, so the direction is right — but with no stopping condition it simply runs past zero into negatives until the stack is exhausted."),
 D("int\tfact(int n)\n{\n\tif (n == 0)\n\t\treturn (1);\n\treturn (n * fact(n));\n}","The base case exists and it still never returns. Why?",["The base case is wrong","The recursive call passes the same value, so it never approaches the base","It should be n plus one","The return type is wrong","Nothing"],1,"The argument never changes, so the base case is never reached.","Both halves must agree: a stopping condition is useless if the step does not travel towards it. Check the direction every time before running."),
 D("int\tfact(int n)\n{\n\tif (n == 0)\n\t\treturn (1);\n\treturn (n * fact(n - 1));\n}","With a negative argument, what happens?",["It returns one","It returns zero","It recurses away from the base case until the stack dies","It returns the input","A compile error"],2,"Subtracting from a negative number moves further from zero, not closer.","The briefs specify a return value for invalid inputs precisely because of this. A guard at the top costs one line and removes the whole failure mode."),
 D("i = 2;\nwhile (i <= n / 2)\n{\n\tif (n % i == 0)\n\t\treturn (0);\n\ti++;\n}\nreturn (1);","This is correct but can time out. What is the cheap improvement?",["Start at three","Stop when the divisor squared exceeds the number","Use recursion","Skip even numbers only","Nothing helps"],1,"Any factor above the square root pairs with one below it, already found.","Squaring the divisor keeps everything in integers and needs no library call. On large inputs the difference is enormous."),
 D("while (b != 0)\n{\n\ta = b;\n\tb = a % b;\n}\nreturn (a);","A greatest common divisor. Why does this fail?",["The loop condition","<code>a</code> is overwritten before its old value is used in the remainder","It should be <code>a % b</code> first","b should start at one","Nothing"],1,"By the second line the original value of a is gone, so the remainder is computed against itself.","A temporary is needed, exactly as in a value exchange. This is the same lesson as swapping, wearing different clothes.")],
practice:[
 R("Write <code>fact</code> recursively, returning zero for negative input and one for zero.","A guard, a base case, and a step that travels towards it.","int\tfact(int n)\n{\n\tif (n < 0)\n\t\treturn (0);\n\tif (n == 0)\n\t\treturn (1);\n\treturn (n * fact(n - 1));\n}",["Negative guard first","Base case for zero","Recursive call moves towards the base","All returns in parentheses"],"Three lines, three decisions. The guard is what stops a negative input from running away."),
 R("Write the same thing iteratively.","A running product and a counter.","int\tfact(int n)\n{\n\tint\tr;\n\n\tif (n < 0)\n\t\treturn (0);\n\tr = 1;\n\twhile (n > 1)\n\t{\n\t\tr = r * n;\n\t\tn--;\n\t}\n\treturn (r);\n}",["Product starts at one, not zero","Guard retained","Loop counts down towards one"],"Writing both versions of the same function is how you feel that the stack was simply holding your loop variable for you."),
 R("Write the divisor loop that decides primality efficiently.","Stop where the divisor squared passes the number.","i = 2;\nwhile (i * i <= n)\n{\n\tif (n % i == 0)\n\t\treturn (0);\n\ti++;\n}\nreturn (1);",["Starts at two","Bound uses the squared divisor","Returns zero on the first factor found","Returns one after the loop"],"Numbers below two need a separate decision, and the brief tells you what it should be."),
 R("Write the greatest common divisor loop, using a temporary.","Replace the pair with the second and the remainder.","while (b != 0)\n{\n\ttmp = b;\n\tb = a % b;\n\ta = tmp;\n}\nreturn (a);",["Temporary saved before overwriting","Remainder computed with the old values","Loop ends when the second reaches zero","Returns the first"],"The temporary is doing exactly what it did in a value exchange: preserving something you are about to destroy.")],
assign:[
 S("C05","ft_iterative_factorial","int ft_iterative_factorial(int nb);","None","Compute a factorial with a loop.","Negative input and overflow both have specified return values. Read them before starting."),
 S("C05","ft_recursive_factorial","int ft_recursive_factorial(int nb);","None","The same result, recursively.","Same guards, different shape. Doing both back to back is the point of the pair."),
 S("C05","ft_iterative_power","int ft_iterative_power(int nb, int power);","None","Raise a number to a power with a loop.","A power of zero has a defined answer, and a negative exponent has another. Both are in the brief."),
 S("C05","ft_recursive_power","int ft_recursive_power(int nb, int power);","None","The same, recursively.","The base case is the exponent reaching zero, not the number."),
 S("C05","ft_fibonacci","int ft_fibonacci(int index);","None","Return the value at a given index of the sequence.","The brief fixes where the sequence starts, which changes every answer. Do not rely on memory."),
 S("C05","ft_sqrt","int ft_sqrt(int nb);","None","Return the integer square root, or zero when there is none.","Try candidates while their square does not exceed the input. Watch for overflow when squaring large candidates."),
 S("C05","ft_is_prime","int ft_is_prime(int nb);","None","Return 1 when the number is prime, 0 otherwise.","Numbers below two need an explicit decision, and the divisor bound decides whether you time out."),
 S("C05","ft_find_next_prime","int ft_find_next_prime(int nb);","None","Return the smallest prime greater than or equal to the input.","Builds directly on the previous exercise. If that one is slow, this one is far slower."),
 S("C05","The Ten Queens","int ft_ten_queens_puzzle(void);","write","Print every arrangement of ten queens on a ten by ten board where none attacks another, and return the count.","Backtracking: place, recurse, undo. The undo step is what people forget, and without it the search is wrong rather than merely slow.")],
chall:[
 X("add_prime_sum","Print the sum of all primes up to and including a given number.","P8, P13","Invalid or negative input has a specified output. The divisor bound matters for speed."),
 X("fprime","Print the prime factors of a number, separated by a symbol the brief chooses.","P8, P13","One is a stated special case. Factors come out in ascending order."),
 X("pgcd","Print the greatest common divisor of two numbers.","P8, P13","The classic replacement loop needs a temporary. Check what the brief says about zero."),
 X("is_power_of_2","Decide whether a number is a power of two.","P9, P13","Zero is not one, despite what a naive bit test suggests."),
 X("max","Return the largest value of an integer array.","P13","The empty case is defined in the brief. Reaching for zero as a default is the trap.")]},
{id:"bits",grp:"Numbers",tit:"Bits & raw memory",
lead:"A byte is eight switches. Three recipes let you read, set and clear any one of them — and a fourth idea lets you look at any object in memory as the bytes it really is.",
theory:[
 A("bit:    7   6   5   4   3   2   1   0\n       ┌───┬───┬───┬───┬───┬───┬───┬───┐\n       │ 0 │ 0 │ 1 │ 0 │ 0 │ 1 │ 1 │ 0 │  = 38\n       └───┴───┴───┴───┴───┴───┴───┴───┘\nvalue: 128  64  32  16   8   4   2   1"),
 TB(["Operator","Name","Result"],[["<code>&amp;</code>","and","one only when both are one"],["<code>|</code>","or","one when either is one"],["<code>^</code>","exclusive or","one when they differ"],["<code>~</code>","not","every bit flipped"],["<code>&lt;&lt;</code>","shift left","pushes left, doubling per place"],["<code>&gt;&gt;</code>","shift right","pushes right, halving per place"]]),
 H("The three recipes"),
 C("(n >> k) & 1        /* READ bit k */\nn | (1 << k)        /* SET bit k */\nn & ~(1 << k)       /* CLEAR bit k */"),
 P("The tilde turns a mask holding a single one into a mask holding a single zero, so combining it with and erases exactly that bit and preserves the rest. Bits are always numbered from zero on the right."),
 W("<b>Always use unsigned types.</b> With a signed type the right shift copies the sign bit inward, filling with ones where you expected zeros. Applied to a value of all ones, the result never changes at all — a surprising infinite loop."),
 K("Setting a bit that is already set changes nothing, which is what makes masks ideal for storing a set of options: twenty-six letters fit in twenty-six bits of a single integer, and adding one twice is harmless."),
 I("A number is a power of two exactly when one bit is set. Combining a value with the value one below it clears the rightmost set bit — draw your own conclusion, and remember zero would slip through."),
 H("Looking at memory as bytes"),
 P("Any object can be inspected by treating its address as a pointer to unsigned characters. That is how a memory dump works: walk the bytes, print each in hexadecimal, and show the printable ones alongside."),
 W("Hexadecimal output is usually padded to a fixed width, so values below sixteen still need a leading zero. And the final line of a dump is rarely full, so it needs padding with spaces to keep the columns aligned. Both details are where dump exercises fail.")],
quiz:[
 Q("38 in binary is 00100110. What is the value of bit 2?",["0","1","2","4","38"],1,"Counting from zero on the right, bit two is set.","The read recipe shifts that bit down to position zero and masks everything else away, leaving exactly one or zero."),
 Q("Why do bit exercises insist on unsigned types?",["Less memory","So the right shift brings in zeros instead of copying the sign","Faster arithmetic","Norm requirement","Because chars are eight bits"],1,"A signed right shift replicates the sign bit.","With a value of all ones the result stays all ones forever, producing loops that never terminate. It is a defined behaviour, just not the one you wanted."),
 Q("What does combining a value with the value one below it do?",["Doubles it","Clears the rightmost set bit","Sets every bit","Negates it","Nothing"],1,"It removes the lowest one.","Which is why the result being zero identifies a power of two — with the caveat that zero itself would also qualify and must be excluded separately."),
 Q("Why are masks good for storing sets of options?",["They are fast","Because setting an already-set bit is harmless, so adding twice is safe","They use less memory than arrays","They sort automatically","They cannot overflow"],1,"The or operation is idempotent.","Twenty-six letters fit in a single integer, and repeated flags simply collapse. That is exactly how option-parsing exercises are meant to be solved."),
 Q("In a hexadecimal dump, why do values below sixteen need special care?",["They are invalid","They print as one digit instead of two, breaking the columns","They are negative","They are unprintable","They do not"],1,"A leading zero is required to keep the fixed width.","The other classic failure is the last line, which is rarely full and must be padded with spaces so the printable column still lines up.")],
debug:[
 D("char\toctet;\n\noctet = -1;\nresult = octet >> 4;","The result is not what you expect. Why?",["Shifting does not work on char","The type is signed, so the shift copies the sign bit","Four is too large","It needs a cast to int","Nothing is wrong"],1,"A signed right shift fills from the left with copies of the sign bit.","A value of all ones stays all ones however far you shift it. Declaring the variable unsigned makes the shift bring in zeros, which is the predictable behaviour."),
 D("n = n | 1 << k;","Setting a bit. What is risky here?",["The operator is wrong","Missing parentheses around the shift make the precedence hard to trust","k may be negative","It should be <code>&amp;</code>","Nothing"],1,"Bitwise precedence in C is famously counterintuitive, and this expression relies on the reader knowing it.","It happens to group correctly, but any reviewer will stop to check. Two characters of parentheses remove the question permanently."),
 D("if (n & (n - 1) == 0)\n\treturn (1);","Testing for a power of two. What is wrong?",["The formula is wrong","Comparison binds tighter than the bitwise and, so the grouping is inverted","It needs <code>||</code>","Zero is not handled","Both the second and the fourth"],4,"Two separate faults: the precedence is wrong, and zero would pass.","Equality binds tighter than the bitwise and, so the comparison happens first. Parentheses around the whole bitwise expression fix the grouping, and zero needs its own guard."),
 D("i = 0;\nwhile (i < 8)\n{\n\tft_putchar((n >> i) & 1);\n\ti++;\n}","Printing bits produces nothing visible. Why?",["The shift is wrong","The result is zero or one, which are invisible control bytes","The loop runs backwards","The mask is wrong","Nothing"],1,"You printed the values rather than the characters representing them.","Adding the zero character converts them into printable digits. This is the same conversion that catches people when printing numbers."),
 D("i = 0;\nwhile (i < 8)\n{\n\tft_putchar((n >> i) & 1 ? '1' : '0');\n\ti++;\n}","Two problems. Which?",["Only the order","Only the ternary","The bits print least significant first, and the ternary is banned by the Norm","The mask is wrong","Nothing"],2,"Bit zero is the rightmost, so this prints the byte reversed.","Counting down from seven fixes the order, and the ternary must become an if and else because the Norm forbids it entirely.")],
practice:[
 R("Write the three bit recipes: read, set and clear bit <code>k</code> of <code>n</code>.","Shift and mask. Clearing needs a flip.","(n >> k) & 1\nn | (1 << k)\nn & ~(1 << k)",["Read shifts then masks with one","Set uses or","Clear uses and with a flipped mask","Parentheses around each shift"],"Those parentheses are not optional in practice: bitwise precedence is the least memorable part of the language."),
 R("Write <code>count_bits</code>: takes an unsigned char and returns how many of its bits are set.","Eight positions, read each one and add it in.","int\tcount_bits(unsigned char c)\n{\n\tint\ti;\n\tint\tn;\n\n\ti = 0;\n\tn = 0;\n\twhile (i < 8)\n\t{\n\t\tn = n + ((c >> i) & 1);\n\t\ti++;\n\t}\n\treturn (n);\n}",["Parameter is unsigned","Loop runs exactly eight times","Reads with shift and mask","Adds the zero or one directly"],"Because the read yields exactly zero or one, no branch is needed — you add the bit itself."),
 R("Write the loop that prints a byte in binary, most significant bit first.","Count down, and convert before printing.","i = 7;\nwhile (i >= 0)\n{\n\tft_putchar(((c >> i) & 1) + '0');\n\ti--;\n}",["Starts at seven","Counts down to zero inclusive","Converts with the zero character","Uses an unsigned parameter"],"Counting up would print the byte backwards, which is the most common mistake in this whole family."),
 R("Write the two lines that expose any object as raw bytes, ready to be walked.","One cast, one pointer.","unsigned char\t*bytes;\n\nbytes = (unsigned char *)addr;",["Pointer to unsigned char","Cast on the assignment","Declaration uninitialised at the top"],"Unsigned matters here too: printing a signed byte above 127 would show a negative value rather than the byte it is.")],
assign:[
 S("C02","ft_print_memory","void *ft_print_memory(void *addr, unsigned int size);","write","Print a memory area as hexadecimal followed by its printable characters, sixteen bytes per line, returning the address.","Three formatting traps at once: padding small values to two digits, padding the last incomplete line with spaces, and substituting a symbol for unprintable characters."),
 S("C02","ft_putstr_non_printable","void ft_putstr_non_printable(char *str);","write","Print a string, rendering every non-printable character as a backslash followed by two lowercase hexadecimal digits.","Values below sixteen still need two digits. Missing that leading zero is the failure almost everyone hits first.")],
chall:[
 X("print_bits","Print a byte in binary.","P9","Eight characters, most significant first, and no newline unless the brief asks for one."),
 X("swap_bits","Exchange the two halves of a byte.","P9","Four bits each way. Masks and shifts, no loop needed."),
 X("reverse_bits","Reverse the order of the bits in a byte.","P9","Build the result one bit at a time, shifting it as you go."),
 X("is_power_of_2","Decide whether a number is a power of two.","P9, P13","Exactly one bit set — and zero must be excluded explicitly."),
 X("options","Read single-letter flags and report them as a bit mask.","P1, P9","Unknown flags and the help flag both have defined behaviour. Letters map to bit positions."),
 X("print_memory","Dump a memory area as hexadecimal and printable characters.","P9, P15","Padding on both the values and the final line is where this one is won or lost.")]},
/* ========== PHASE 5 — STRUCTURES & CORE ========== */
{id:"structs",grp:"Structures & core",tit:"Headers, macros & structs",
lead:"Where a program stops being one file. Headers share declarations, macros substitute text before compilation, and structs let you name a group of values as one thing.",
theory:[
 H("What a header is for"),
 P("A header carries <b>declarations</b>, not definitions: prototypes, type definitions and macros. Each source file that includes it learns those names without duplicating the code behind them."),
 C("#ifndef FT_H\n# define FT_H\n\nvoid\tft_putchar(char c);\n\n#endif"),
 W("<b>Include guards are mandatory.</b> Without them a header included twice defines the same names twice and compilation fails. The pattern is always the same three lines, and the Norm expects the inner directives to be indented after the hash."),
 H("Macros substitute text"),
 P("A macro is replaced before the compiler ever sees your code. That makes it powerful and dangerous in equal measure: it has no idea about types, scope or operator precedence."),
 W("<b>Wrap macro parameters and the whole body in parentheses.</b> A macro that expands into an expression without them will be regrouped by whatever surrounds it, producing arithmetic you never wrote."),
 K("A macro that evaluates its parameter more than once will execute side effects more than once. That is why the classic absolute-value macro is a genuine trap rather than a convenience."),
 H("Structs group values under one name"),
 C("typedef struct\ts_point\n{\n\tint\tx;\n\tint\ty;\n}\t\t\tt_point;"),
 P("The typedef gives the type a short name so you can write it without repeating the keyword. Inside the definition you must still use the long form, because the short name does not exist yet at that point in the file."),
 TB(["You write","When"],[["<code>value.field</code>","you hold the struct itself"],["<code>ptr-&gt;field</code>","you hold a pointer to it"]]),
 P("The arrow is shorthand for dereferencing and then reaching the field. Written the long way it needs parentheses, because the field access would otherwise bind tighter than the dereference — which is exactly the confusion the arrow exists to remove."),
 I("Passing a large struct by value copies every byte. Passing its address copies eight. For anything beyond a couple of fields, pass the address.")],
quiz:[
 Q("What do include guards prevent?",["Slow compilation","The same header being processed twice in one file","Missing prototypes","Name collisions between files","Circular dependencies only"],1,"A second inclusion would redefine the same names.","The guard is a macro that only lets the body through the first time. The three-line pattern is identical in every header you will ever write."),
 Q("Why must macro parameters be wrapped in parentheses?",["Style","Because the substitution is textual, so surrounding operators can regroup it","To allow multiple arguments","Because of the Norm","They need not be"],1,"The macro is replaced before any parsing happens.","An expression substituted into a larger one is at the mercy of precedence. Parentheses around each parameter and around the whole body remove the risk entirely."),
 Q("What is the danger of a macro that uses its parameter twice?",["Slower code","Any side effect in the argument happens twice","It cannot compile","Type errors","Nothing"],1,"The argument text is inserted at each use.","Passing something with an increment inside it therefore increments twice. The classic absolute-value macro has exactly this flaw, which is why it is a teaching example."),
 Q("Inside a struct definition, why must the long form be used for a self-referencing field?",["Style","Because the short name does not exist yet at that point","Pointers require it","The Norm requires it","It does not"],1,"The typedef name is only established once the definition closes.","This is why a self-referencing pointer inside a node definition looks more verbose than the rest of your code. It is not an oversight."),
 Q("When should you pass a struct by address rather than by value?",["Always","Never","Whenever copying it costs more than copying a pointer","Only for output parameters","Only in headers"],2,"A pointer is eight bytes whatever the struct contains.","And passing the address is also what lets the function modify the caller's copy, which is often the actual reason.")],
debug:[
 D("#ifndef FT_H\n#define FT_H\nvoid\tft_putchar(char c);\n#endif","This works but fails the Norm. Why?",["The guard name is wrong","The directives inside the guard must be indented after the hash","A prototype cannot be in a header","The endif needs a name","Nothing"],1,"Nested preprocessor directives are indented with a space after the hash symbol.","The logic is correct; only the layout is rejected. It is a small rule that costs a whole file if you only discover it at the end."),
 D("#define ABS(x) x < 0 ? -x : x","Two serious problems. Which?",["Only the missing parentheses","Only the ternary","Missing parentheses around the parameter and body, and the ternary is banned","The name is reserved","Nothing"],2,"Textual substitution plus precedence, and a construct the Norm forbids outright.","Used inside a larger expression, the unparenthesised body regroups. And the ternary cannot appear at all, so the macro has to be built differently."),
 D("typedef struct\ts_list\n{\n\tt_list\t*next;\n}\t\t\tt_list;","This does not compile. Why?",["The typedef is misplaced","The short name is used before it exists","A struct cannot contain a pointer to itself","The name is reserved","Nothing"],1,"At that line the short name has not been established yet.","The field must use the long form with the struct keyword and the tag. The typedef name only becomes usable after the closing line."),
 D("t_point\tp;\n\np->x = 3;","This does not compile. Why?",["The field does not exist","The arrow is for pointers, and this is a value","x must be initialised","The typedef is wrong","Nothing"],1,"The variable holds the struct itself, so the dot is the correct accessor.","Using the arrow on a value, or the dot on a pointer, are the two halves of the same confusion. Ask yourself which one you are holding before you type."),
 D("#define SIZE 10\n\nint\ttab[SIZE + 1];\nint\tother[SIZE * 2];","One of these two array sizes is not what the author intended. Which, and why?",["The first, the addition is misplaced","Neither, both are fine","The second, if SIZE were defined as an expression the multiplication would regroup","The first, SIZE cannot be used in a size","Both are wrong"],2,"With a plain number both are fine, but the habit is fragile.","Had the macro been defined as a small expression rather than a single token, the multiplication would bind to only part of it. Parenthesising macro bodies makes the habit safe regardless.")],
practice:[
 R("Write a complete header guarding one prototype, in Norm style.","Three directives and one declaration.","#ifndef FT_H\n# define FT_H\n\nvoid\tft_putchar(char c);\n\n#endif",["Guard opens with ifndef and defines the same name","Inner directive indented after the hash","Prototype ends with a semicolon","Closing endif present"],"The guard name conventionally matches the filename in capitals, which keeps it unique across a project."),
 R("Write a macro returning the larger of two values, safely parenthesised.","Every parameter, and the whole body.","#define MAX(a, b) (((a) > (b)) ? (a) : (b))",["Each parameter wrapped","Whole body wrapped","No semicolon at the end"],"Note this is the safe general form — but the ternary inside means you could not use it in a Norm-checked file, which is a good reminder of what macros hide."),
 R("Write a struct describing a point with two integer fields, with a short type name.","Long form inside, short name after.","typedef struct\ts_point\n{\n\tint\tx;\n\tint\ty;\n}\t\t\tt_point;",["typedef struct with a tag","Fields one per line","Short name before the semicolon"],"The tag and the short name are conventionally related, which makes self-referencing definitions readable later."),

{id:"funcptr",grp:"Structures & core",tit:"Function pointers",
lead:"A function has an address like anything else. Once you can pass that address around, one loop can serve a hundred different behaviours.",
theory:[
 C("void\tft_foreach(int *tab, int length, void (*f)(int));"),
 P("Read the parameter from the inside out: <code>f</code> is a pointer, to a function, taking an int, returning nothing. The parentheses around the asterisk are what make it a pointer to a function rather than a function returning a pointer."),
 K("Calling it is simply <code>f(tab[i])</code>. The older explicit form with an asterisk also works, and both mean the same thing — the function name already decays to its address, exactly as an array name does."),
 H("Why this matters"),
 P("Without it, applying five different operations to an array means five nearly identical loops. With it, one loop takes the operation as an argument. That is the whole idea behind apply, map, filter and count-style functions."),
 TB(["Shape","What it does"],[["apply","runs the function on every element, discarding results"],["map","builds a new array from the returned values"],["any","stops at the first element the test accepts"],["count if","counts the elements the test accepts"],["sorted?","compares neighbours using a supplied comparison"]]),
 W("A <b>map</b> allocates, so it must handle allocation failure and the caller must free the result. An <b>apply</b> allocates nothing. Confusing which one you are writing produces either a leak or a missing return."),
 H("Comparison functions and their conventions"),
 W("<b>Read the specified meaning of the comparison every single time.</b> The library convention is that zero means equal, but some briefs define a comparison that returns a non-zero value when two items are <b>already in the right order</b> — the opposite polarity. Assuming the familiar one silently inverts your sort."),
 I("When a brief hands you a function pointer, write down in plain words what a non-zero result means before you write a single line. That sentence is the exercise.")],
quiz:[
 Q("How do you read the type void (*f)(int)?",["A function returning a pointer","A pointer to a function taking an int and returning nothing","An array of functions","A void pointer","An invalid type"],1,"The parentheses bind the asterisk to the name first.","Without them it would describe a function returning a pointer to void, which is a completely different thing. Those parentheses are load-bearing."),
 Q("What is the difference between apply and map?",["None","Apply discards results, map builds a new array from them","Map is faster","Apply allocates","Map takes no function"],1,"One consumes, the other produces.","Because map allocates, it must handle failure and the caller must free the result. Apply has no such obligations."),
 Q("A brief says the comparison returns a non-zero value when two items are in the right order. What does that change?",["Nothing","The polarity is inverted compared with the usual convention","It becomes a sort","It must return a pointer","It cannot be used"],1,"The familiar convention is the opposite, so assuming it inverts your result.","This is the single most expensive misreading in this whole category, because the code compiles, runs, and quietly produces a reversed order."),
 Q("Why does a function name work as an address without an ampersand?",["It does not","Because a function name decays to its address, like an array name","Because of the typedef","Only inside a call","Only for void functions"],1,"The decay is automatic, exactly as with arrays.","Writing the ampersand explicitly is also legal and means the same thing. Both forms appear in real code and neither is wrong."),
 Q("What must a map do that an apply need not?",["Take a function pointer","Handle allocation failure and hand ownership to the caller","Return void","Use recursion","Sort the result"],1,"Producing a new array means allocating one.","Forgetting the failure path is the usual omission, and forgetting to document who frees the result is the usual second one.")],
debug:[
 D("void\tft_foreach(int *tab, int length, void *f(int))","This parameter is not what was intended. Why?",["The name is wrong","Without parentheses it declares a function returning a pointer","It needs two asterisks","length must be unsigned","Nothing"],1,"The asterisk binds to the return type instead of to the name.","The parentheses around the asterisk and the name are what create a pointer to a function. It is the one place in C where they change meaning rather than only grouping."),
 D("i = 0;\nwhile (i < length)\n{\n\tf(tab[i]);\n\ti++;\n}\nreturn (tab);","An apply function shaped like this. What is wrong?",["The loop","It returns something an apply should not","f is called wrongly","length is unused","Nothing"],1,"Apply consumes elements and produces nothing.","Returning the array suggests a new one was built. Follow the prototype in the brief exactly — the return type is part of the contract."),
 D("new = malloc(sizeof(int) * length);\ni = 0;\nwhile (i < length)\n{\n\tnew[i] = f(tab[i]);\n\ti++;\n}\nreturn (new);","A map. What is missing?",["The loop bound","The allocation failure check","The function call","The return","Nothing"],1,"A failed allocation would be written to on the very next line.","Every allocating function needs the check immediately after, before any use. The brief also specifies what to return on failure."),
 D("if (cmp(tab[i], tab[i + 1]) > 0)\n\tswap(&tab[i], &tab[i + 1]);","Sorting with a supplied comparison whose brief says non-zero means already ordered. What is wrong?",["The indexes","The polarity is inverted, so it exchanges correctly ordered pairs","swap needs no ampersands","The bound is missing","Nothing"],1,"With that convention a non-zero result means leave them alone.","The code compiles and runs and produces a reversed order. Writing the meaning down in words before coding is what prevents it."),
 D("void\tapply(int *tab, int len, int (*f)(int))\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (i < len)\n\t{\n\t\tf(tab[i]);\n\t\ti++;\n\t}\n}","The results of every call are thrown away. Is that a bug?",["Yes, always","No — but the function pointer type suggests the wrong intent","Yes, it should return","No, the type is fine","It will not compile"],1,"The signature promises a result-producing function and the body ignores every result.","Either the pointer type should return nothing, or the results should be used. A mismatch between signature and body is a design smell a grader will ask about.")],
practice:[
 R("Write the parameter declaration for a function pointer taking an int and returning nothing, named <code>f</code>.","The parentheses are what make it a pointer.","void (*f)(int)",["Asterisk and name inside parentheses","Parameter list after","Return type first"],"Drop the inner parentheses and you have declared something completely different."),
 R("Write <code>ft_apply</code>: runs a supplied function on every element of an array.","One loop, one call, nothing returned.","void\tft_apply(int *tab, int len, void (*f)(int))\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (i < len)\n\t{\n\t\tf(tab[i]);\n\t\ti++;\n\t}\n}",["Returns void","Function pointer parameter declared correctly","Call written as <code>f(tab[i])</code>","Bound is strictly less than the length"],"This one loop replaces every variant you would otherwise write by hand."),
 R("Write <code>ft_count_if</code>: counts how many elements a supplied test accepts.","Same loop, a counter, and a conditional.","int\tft_count_if(int *tab, int len, int (*f)(int))\n{\n\tint\ti;\n\tint\tn;\n\n\ti = 0;\n\tn = 0;\n\twhile (i < len)\n\t{\n\t\tif (f(tab[i]) != 0)\n\t\t\tn++;\n\t\ti++;\n\t}\n\treturn (n);\n}",["Pointer returns int this time","Result compared explicitly against zero","Step outside the if"],"Comparing against zero explicitly rather than relying on truthiness makes the intended convention visible."),
 R("Write the allocation and check that open a map function producing <code>len</code> integers.","Two lines, and the failure path the brief specifies.","new = malloc(sizeof(int) * len);\nif (new == NULL)\n\treturn (NULL);",["Correct unit size","No extra byte — this is not a string","Check before any write","Returns NULL in parentheses"],"An apply needs none of this, which is the clearest way to feel the difference between the two shapes.")],
assign:[
 S("C11","ft_foreach","void ft_foreach(int *tab, int length, void (*f)(int));","None","Apply a function to every element of an array in order.","Nothing is returned and nothing is allocated. The exercise is entirely in reading the parameter type correctly."),
 S("C11","ft_map","int *ft_map(int *tab, int length, int (*f)(int));","malloc","Build a new allocated array from the results of applying a function.","Allocation, failure handling, and ownership passing to the caller."),

 S("C11","do-op","—","write, atoi, printf and others","A program evaluating a simple arithmetic expression given as arguments.","Wrong argument counts and unknown operators both have defined behaviour, and division by zero needs its own message."),
 S("C11","ft_sort_string_tab","void ft_sort_string_tab(char **tab);","None","Sort a NULL-terminated array of strings in ascending order.","You exchange the pointers, not the characters. The comparison is a string comparison."),
 S("C11","ft_advanced_sort_string_tab","void ft_advanced_sort_string_tab(char **tab, int (*cmp)(char *, char *));","None","The same sort, with the comparison supplied by the caller.","Read the stated meaning of the comparison's return value before you write the condition.")],

{id:"lists",grp:"Structures & core",tit:"Linked lists",
lead:"A train of carriages, each holding cargo and the address of the next. Once you see it as the same walking loop with a different sentinel, most of the module falls into place.",
theory:[
 C("typedef struct\ts_list\n{\n\tstruct s_list\t*next;\n\tvoid\t\t\t*data;\n}\t\t\t\tt_list;"),
 A("[data|next] ──► [data|next] ──► [data|NULL]"),
 K("<b>It is the string loop wearing different clothes.</b> Follow <code>next</code> instead of incrementing an index, and stop at NULL instead of the terminator. Seeing that saves you half the effort of the entire module."),
 C("while (lst != NULL)\n{\n\tuse(lst->data);\n\tlst = lst->next;\n}"),
 W("<b>The advance goes last.</b> Move first and you skip the first element and eventually reach through NULL. Same ordering trap as putting the increment at the top of a string loop."),
 P("And just as with strings, you are walking the pointer itself. If you need the head afterwards, save a copy before you start."),
 H("Why some functions take two asterisks"),
 W("Removing or inserting at the front can change <b>which element is the head</b>. To update the caller's own pointer you need its address — so the parameter becomes a pointer to a pointer. That is the entire explanation, and it is the same principle as exchanging two integers, one level up."),
 H("The typeless data field"),
 P("The data field is a typeless pointer so a list can hold anything at all. To use it as something concrete you convert it, and the brief tells you what it really contains."),
 H("The operations, and what each really costs"),
 TB(["Operation","Shape"],[["size","walk to the end, counting"],["last","walk to the element whose next is NULL"],["push front","allocate, point the new one at the old head, update the head"],["push back","walk to the end, then attach"],["clear","walk, saving next before releasing the current"],["reverse","re-point each next backwards, keeping three pointers"]]),
 W("<b>Releasing an element destroys its next pointer.</b> Any function that frees while walking must save the next address <i>before</i> the release, or it loses the rest of the list."),
 I("Sorting a list means exchanging the <b>data</b> pointers rather than relinking nodes. It is far shorter, easier to defend, and no less correct.")],
quiz:[
 Q("Why does a removal function take a pointer to a pointer?",["Convention","Because removing the first element changes the head, which lives in the caller","Because lists are doubly linked","Because free needs it","For speed"],1,"To change the caller's pointer you need its address.","Whenever you see one more asterisk than expected, ask what this function might need to change in its caller. The answer explains it every time."),
 Q("Where must the advance sit in a traversal loop?",["First","Last, after using the current element","Anywhere","Outside the loop","In the condition"],1,"Advancing first skips the first element and eventually dereferences NULL.","It is the same ordering trap as putting an index increment before the work in a string loop. The body reads, then moves."),
 Q("Why is the data field typeless?",["To save space","So the list can hold any kind of value","Because of the typedef","To allow NULL","It is not"],1,"A typeless pointer can refer to anything.","The brief tells you what it really contains, and you convert it at the point of use. This is how one list implementation serves every exercise in the module."),
 Q("What must happen before releasing an element while walking?",["Nothing","Save its next address first","Set its data to NULL","Count the list","Reverse it"],1,"Releasing destroys the link you still need.","The pattern is always the same: keep a temporary holding the next address, release the current, then move to the temporary."),
 Q("Inside the struct definition, why is the long form used for the next field?",["Style","Because the short type name does not exist yet at that point","Pointers require it","The Norm requires it","It does not"],1,"The typedef name is only established once the definition closes.","This is why a self-referencing field always looks more verbose than the rest of your code. It is a consequence of the order the compiler reads the file.")],
debug:[
 D("while (lst != NULL)\n{\n\tlst = lst->next;\n\tuse(lst->data);\n}","Two things go wrong here. Which?",["Only the first element is skipped","Only NULL is dereferenced","The first element is skipped and NULL is dereferenced at the end","The condition is wrong","Nothing"],2,"Advancing before using skips the head, and after the last advance the pointer is NULL.","Both faults come from a single misplaced line. Moving the advance to the end of the body fixes them together."),
 D("while (lst->next != NULL)\n\tlst = lst->next;\nreturn (lst);","Finding the last element. When does this crash?",["Never","When the list is empty","When the list has one element","When data is NULL","When it is sorted"],1,"An empty list is a NULL pointer, and the condition dereferences it immediately.","Any function receiving a list must decide what an empty list means before touching a field. Usually the brief says to return NULL."),
 D("while (lst != NULL)\n{\n\tfree(lst);\n\tlst = lst->next;\n}","Clearing a list. What is wrong?",["free is misplaced","The next address is read after the element was released","It should free the data too","The condition is wrong","Nothing"],1,"Reading through a released pointer is undefined, and the rest of the list is lost.","Save the next address into a temporary before releasing, then continue from the temporary. It usually still appears to work, which is what makes it dangerous."),
 D("void\tpush_front(t_list *begin, t_list *new)\n{\n\tnew->next = begin;\n\tbegin = new;\n}","The caller's list is unchanged. Why?",["The links are wrong","The head is a copy, so reassigning it changes nothing outside","new must be allocated","It needs a return","Nothing"],1,"The parameter is a copy of the caller's pointer.","Changing which element is the head requires the address of the caller's pointer — the parameter must carry an extra level of indirection."),
 D("t_list\t*tmp;\n\nwhile (lst != NULL)\n{\n\ttmp = lst->next;\n\tlst->next = prev;\n\tprev = lst;\n\tlst = tmp;\n}","Reversing a list. What is missing before the loop?",["Nothing","The previous pointer is never initialised","tmp must be allocated","The condition is wrong","A return"],1,"The first element must end up pointing at NULL, which only happens if the previous pointer starts there.","Left uninitialised it holds garbage, and the old head ends up pointing at nonsense — producing a list that walks off into memory.")],
practice:[
 R("Write the <code>t_list</code> definition exactly as the briefs give it.","A typedef around a struct with two fields.","typedef struct\ts_list\n{\n\tstruct s_list\t*next;\n\tvoid\t\t\t*data;\n}\t\t\t\tt_list;",["typedef struct with a tag","Long form on the self-referencing field","Data field is typeless","Short name before the semicolon"],"You will type this at the top of a dozen files. Make it automatic now."),
 R("Write the three lines of a traversal: condition, use of the current element, and advance.","The sentinel here is NULL.","while (lst != NULL)\n{\n\tuse(lst->data);\n\tlst = lst->next;\n}",["Compares against NULL","Arrow notation, not the dot","Advance assigns next back into the pointer","Advance is the last statement"],"Exactly the string loop, with two substitutions. Nothing else about it is new."),
 R("Write the safe release loop that clears a list without losing the rest of it.","One temporary, saved at the right moment.","while (lst != NULL)\n{\n\ttmp = lst->next;\n\tfree(lst);\n\tlst = tmp;\n}",["Next saved before the release","Release happens after the save","Continues from the temporary"],"The order of those three lines is the whole exercise. Any other order loses the list or reads freed memory."),
 R("Write the two lines that attach a new element at the front, given a pointer to the caller's head pointer.","One extra level of indirection throughout.","(*begin)->next is not needed here;\n// new element points at the old head, then the head becomes the new element",["Recognise that the parameter is a pointer to a pointer","New element points at the current head first","Head updated afterwards"],"Order matters: update the head first and you lose the address of the old one.")],
assign:[
 S("C12","ft_create_elem","t_list *ft_create_elem(void *data);","malloc","Allocate one element holding the given data, with its next pointer set to NULL.","Setting next to NULL is not optional — every other function depends on the sentinel being there."),
 S("C12","ft_list_push_front","void ft_list_push_front(t_list **begin_list, void *data);","malloc","Create an element and place it at the front of the list.","The double pointer exists because the head changes. Update the links before updating the head."),
 S("C12","ft_list_size","int ft_list_size(t_list *begin_list);","None","Count the elements of the list.","An empty list has a defined answer. Walking with the pointer means you lose the head, which is fine here."),
 S("C12","ft_list_last","t_list *ft_list_last(t_list *begin_list);","None","Return the last element.","An empty list must not be dereferenced. Decide that case before writing the loop."),
 S("C12","ft_list_push_back","void ft_list_push_back(t_list **begin_list, void *data);","malloc","Create an element and attach it at the end.","An empty list is the special case: there is no last element to attach to, so the head itself changes."),
 S("C12","ft_list_push_strs","t_list *ft_list_push_strs(int size, char **strs);","malloc","Build a list from an array of strings.","Order matters and is stated in the brief. Building front to back and back to front give different results."),
 S("C12","ft_list_clear","void ft_list_clear(t_list **begin_list, void (*free_fct)(void *));","free","Release every element, using the supplied function on the data.","Save the next address before releasing, and leave the caller's head pointing at NULL."),
 S("C12","ft_list_at","t_list *ft_list_at(t_list *begin_list, unsigned int nbr);","None","Return the element at a given position.","Counting starts where the brief says. A position beyond the end has a defined result."),
 S("C12","ft_list_reverse","void ft_list_reverse(t_list **begin_list);","None","Reverse the order of the list in place.","Three pointers: previous, current, next. The previous one must start at NULL."),
 S("C12","ft_list_foreach","void ft_list_foreach(t_list *begin_list, void (*f)(void *));","None","Apply a function to the data of every element.","Traversal plus a function pointer, both of which you have already met separately."),
 S("C12","ft_list_foreach_if","void ft_list_foreach_if(t_list *begin_list, void (*f)(void *), void *data_ref, int (*cmp)());","None","Apply the function only to elements matching a reference.","Read what the comparison's return value means before writing the condition."),
 S("C12","ft_list_find","t_list *ft_list_find(t_list *begin_list, void *data_ref, int (*cmp)());","None","Return the first element matching the reference.","Same comparison convention question as the previous exercise."),
 S("C12","ft_list_remove_if","void ft_list_remove_if(t_list **begin_list, void *data_ref, void (*free_fct)(void *), int (*cmp)());","free","Remove every matching element, releasing it properly.","Removing the head changes the caller's pointer, and removing while walking needs the next address saved first."),
 S("C12","ft_list_merge","void ft_list_merge(t_list **begin_list1, t_list *begin_list2);","None","Attach the second list to the end of the first without allocating.","An empty first list is the special case, because then the head itself changes."),
 S("C12","ft_list_sort","void ft_list_sort(t_list **begin_list, int (*cmp)());","None","Sort the list using the supplied comparison.","Exchanging the data pointers is far simpler than relinking, and equally correct."),
 S("C12","ft_list_reverse_fun","void ft_list_reverse_fun(t_list *begin_list);","None","Reverse the list without changing which element is the head.","Since the head must stay put, this one moves data rather than links."),
 S("C12","ft_sorted_list_insert","void ft_sorted_list_insert(t_list **begin_list, void *data, int (*cmp)());","malloc","Insert into an already sorted list, keeping it sorted.","Inserting before the first element changes the head, which is why the double pointer is there."),
 S("C12","ft_sorted_list_merge","void ft_sorted_list_merge(t_list **begin_list1, t_list *begin_list2, int (*cmp)());","None","Merge two sorted lists into one sorted list.","Reuse the insertion from the previous exercise rather than writing new logic.")],
chall:[
 X("ft_list_size","Count the elements of a list.","P11","The same walking pattern with a different sentinel. An empty list has a defined answer."),
 X("ft_list_foreach","Apply a supplied function to every element's data.","P11","Traversal plus a function pointer. The advance goes last."),
 X("ft_list_remove_if","Remove every element matching a reference, releasing it.","P11","Two hard parts at once: the head may change, and freeing while walking destroys the link you need."),

{id:"trees",grp:"Structures & core",tit:"Binary trees",
lead:"A list branches in two. Everything you know about traversal still applies — but now each step has two directions, and recursion becomes the natural tool rather than a clever alternative.",
theory:[
 C("typedef struct\ts_btree\n{\n\tstruct s_btree\t*left;\n\tstruct s_btree\t*right;\n\tvoid\t\t\t*item;\n}\t\t\t\tt_btree;"),
 A("            (m)\n           /   \\\n        (f)     (t)\n        / \\     / \\\n     (b) (h) (p) (z)"),
 P("A node holds an item and two children, either of which may be absent. An empty tree is simply a NULL pointer, which makes it the natural base case for every function you write here."),
 H("Three orders, one shape"),
 TB(["Order","When the node is visited"],[["prefix","before both children"],["infix","between the left child and the right"],["suffix","after both children"]]),
 K("The three functions differ by <b>one line's position</b>. Write one carefully and the other two are a copy with the visit moved. That is not laziness — it is the actual lesson."),
 P("Infix order on a search tree produces the items in sorted order, which is the whole reason that arrangement exists."),
 H("The search tree property"),
 P("Everything in a node's left subtree sorts before it; everything in the right sorts after. Insertion follows that rule down until it finds an absent child, and that is where the new node goes."),
 W("<b>The empty-tree case is not an edge case, it is the base case.</b> Every function here begins by asking whether the pointer is NULL and returning immediately. Forget it and the recursion dereferences nothing."),
 H("Level by level"),
 P("Visiting a tree level by level cannot be done with plain recursion down a branch, because the order crosses branches. Either use a queue, or repeatedly walk the tree asking only for nodes at a given depth — the second is slower and far easier to write."),
 I("Counting levels is the same recursion with a maximum: the depth of a tree is one more than the deeper of its two subtrees, and an empty tree has none.")],
quiz:[
 Q("What is the natural base case for a tree function?",["A leaf","A NULL pointer, meaning an empty tree","The root","A node with one child","There is none"],1,"An empty tree is simply a NULL pointer.","Every function here starts by checking it and returning. Skipping the check means the first recursive call into an absent child dereferences nothing."),
 Q("What separates prefix, infix and suffix traversal?",["Three different algorithms","Where the visit sits relative to the two recursive calls","The direction of travel","The data structure","Nothing"],1,"One line moves; everything else is identical.","Writing the first one carefully and then producing the other two by moving the visit is the intended path through this module."),
 Q("Why does infix order matter on a search tree?",["It is fastest","It produces the items in sorted order","It uses less stack","It handles duplicates","It does not"],1,"The arrangement guarantees left sorts before the node and right sorts after.","That property is the entire reason to maintain a search tree rather than a plain one, and it makes infix traversal effectively a free sort."),
 Q("How deep is a tree?",["The number of nodes","One more than the deeper of its two subtrees","The number of leaves","Always two","Undefined"],1,"And an empty tree has none, which is the base case.","This is the same recursion as traversal with a maximum taken at each step, which is why it usually fits in four lines."),
 Q("Why can level-by-level order not be done with plain downward recursion?",["It can","Because the order crosses between branches at each level","Because of NULL","Because trees are unsorted","Because of the stack"],1,"Recursion naturally finishes one branch before starting another.","Either a queue is used, or the tree is walked repeatedly asking only for a given depth. The second is far slower and much easier to defend.")],
debug:[
 D("void\tapply_prefix(t_btree *root, void (*f)(void *))\n{\n\tf(root->item);\n\tapply_prefix(root->left, f);\n\tapply_prefix(root->right, f);\n}","This crashes on every tree. Why?",["The order is wrong","There is no base case, so it dereferences an absent child","f is called wrongly","It needs a return","Nothing"],1,"The first recursive call into a missing child dereferences NULL.","One guard at the top returning immediately fixes every function in this module. It is the base case, not an optimisation."),

{id:"stacks",grp:"Structures & core",tit:"Stacks, parsers & libft",
lead:"The last two ideas of the piscine, and the bridge out of it: a structure that remembers order, and a library of your own that turns everything you wrote into a tool.",
theory:[
 H("A stack is a pile of plates"),
 P("Last in, first out. Two operations: put something on top, and take the top off. An array plus an index marking the next free slot is a complete implementation."),
 C("st[top] = value;\ntop++;\n\ntop--;\nvalue = st[top];"),
 W("<b>The order within each operation is fixed.</b> Push writes then increments; pop decrements then reads. Reverse either and you overwrite the top or read an empty slot."),
 H("Why parsers need one"),
 P("Checking that brackets are balanced looks like counting — and with a single kind of bracket, a counter genuinely suffices: it rises on an opening, falls on a closing, and must never go negative."),
 K("With <b>several</b> kinds it breaks, because a counter stores no order. A crossed sequence would satisfy every counter and still be wrong. You need to know which bracket opened most recently, and that is exactly what a stack remembers."),
 P("Reverse polish evaluation uses the same structure from the other side: numbers are pushed, and an operator takes the top two, computes, and pushes the result back. When the input ends, exactly one value should remain — and if it does not, the expression was malformed."),
 H("Turning your work into a library"),
 P("A library is an archive of compiled objects plus a header declaring them. Instead of recompiling every source file, you compile once, archive, and link the archive."),
 TB(["Piece","Role"],[["the header","declares every prototype, behind include guards"],["the archive","holds the compiled objects together"],["the build file","describes what depends on what"]]),
 P("The build file's core idea is dependency: a target, the files it needs, and the command to produce it. It rebuilds only what changed, which is why it exists at all."),
 W("Standard targets are expected: build everything, remove intermediate files, remove those and the result, and rebuild from scratch. A missing one costs marks even when the code is perfect."),
 I("Declaring targets that do not produce a file of the same name prevents a stray file with that name from silently stopping the build. It is a one-line safeguard that saves a confusing afternoon.")],
quiz:[
 Q("Which order is correct for pushing onto a stack?",["Increment, then write","Write, then increment","Either","Decrement, then write","Write, then decrement"],1,"The index marks the next free slot, so you write there and then move it on.","Pop is the mirror: decrement first, then read. Getting either backwards overwrites the top or reads a slot that was never filled."),
 Q("When is a counter enough to check balanced brackets?",["Always","Never","Only with a single kind of bracket","Only with nested ones","Only with two kinds"],2,"A counter records how many are open, not which.","With several kinds a crossed sequence passes every counter and is still wrong. You need the most recently opened one, which is what a stack gives you."),
 Q("In reverse polish evaluation, what should remain when the input ends?",["Nothing","Exactly one value","Two values","One per operator","It varies"],1,"A well-formed expression collapses to a single result.","Anything else means the expression was malformed, which is how these exercises detect bad input without a separate validation pass."),
 Q("What is a library, in this context?",["A folder of source files","An archive of compiled objects plus a header declaring them","A single large source file","A build file","A header alone"],1,"Compiled once, then linked wherever needed.","Without the header, callers have no prototypes and the compiler cannot check the calls. Both halves are required."),
 Q("Why declare targets that produce no file of that name?",["Speed","So a stray file with that name cannot stop the build","To allow parallel builds","The Norm requires it","It has no effect"],1,"Otherwise the build tool sees an up-to-date file and does nothing.","A file called clean sitting in your folder would silently break the clean target. One declaration line prevents a genuinely baffling afternoon.")],
debug:[
 D("top--;\nst[top] = value;","Pushing onto a stack. What is wrong?",["Nothing","It decrements instead of incrementing, and writes to the wrong slot","The value should be a pointer","top must start at one","It needs a bound check"],1,"Push moves the top upward, not down.","As written it walks backwards through the array and eventually below it. Pop is the operation that decrements — and it does so before reading, not after."),
 D("count = 0;\nwhile (str[i] != '\\0')\n{\n\tif (str[i] == '(')\n\t\tcount++;\n\tif (str[i] == ')')\n\t\tcount--;\n\ti++;\n}\nif (count == 0)\n\treturn (1);","Checking one kind of bracket. What case does this accept wrongly?",["None","A closing bracket before any opening one","Nested brackets","An empty string","Too many openings"],1,"A sequence that closes first and opens later ends at zero and is still invalid.","The counter must also never fall below zero at any point. Checking only the final value misses every case that dips negative and recovers."),
 D("if (str[i] == ')' && st[top] == '(')\n\ttop--;","Popping on a closing bracket. What is missing?",["The push","A check that the stack is not empty before reading the top","The comparison","The index step","Nothing"],1,"With nothing on the stack, reading the top reads a slot that was never written.","An empty stack at a closing bracket also means the expression is already invalid, so the check serves twice: it protects the read and detects the error."),
 D("while (i < argc)\n{\n\tpush(atoi(argv[i]));\n\ti++;\n}\nresult = pop();","Evaluating an expression by pushing everything first. Why is this wrong?",["atoi is forbidden","Operators must act as they are encountered, not after everything is pushed","The index starts wrong","pop needs an argument","Nothing"],1,"The structure only works if each operator consumes its operands at the moment it appears.","Pushing everything loses the interleaving that gives the notation its meaning. Numbers push; operators immediately take two and push one back."),
 D("all: $(NAME)\n\nclean:\n\trm -f $(OBJS)","A build file fragment. What is missing for a complete set of targets?",["Nothing","The full-clean and rebuild targets, and the declaration of non-file targets","The compiler flags","The header","The archive step"],1,"Four standard targets are expected, plus the declaration that they produce no files.","Missing targets cost marks even when the code itself is flawless, because the evaluation script calls them by name.")],

/* ---------- syntax highlighting ---------- */
const RE=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#\s*\w+)|\b(int|char|void|unsigned|signed|long|short|struct|typedef|size_t|const|static|float|double|t_list|t_btree|t_point)\b|\b(if|else|while|return|break|continue|sizeof|NULL)\b|\b(\d+)\b|([{}()\[\];,])/g;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(t){let o="",u=0,m;RE.lastIndex=0;
 while((m=RE.exec(t))!==null){if(m.index>u)o+=esc(t.slice(u,m.index));
  const k=m[1]?"k1":m[2]?"k2":m[3]?"k4":m[4]?"k3":m[5]?"k4":m[6]?"k5":"k6";
  o+='<span class="'+k+'">'+esc(m[0])+'</span>';u=m.index+m[0].length;}
 if(u<t.length)o+=esc(t.slice(u));return o;}
const cb=c=>'<div class="cod">'+String(c).split("\n").map((l,i)=>
 '<div class="l"><span class="n">'+(i+1)+'</span><pre>'+hl(l||" ")+'</pre></div>').join("")+'</div>';

/* ---------- ids, storage ---------- */
CATS.forEach(c=>{
  c.quiz.forEach((q,i)=>q.id=c.id+"-q"+i);
  c.debug.forEach((d,i)=>d.id=c.id+"-d"+i);
  c.practice.forEach((p,i)=>p.id=c.id+"-p"+i);
  c.assign.forEach((a,i)=>a.id=c.id+"-a"+i);
  c.chall.forEach((x,i)=>x.id=c.id+"-x"+i);
  c.total=c.quiz.length+c.debug.length+c.practice.length;
});
const KEY="c42-atlas";
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
 return mem||{res:{},drafts:{},done:{}};}
let DB2=load(); DB2.res=DB2.res||{}; DB2.drafts=DB2.drafts||{}; DB2.done=DB2.done||{};
function save(){mem=DB2;try{localStorage.setItem(KEY,JSON.stringify(DB2));}catch(e){}}

/* ---------- state ---------- */
const TABS=[["theory","Theory"],["quiz","Quiz"],["debug","Debug"],["practice","Practice"],["assign","Assignments"],["chall","Challenge"]];
const GRPS=[];
CATS.forEach(c=>{if(GRPS.indexOf(c.grp)<0)GRPS.push(c.grp);});
const gi=c=>GRPS.indexOf(c.grp);
let cur=0,tab="theory",filter="",pick={},reveal={},shown={},open=false;

const $=id=>document.getElementById(id);
const okCount=c=>[...c.quiz,...c.debug,...c.practice].filter(x=>DB2.res[x.id]==="ok").length;
const grandTotal=CATS.reduce((a,c)=>a+c.total,0);
const grandOk=()=>CATS.reduce((a,c)=>a+okCount(c),0);

/* ---------- rail ---------- */
function paintNav(){
  const f=filter.trim().toLowerCase();
  let h="",lastGrp="";
  CATS.forEach((c,i)=>{
    if(f && !(c.tit+" "+c.lead+" "+c.grp).toLowerCase().includes(f))return;
    if(c.grp!==lastGrp){h+='<div class="ph" data-g="'+gi(c)+'">'+c.grp+'</div>';lastGrp=c.grp;}
    const n=okCount(c),p=c.total?Math.round(n/c.total*100):0;
    h+='<button class="ci'+(i===cur?" on":"")+'" data-g="'+gi(c)+'" data-go="'+i+'">'
      +'<span class="row"><span style="flex:1;min-width:0">'+c.tit+'</span>'
      +'<span class="pct">'+p+'%</span></span>'
      +'<span class="trk"><i class="'+(p===100?"full":"")+'" style="width:'+p+'%"></i></span></button>';
  });
  if(!h)h='<div style="padding:18px 16px;color:var(--tx3);font-size:12.5px">Nothing found.</div>';
  $("nav").innerHTML=h;
  $("tally").textContent=grandOk()+" / "+grandTotal+" solved";
  $("tallyM").textContent=grandOk()+"/"+grandTotal;
}

/* ---------- blocks ---------- */
function blk(b){
  if(b.t==="p")return '<div class="blk"><p>'+b.x+'</p></div>';
  if(b.t==="h")return '<div class="blk"><h3>'+b.x+'</h3></div>';
  if(b.t==="c")return '<div class="blk">'+cb(b.x)+'</div>';
  if(b.t==="a")return '<div class="blk"><pre class="art">'+esc(b.x)+'</pre></div>';
  if(b.t==="x")return '<div class="blk"><div class="cx '+b.k+'">'+b.x+'</div></div>';
  if(b.t==="tb")return '<div class="blk tw"><table><thead><tr>'
    +b.h.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'
    +b.r.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
  return "";
}
function opts(item,chosen){
  return item.o.map((o,i)=>{
    let k="";
    if(chosen!==undefined)k=i===item.c?"ok":(i===chosen?"no":"dim");
    return '<button class="op '+k+'" data-op="'+i+'" data-qid="'+item.id+'"'+(chosen!==undefined?" disabled":"")+'>'+esc(o)+'</button>';
  }).join("");
}
function why(item,chosen){
  if(chosen===undefined)return"";
  return '<div class="cx '+(chosen===item.c?"k":"w")+'" style="margin-top:12px">'+item.why+'</div>'
    +'<div class="cx i" style="margin-top:10px"><b>Going deeper.</b> '+item.more+'</div>';
}
/* ---------- panes ---------- */
function paneTheory(c){return c.theory.map(blk).join("");}

function paneQuiz(c){
  return c.quiz.map((q,n)=>{
    const ch=pick[q.id];
    return '<div class="card"><div class="eyebrow">Question '+(n+1)+' of '+c.quiz.length+'</div>'
      +'<p class="qn" style="margin-top:8px">'+esc(q.q)+'</p>'+opts(q,ch)+why(q,ch)+'</div>';
  }).join("");
}

function paneDebug(c){
  return c.debug.map((d,n)=>{
    const ch=pick[d.id], sh=shown[d.id];
    let h='<div class="card"><div class="eyebrow">Broken code '+(n+1)+' of '+c.debug.length+'</div>'
      +'<div style="margin-top:10px">'+cb(d.code)+'</div>'
      +'<p class="qn" style="margin:14px 0 0">'+esc(d.q)+'</p>';
    if(!sh){
      h+='<p style="margin-top:8px;font-size:13px;color:var(--tx2);line-height:1.6">Work it out first. Reveal the options only once you have an answer in your head.</p>'
        +'<div class="bts"><button class="btn g" data-show="'+d.id+'">Reveal options</button></div>';
    }else{
      h+='<div style="margin-top:12px">'+opts(d,ch)+'</div>'+why(d,ch);
    }
    return h+'</div>';
  }).join("");
}

function panePractice(c){
  return c.practice.map((p,n)=>{
    const rv=reveal[p.id];
    let h='<div class="card"><div class="eyebrow">Exercise '+(n+1)+' of '+c.practice.length+'</div>'
      +'<p class="qn" style="margin:8px 0 6px">'+p.task+'</p>'
      +'<p style="font-size:13px;color:var(--tx2);line-height:1.6">'+p.hint+'</p>'
      +'<div class="ed"><div class="gut" id="g-'+p.id+'"></div><div class="edw">'
      +'<pre id="v-'+p.id+'"></pre>'
      +'<textarea data-k="'+p.id+'" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>'
      +'</div></div>';
    if(!rv){
      h+='<div class="bts"><button class="btn g" data-rev="'+p.id+'">Show reference</button></div>';
    }else{
      h+='<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px">Reference</div>'+cb(p.ref)+'</div>'
        +'<div class="chk"><div class="eyebrow">Check yours, line by line</div><ul>'
        +p.check.map(x=>'<li><i>&#9633;</i><span>'+x+'</span></li>').join("")+'</ul></div>'
        +'<div class="cx i" style="margin-top:12px">'+p.note+'</div>'
        +'<div class="bts"><button class="btn" data-mark="'+p.id+'" data-ok="1">Mine matched</button>'
        +'<button class="btn n" data-mark="'+p.id+'" data-ok="0">Missed some</button>'
        +'<button class="btn n" data-hide="'+p.id+'">Hide and retry</button></div>';
    }
    return h+'</div>';
  }).join("");
}

function paneList(c,key){
  const arr=c[key];
  if(!arr.length)return '<div class="card"><p style="color:var(--tx2);font-size:14px;line-height:1.7">Nothing in this category draws on '+(key==="assign"?"a submitted assignment":"an extra challenge")+' directly. The theory here supports other categories rather than standing alone.</p></div>';
  return arr.map(a=>{
    const on=DB2.done[a.id];
    let body;
    if(key==="assign"){
      body='<div class="exb"><div style="margin-top:12px">'+(a.proto&&a.proto!=="—"?cb(a.proto):'<p style="color:var(--tx3);font-size:13px">No prototype — this is a program or a header.</p>')+'</div>'
        +'<p style="margin-top:12px;font-size:14.3px;line-height:1.7">'+a.brief+'</p>'
        +'<div class="cx i" style="margin-top:12px"><b>Watch for.</b> '+a.trap+'</div>'
        +'<div style="margin-top:12px"><span class="tag a">'+a.mod+'</span> <span class="tag">allowed: '+(a.allowed||"see brief")+'</span></div></div>';
    }else{
      body='<div class="exb"><p style="margin-top:12px;font-size:14.3px;line-height:1.7">'+a.brief+'</p>'
        +'<div class="cx i" style="margin-top:12px"><b>Watch for.</b> '+a.trap+'</div>'
        +(a.pats&&a.pats!=="—"?'<div style="margin-top:12px"><span class="tag p">'+a.pats+'</span></div>':"")+'</div>';
    }
    return '<div class="ex"><button class="exh" data-done="'+a.id+'">'
      +'<span class="mark'+(on?" on":"")+'">&#10003;</span>'
      +'<span class="nm">'+a.name+'</span>'
      +'<span class="mt">'+(on?"done":"")+'</span></button>'+body+'</div>';
  }).join("");
}

/* ---------- render ---------- */
function render(){
  const c=CATS[cur];
  document.querySelector(".main").setAttribute("data-g",gi(c));
  $("head").innerHTML='<div class="kicker">'+c.grp+' · '+(cur+1)+' of '+CATS.length+'</div>'
    +'<h1>'+c.tit+'</h1><p class="lead">'+c.lead+'</p>'
    +'<div class="tabs">'+TABS.map(t=>{
      const n=Array.isArray(c[t[0]])?c[t[0]].length:0;
      const badge=t[0]==="theory"?"":'<b>'+n+'</b>';
      return '<button class="tb'+(tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+t[1]+badge+'</button>';
    }).join("")+'</div>';
  let body;
  if(tab==="theory")body=paneTheory(c);
  else if(tab==="quiz")body=paneQuiz(c);
  else if(tab==="debug")body=paneDebug(c);
  else if(tab==="practice")body=panePractice(c);
  else body=paneList(c,tab);
  $("pane").innerHTML=body
    +'<div class="bts" style="margin-top:34px;padding-top:20px;border-top:1px solid var(--line)">'
    +(cur>0?'<button class="btn n" data-go="'+(cur-1)+'">&larr; '+CATS[cur-1].tit+'</button>':"")
    +(cur<CATS.length-1?'<button class="btn g" data-go="'+(cur+1)+'">'+CATS[cur+1].tit+' &rarr;</button>':"")
    +'</div>';
  wireEditors();
  paintNav();
  $("scroll").scrollTop=0;
}

function wireEditors(){
  document.querySelectorAll("[data-k]").forEach(ta=>{
    const k=ta.dataset.k, pv=$("v-"+k), g=$("g-"+k);
    if(!pv||!g)return;
    ta.value=DB2.drafts[k]||"";
    const paint=()=>{
      const v=ta.value;
      pv.innerHTML=v?hl(v)+"\n":'<span class="gh">Write here. Tab indents, Enter keeps the indentation.</span>';
      const n=Math.max(v.split("\n").length,9);
      let s="";for(let i=1;i<=n;i++)s+="<div>"+i+"</div>";
      g.innerHTML=s;
    };
    paint();
    ta.addEventListener("input",()=>{DB2.drafts[k]=ta.value;save();paint();});
    ta.addEventListener("scroll",()=>{pv.scrollTop=ta.scrollTop;pv.scrollLeft=ta.scrollLeft;g.scrollTop=ta.scrollTop;});
    ta.addEventListener("keydown",e=>{
      const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
      if(e.key==="Tab"){
        e.preventDefault();
        ta.value=v.slice(0,s)+"\t"+v.slice(en);
        ta.selectionStart=ta.selectionEnd=s+1;
        DB2.drafts[k]=ta.value;save();paint();
      }else if(e.key==="Enter"){
        e.preventDefault();
        const ls=v.lastIndexOf("\n",s-1)+1, line=v.slice(ls,s);
        const ind=(line.match(/^[\t ]*/)||[""])[0];
        const extra=line.replace(/\s+$/,"").endsWith("{")?"\t":"";
        const ins="\n"+ind+extra;
        ta.value=v.slice(0,s)+ins+v.slice(en);
        ta.selectionStart=ta.selectionEnd=s+ins.length;
        DB2.drafts[k]=ta.value;save();paint();
      }
    });
  });
}
/* ---------- export ---------- */
function exportNotes(){
  let md="# My C42 Atlas notes\n\n",n=0;
  CATS.forEach(c=>{
    const mine=c.practice.filter(p=>(DB2.drafts[p.id]||"").trim());
    const done=[...c.assign,...c.chall].filter(a=>DB2.done[a.id]);
    if(!mine.length&&!done.length)return;
    md+="## "+c.tit+"\n\n";
    mine.forEach(p=>{md+="**"+p.task.replace(/<[^>]+>/g,"")+"**\n\n```c\n"+DB2.drafts[p.id].trim()+"\n```\n\n";n++;});
    if(done.length){md+="Marked done: "+done.map(a=>"`"+a.name+"`").join(", ")+"\n\n";n++;}
  });
  if(!n){alert("Nothing saved yet. Write in a practice editor, or tick an exercise as done.");return;}
  const b=new Blob([md],{type:"text/markdown"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="c42-atlas-notes.md";a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- events ---------- */
function closeRail(){open=false;$("rail").classList.remove("open");$("bd").classList.remove("on");}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-tab],[data-a],[data-op],[data-show],[data-rev],[data-hide],[data-mark],[data-done]");
  if(!t){if(open&&!e.target.closest(".rail"))closeRail();return;}
  if(t.hasAttribute("data-go")){cur=+t.dataset.go;tab="theory";pick={};reveal={};shown={};closeRail();render();return;}
  if(t.hasAttribute("data-tab")){tab=t.dataset.tab;render();return;}
  const a=t.dataset.a;
  if(a==="menu"){open=!open;$("rail").classList.toggle("open",open);$("bd").classList.toggle("on",open);return;}
  if(a==="export"){exportNotes();return;}
  if(a==="wipe"){DB2={res:{},drafts:{},done:{}};save();pick={};reveal={};shown={};render();return;}
  if(t.hasAttribute("data-show")){shown[t.dataset.show]=true;render();return;}
  if(t.hasAttribute("data-rev")){reveal[t.dataset.rev]=true;render();return;}
  if(t.hasAttribute("data-hide")){reveal[t.dataset.hide]=false;render();return;}
  if(t.hasAttribute("data-mark")){
    DB2.res[t.dataset.mark]=t.dataset.ok==="1"?"ok":"no";save();
    reveal[t.dataset.mark]=false;render();return;}
  if(t.hasAttribute("data-done")){
    const id=t.dataset.done;
    DB2.done[id]=!DB2.done[id];save();render();return;}
  if(t.hasAttribute("data-op")){
    const qid=t.dataset.qid;
    if(pick[qid]!==undefined)return;
    const c=CATS[cur];
    const item=[...c.quiz,...c.debug].find(x=>x.id===qid);
    if(!item)return;
    pick[qid]=+t.dataset.op;
    DB2.res[qid]=(pick[qid]===item.c)?"ok":"no";save();
    render();
  }
});
$("find").addEventListener("input",()=>{filter=$("find").value;paintNav();});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"&&cur<CATS.length-1){cur++;tab="theory";pick={};reveal={};shown={};render();}
  if(e.key==="ArrowLeft"&&cur>0){cur--;tab="theory";pick={};reveal={};shown={};render();}
});

render();
</script>
