<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C42 Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces */
  --bg:#F4EFE2; --panel:#FFFCF4; --sunk:#FAF5E8; --code:#FBF7EA;
  /* ink */
  --tx:#241F18; --tx2:#5E574B; --tx3:#8E8677;
  /* structure */
  --edge:#241F18; --line:#E0D6C2; --line2:#EDE5D5;
  /* semantic */
  --ok:#2F7F62; --ok-bg:#DFF0E8; --bad:#C2553E; --bad-bg:#FAE2DB;
  --warn:#B5851C; --warn-bg:#FAEFD3;
  /* group accents */
  --g0:#E0A82E; --g0s:#FAECC8;
  --g1:#D4657F; --g1s:#F9DDE4;
  --g2:#3E9E80; --g2s:#D8EFE6;
  --g3:#7C6BC4; --g3s:#E3DEF6;
  --g4:#D4703F; --g4s:#F9E2D3;
  --acc:var(--g0); --accs:var(--g0s);
  /* code tokens */
  --t-com:#9A9081; --t-str:#2F7A5A; --t-typ:#2A6FA8;
  --t-key:#8E4EA8; --t-num:#B5651D; --t-pun:#6E675C;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Atkinson Hyperlegible','Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  --rail:280px;
}
[data-g="0"]{--acc:var(--g0);--accs:var(--g0s)}
[data-g="1"]{--acc:var(--g1);--accs:var(--g1s)}
[data-g="2"]{--acc:var(--g2);--accs:var(--g2s)}
[data-g="3"]{--acc:var(--g3);--accs:var(--g3s)}
[data-g="4"]{--acc:var(--g4);--accs:var(--g4s)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
p{margin:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#DCD2BE;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#C8BCA3}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--panel);
  border-right:2px solid var(--edge);display:flex;flex-direction:column;z-index:40}
.rtop{padding:20px 18px 14px;border-bottom:2px solid var(--edge)}
.rlist{flex:1;overflow-y:auto;padding:6px 0 30px}
.rfoot{border-top:2px solid var(--edge);padding:12px 18px;display:flex;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.scroll{flex:1;overflow-y:auto}
.col{max-width:720px;margin:0 auto;padding:30px 30px 120px}

/* ---------- brand ---------- */
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15;position:relative;padding-left:32px}
.brand::before{content:"";position:absolute;left:0;top:3px;width:11px;height:11px;
  border-radius:50%;background:var(--g1);box-shadow:15px 0 0 var(--g2)}
.brand em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  letter-spacing:.04em;color:var(--tx3);font-weight:400;margin-top:7px;padding-left:0}
.find{width:100%;margin-top:14px;padding:9px 11px;border:2px solid var(--edge);border-radius:7px;
  background:var(--sunk);font-family:var(--mono);font-size:12.5px;color:var(--tx)}
.find::placeholder{color:var(--tx3)}
.find:focus{outline:none;background:var(--panel);box-shadow:3px 3px 0 var(--line)}

/* ---------- rail list ---------- */
.ph{padding:18px 18px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx2);font-weight:500;display:flex;align-items:center;gap:8px}
.ph::before{content:"";width:12px;height:12px;border:2px solid var(--edge);border-radius:4px;background:var(--acc)}
.ci{display:block;width:100%;text-align:left;padding:9px 18px 10px;color:var(--tx2);
  font-size:14px;line-height:1.4;border-left:4px solid transparent}
.ci:hover{background:var(--sunk);color:var(--tx)}
.ci.on{background:var(--accs);border-left-color:var(--acc);color:var(--tx);font-weight:700}
.ci .row{display:flex;align-items:baseline;gap:8px}
.ci .pct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.ci.on .pct{color:var(--tx2)}
.trk{height:5px;background:var(--line2);border:1.5px solid var(--line);border-radius:4px;margin-top:7px;overflow:hidden}
.ci.on .trk{border-color:var(--edge);background:var(--panel)}
.trk i{display:block;height:100%;background:var(--acc);transition:width .35s}
.trk i.full{background:var(--ok)}

/* ---------- header ---------- */
.head{padding:26px 30px 0;background:var(--bg);border-bottom:2px solid var(--edge);flex-shrink:0}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--tx2);
  display:inline-flex;align-items:center;gap:8px;background:var(--accs);
  border:2px solid var(--edge);border-radius:20px;padding:3px 12px}
h1{font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:14px 0 0;max-width:20ch}
.lead{margin:12px 0 20px;font-size:16px;line-height:1.7;color:var(--tx2);max-width:62ch}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tb{padding:9px 15px 8px;font-size:14px;font-weight:700;color:var(--tx2);white-space:nowrap;
  display:flex;align-items:center;gap:7px;border:2px solid var(--edge);border-bottom:0;
  border-radius:9px 9px 0 0;background:var(--sunk);position:relative;top:2px}
.tb:hover{background:var(--panel)}
.tb.on{background:var(--accs);color:var(--tx);top:2px;padding-bottom:10px}
.tb b{font-family:var(--mono);font-size:11px;font-weight:500;padding:1px 6px;border-radius:20px;
  background:var(--panel);border:1.5px solid var(--line);color:var(--tx2)}
.tb.on b{border-color:var(--edge);background:var(--panel)}

/* ---------- reading blocks ---------- */
.blk{margin-top:18px}
.blk p{font-size:16px;line-height:1.8;color:var(--tx);max-width:62ch}
h3{font-size:17px;font-weight:700;margin:34px 0 0;color:var(--tx);
  padding-bottom:7px;border-bottom:2px solid var(--line)}
.art{background:var(--panel);border:2px solid var(--edge);border-radius:9px;padding:16px;
  overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--tx2);
  white-space:pre;margin:0}
.cx{padding:15px 18px;border:2px solid var(--edge);border-radius:9px;font-size:15px;line-height:1.7;
  border-left-width:7px}
.cx.w{border-left-color:var(--bad);background:var(--bad-bg)}
.cx.k{border-left-color:var(--ok);background:var(--ok-bg)}
.cx.i{border-left-color:var(--warn);background:var(--warn-bg)}
.cx b{font-weight:700}
code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:2px 6px;
  border-radius:5px;border:1px solid var(--line);color:var(--tx)}
.cx code{background:rgba(255,255,255,.75);border-color:rgba(36,31,24,.14)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
  border:2px solid var(--edge);border-radius:9px;overflow:hidden}
th,td{text-align:left;padding:11px 14px;font-size:14.5px;line-height:1.6;
  border-bottom:1.5px solid var(--line2);vertical-align:top}
th{background:var(--sunk);font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tx2);font-weight:500;border-bottom:2px solid var(--edge)}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}

/* ---------- code ---------- */
.cod{background:var(--code);border:2px solid var(--edge);border-radius:9px;overflow-x:auto;padding:12px 0}
.cod .l{display:flex}
.cod .n{flex:0 0 36px;text-align:right;padding-right:11px;color:#BFB5A0;font-family:var(--mono);
  font-size:11.5px;line-height:22px;user-select:none}
.cod pre{margin:0;padding:0 16px 0 0;font-family:var(--mono);font-size:13px;line-height:22px;
  tab-size:4;white-space:pre;color:var(--tx)}
.k1{color:var(--t-com);font-style:italic}.k2{color:var(--t-str)}.k3{color:var(--t-typ)}
.k4{color:var(--t-key)}.k5{color:var(--t-num)}.k6{color:var(--t-pun)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:22px;margin-top:18px}
.qn{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:14px;color:var(--tx)}
.op{width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;border:2px solid var(--edge);
  border-radius:9px;background:var(--panel);color:var(--tx);font-family:var(--mono);
  font-size:13px;line-height:1.6;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.op:not(:disabled):hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--acc)}
.op:not(:disabled):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--acc)}
.op.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.op.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.op.dim{opacity:.45;box-shadow:none;background:var(--sunk)}

/* ---------- buttons ---------- */
.btn{padding:10px 17px;border-radius:9px;font-size:14.5px;font-weight:700;
  border:2px solid var(--edge);background:var(--acc);color:var(--tx);
  box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--edge)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.g{background:var(--accs)}
.btn.n{background:var(--panel);color:var(--tx2)}
.bts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-family:var(--mono);
  font-size:11px;letter-spacing:.03em;background:var(--sunk);border:1.5px solid var(--line);color:var(--tx2)}
.tag.a{background:var(--accs);border-color:var(--edge);color:var(--tx)}
.tag.p{background:var(--warn-bg);border-color:var(--warn);color:#7A5A0F}

/* ---------- editor ---------- */
.ed{display:flex;background:var(--code);border:2px solid var(--edge);border-radius:9px;
  overflow:hidden;margin-top:14px;box-shadow:4px 4px 0 var(--line)}
.gut{flex:0 0 40px;background:var(--sunk);border-right:2px solid var(--line);padding:13px 0;overflow:hidden}
.gut div{color:#BFB5A0;font-family:var(--mono);font-size:11.5px;line-height:22px;text-align:right;padding-right:10px}
.edw{position:relative;flex:1;min-height:210px}
.edw pre,.edw textarea{margin:0;border:0;padding:13px 15px;font-family:var(--mono);font-size:13.5px;
  line-height:22px;tab-size:4;white-space:pre;overflow-wrap:normal}
.edw pre{position:absolute;inset:0;overflow:auto;pointer-events:none;color:var(--tx)}
.edw textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;
  color:transparent;caret-color:var(--bad)}
.edw textarea:focus{outline:none}
.gh{color:#B3A991}
.chk{background:var(--sunk);border:2px solid var(--line);border-radius:9px;padding:16px;margin-top:16px}
.chk ul{list-style:none;margin:9px 0 0;padding:0}
.chk li{display:flex;gap:10px;font-size:14.5px;color:var(--tx2);line-height:1.6;margin-bottom:7px}
.chk li i{color:var(--tx3);font-style:normal;font-size:15px;line-height:1.5}

/* ---------- exercise rows ---------- */
.ex{border:2px solid var(--edge);border-radius:11px;background:var(--panel);margin-top:14px;overflow:hidden}
.exh{display:flex;align-items:center;gap:12px;padding:15px 18px;width:100%;text-align:left;
  background:var(--sunk);border-bottom:2px solid var(--edge)}
.exh:hover{background:var(--accs)}
.exh .nm{font-family:var(--mono);font-size:14px;color:var(--tx);font-weight:500}
.exb{padding:2px 18px 18px}
.mark{flex:0 0 20px;height:20px;border:2px solid var(--edge);border-radius:6px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;line-height:1}
.mark.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ok);font-weight:500}

/* ---------- mobile ---------- */
.mtop{display:none;position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:2px solid var(--edge);padding:12px 16px;align-items:center;
  justify-content:space-between;gap:12px}
.bd{display:none}
@media(max-width:940px){
  .mtop{display:flex}
  .rail{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);
    transition:transform .2s;box-shadow:6px 0 0 rgba(36,31,24,.12)}
  .rail.open{transform:translateX(0)}
  .bd.on{display:block;position:fixed;inset:0;z-index:35;background:rgba(36,31,24,.35)}
  .head{padding:18px 18px 0}
  .col{padding:22px 18px 110px}
  h1{font-size:24px}
  .card{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rtop">
      <div class="brand">C42 Atlas<em id="tally"></em></div>
      <input class="find" id="find" placeholder="filter categories..." autocomplete="off">
    </div>
    <div class="rlist" id="nav"></div>
    <div class="rfoot">
      <button class="btn n" data-a="export" style="flex:1">Export notes</button>
      <button class="btn n" data-a="wipe">Reset</button>
    </div>
  </aside>
  <div class="bd" id="bd"></div>
  <main class="main">
    <div class="mtop">
      <button data-a="menu" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Categories</button>
      <span id="tallyM" style="font-family:var(--mono);font-size:10.5px;color:var(--tx3)"></span>
    </div>
    <div class="head" id="head"></div>
    <div class="scroll" id="scroll"><div class="col" id="pane"></div></div>
  </main>
</div>
<script>
/* ============================================================
   C42 ATLAS — every category of the piscine, plus core.
   Six tabs each: theory, quiz, debug, practice, assignments,
   challenge. Briefs and traps only — never a solution.
   ============================================================ */
const P=x=>({t:"p",x}),C=x=>({t:"c",x}),A=x=>({t:"a",x});
const W=x=>({t:"x",k:"w",x}),K=x=>({t:"x",k:"k",x}),I=x=>({t:"x",k:"i",x});
const H=x=>({t:"h",x}),TB=(h,r)=>({t:"tb",h,r});
const Q=(q,o,c,why,more)=>({q,o,c,why,more});
const D=(code,q,o,c,why,more)=>({code,q,o,c,why,more});
const R=(task,hint,ref,check,note)=>({task,hint,ref,check,note});
const S=(mod,name,proto,allowed,brief,trap)=>({mod,name,proto,allowed,brief,trap});
const X=(name,brief,pats,trap)=>({name,brief,pats,trap});

const CATS=[
/* ========== PHASE 1 — FOUNDATION ========== */
{id:"anatomy",grp:"Foundation",tit:"Compiling, the Norm & program anatomy",
lead:"Before any logic there is a contract: the file must compile with three flags and obey a writing standard. Break either and nothing you wrote is even looked at.",
theory:[
 P("A C file is text. The processor reads numbers. The <b>compiler</b> is the translator, and it is unforgiving on purpose — it would rather refuse than guess what you meant."),
 A("  file.c              compiler             a.out\n (your text)   ───►   (cc / gcc)   ───►   (program)"),
 C("cc -Wall -Wextra -Werror file.c -o program\n./program"),
 TB(["Flag","What it does"],[["<code>-Wall</code>","turns on the common warnings"],["<code>-Wextra</code>","adds a second set on top"],["<code>-Werror</code>","turns every warning into an error"],["<code>-o name</code>","names the output, otherwise <code>a.out</code>"]]),
 W("<b>At 42 a file that does not compile with all three scores zero.</b> Not partial credit. And a forbidden function is minus forty-two, with no negotiation."),
 H("The three kinds of error"),
 TB(["Kind","When","Symptom"],[["Compile-time","while compiling","no program produced — <b>the good error</b>, it tells you where"],["Run-time","while running","<code>Segmentation fault</code>, <code>Bus error</code>"],["Logic","never announced","runs beautifully, answers wrongly"]]),
 P("The third is the expensive one. Nothing warns you, so only your own tests reveal it — which is why the habit of testing edge cases matters more than talent."),
 H("The Norm, in one screen"),
 TB(["Rule","Limit"],[["Lines per function","25, not counting the function's own braces"],["Functions per file","5"],["Named parameters","4"],["Variables per <b>block</b>","5"],["Columns per line","80, comments included"],["Indentation","real tabs, never spaces"]]),
 P("Declarations sit at the top of the block, one per line, <b>uninitialised</b>, followed by a blank line before any code. <code>return</code> always takes parentheses."),
 W("<b>Comments inside a function body are forbidden.</b> They are fine between functions and in headers. The reasoning is that code needing a comment to be understood should be renamed instead — so the placeholder comment you see in countless examples would fail norminette."),
 K("<b>Banned outright:</b> <code>for</code> · <code>do...while</code> · <code>switch</code> · <code>case</code> · <code>goto</code> · the ternary <code>? :</code> · variable-length arrays · unjustified globals · multiple assignments on one line."),
 H("The metaphor that keeps you honest"),
 P("Think of the compiler as an extremely obedient but completely literal cat. Say <i>go to the kitchen</i> and it does nothing, because you never said which direction, how many steps, or how it would know it arrived. Every vague word in your head — <i>walk</i>, <i>compare</i>, <i>handle</i> — has to become a step before it becomes code."),
 I("Run <code>norminette</code> early, not at the end. Restructuring six finished files because of a spacing rule is time you do not have.")],
quiz:[
 Q("Which command compiles the way 42 requires?",["cc -Wall -Wextra file.c -o prog","cc -Wall -Wextra -Werror file.c -o prog","gcc -W -Werror file.c","cc -Werror -o prog","cc file.c"],1,"Three flags are mandatory. The first drops -Werror, the third uses -W instead of the two real flags, the fourth names no source file.","Flag order does not matter to cc — what matters is that all three are present. -Wall and -Wextra surface warnings; -Werror makes them fatal so you cannot walk past questionable code."),
 Q("The 5-variable limit applies per what?",["Per file","Per function","Per block","Per project","Per parameter list"],2,"Per block — any region between braces.","This trips people who nest an if with its own declarations. Other numbers worth memorising: 25 lines per function, 5 functions per file, 4 named parameters, 80 columns."),
 Q("Which of these passes norminette?",["A comment explaining a line inside main","for (i = 0; i &lt; 5; i++)","A comment between two functions","int i = 0; at the top of a function","x = y = 0;"],2,"Comments live between functions and in headers, never inside a body.","The last option is a multiple assignment, also banned. And declaring with an initialiser on the same line is only allowed for static variables."),
 Q("A program compiles, runs, and prints the wrong answer. What kind of error?",["Compile-time","Run-time","Logic","Undefined behaviour","Norm violation"],2,"No compiler complaint and no crash leaves only logic.","Undefined behaviour is a tempting answer, but that describes a cause rather than a category, and it usually produces inconsistent results rather than a steady wrong one."),
 Q("What does Segmentation fault mean?",["The code did not compile","The system ran out of memory","You touched memory that is not yours","An infinite loop","A Norm error"],2,"The operating system is blocking access to memory outside your program's allocation.","The usual suspects, in order: dereferencing NULL, dereferencing an uninitialised pointer, and walking past a string's terminator. Its cousin Bus error usually means writing into a string literal."),
 Q("Why does the Norm ban the for loop?",["for is slower","To force the three loop pieces to be written separately and visibly","for is not standard C","Because while compiles smaller","Historical accident"],1,"With only while available you must write start, stop and step in three distinct places.","It is a teaching constraint rather than a technical one. After the piscine you can use for freely — by then the three pieces are automatic in your head.")],
debug:[
 D("void\tft_putchar(char c)\n{\n\twrite(1, &c, 1);\n}","This file will not compile. What is missing?",["write does not exist in standard C","The <code>unistd.h</code> include","<code>&amp;c</code> should be <code>c</code>","A return statement","The function should return int"],1,"write is declared in unistd.h. Without the include the compiler does not know the function and refuses.","write is a system call talking straight to the kernel — no buffering, no formatting. printf lives in stdio.h and uses write underneath. The piscine hands you the lower layer first on purpose."),
 D("int\tcount(char *s)\n{\n\tint\ti = 0;\n\twhile (s[i])\n\t\ti++;\n\treturn i;\n}","The logic is correct. What does norminette reject?",["The missing terminator comparison","Initialising on the declaration line, no blank line after declarations, and return without parentheses","The return type should be unsigned","<code>while (s[i])</code> is not valid","Nothing, it passes"],1,"Three separate violations in a five-line function.","while (s[i]) and while (s[i] != '\\0') are identical because the terminator is zero and zero is false — both pass the Norm. The violations are purely about layout, and layout is checked before anyone reads your logic."),
 D("int\tmain()\n{\n\tft_putchar('a');\n\treturn (0);\n}","One small thing here is a Norm violation. Which?",["<code>main</code> must return void","A function with no parameters must be prototyped with <code>void</code>","<code>return (0)</code> should be <code>return 0</code>","The character should be in double quotes","Nothing is wrong"],1,"An empty parameter list must be written as <code>(void)</code>, not left blank.","In C, an empty list historically means unspecified parameters rather than none, which is why the Norm insists on being explicit. It also matters for the compiler's ability to check your calls."),
 D("cc -Wall -Wextra ft_putchar.c -o prog","A grader runs this and your file passes. Why is that not reassuring?",["The output name is wrong","-Werror is missing, so warnings were tolerated","gcc should have been used","The .c extension is wrong","It compiled too fast"],1,"Without -Werror, warnings that would have blocked the real evaluation were merely printed.","This is a common self-deception: testing with looser flags than the grader uses. Always compile with the exact command the assignment specifies, from your very first attempt."),
 D("int\tprocess(char *str)\n{\n\tint\ti;\n\ti = 0;\n\twhile (str[i] != '\\0')\n\t\ti++;\n\treturn (i);\n}","Everything here is correct except one layout rule. Which?",["Declarations must be initialised","A blank line is required between declarations and code","<code>i++</code> needs braces","The parameter should be const","Tabs are not allowed"],1,"The Norm requires exactly one empty line separating the declaration block from the first statement.","It looks pedantic, but it makes a missing assignment obvious at a glance: everything above the gap is reserved space, everything below is action.")],
practice:[
 R("Write the command that compiles <code>main.c</code> into a program called <code>test</code>, then the command that runs it.","Three flags, and remember how you launch something from the current folder.","cc -Wall -Wextra -Werror main.c -o test\n./test",["All three flags present","<code>-o test</code> names the output","Run command starts with <code>./</code>"],"Without the leading ./ the shell searches the system path instead of the current directory."),
 R("Write an empty but Norm-compliant function called <code>process</code> taking a string and an int, returning an int.","Signature, declarations, blank line, return.","int\tprocess(char *str, int limit)\n{\n\tint\ti;\n\n\ti = 0;\n\treturn (i);\n}",["Opening brace on its own line","Declaration without an initialiser","Blank line between declaration and code","Return in parentheses"],"Once this skeleton is automatic, Norm errors stop costing you time on every single file."),
 R("Rewrite this so it passes norminette:<br><code>int f(char *s) { int i = 0; /* walk */ while (s[i]) i++; return i; }</code>","Four separate violations to fix.","int\tf(char *s)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (s[i] != '\\0')\n\t\ti++;\n\treturn (i);\n}",["Declaration and assignment split","Blank line after the declarations","Comment removed from inside the body","Return in parentheses"],"The brace also moves to its own line, and indentation must be real tab characters."),
 R("Write the three-command sequence you run before calling any file finished: compile, run with visible line endings, check the Norm.","Three lines.","cc -Wall -Wextra -Werror file.c -o prog\n./prog | cat -e\nnorminette file.c",["Three flags on the compile line","<code>| cat -e</code> on the run","norminette runs on the source, not the binary"],"cat -e shows line endings as a dollar sign, which is the only way to see a missing or extra newline.")],
assign:[
 S("C00","ft_putchar","void ft_putchar(char c);","write","Display the character c on standard output, using the write call the assignment gives you verbatim.","Nothing subtle here, but this is the one function everything else depends on. Make it muscle memory."),
 S("C08","ft.h","—","—","A header declaring the prototypes of the functions you already wrote, protected against multiple inclusion.","Include guards are the point. Without them, a header included twice breaks compilation.")],
chall:[
 X("hello","Print a fixed greeting followed by a newline.","—","None. This is the warm-up that proves your toolchain works."),
 X("only_a","Print a single letter.","—","Read the brief twice: it does <b>not</b> ask for a newline."),
 X("only_z","Print a single letter.","—","Same shape as the previous one. The trap is assuming they behave identically in every respect.")]},

{id:"output",grp:"Foundation",tit:"Output: write, putchar and building blocks",
lead:"In the piscine printf is almost always forbidden. You get write, which sends raw bytes from an address — and everything you ever print is built on top of it.",
theory:[
 C("#include <unistd.h>\n\nwrite(1, &c, 1);"),
 TB(["Argument","Meaning"],[["<code>1</code>","where to: 1 is the screen, 2 is the error stream"],["<code>&amp;c</code>","the <b>address</b> where the bytes begin"],["<code>1</code>","how many bytes to send"]]),
 P("Notice the second argument is an address, not a value. That is why the same call works for one character, a whole string, or a struct — write does not care what the bytes mean, only where they start and how many there are."),
 H("Your first tool"),
 C("void\tft_putchar(char c)\n{\n\twrite(1, &c, 1);\n}"),
 W("<b>Memorise this until it is boring.</b> Every other output function you write calls it. If it is not automatic, nothing above it can be."),
 H("Building upward"),
 P("Printing a string is this function inside the walking loop. Printing a number is this function plus digit extraction. Printing a grid is this function plus two nested loops. The whole output side of the piscine is one primitive and a shape around it."),
 A("ft_putchar ──► one byte\n     │\n     ├──► loop over a string      ──► print text\n     ├──► loop over digits        ──► print numbers\n     └──► nested loops            ──► print grids and tables"),
 H("Seeing what you actually printed"),
 C("./program | cat -e"),
 K("<code>cat -e</code> marks every line ending with a dollar sign. Many assignments require a trailing newline and others forbid it — and one invisible byte is the difference between a pass and a zero. Get in the habit of piping through it every single time."),
 I("Sending a raw number where a character is expected produces control bytes, which are invisible. If your program appears to print nothing, check whether you forgot the <code>+ '0'</code> conversion.")],
quiz:[
 Q("Why is the second argument of write an address rather than a value?",["Historical convention","Because write reads bytes starting from a location","Because characters can be negative","To silence the compiler","Because it returns a count"],1,"write is told where the bytes begin and how many to read.","This is exactly why the same primitive serves characters, strings and arbitrary memory dumps. It has no idea what the bytes represent."),
 Q("What is file descriptor 2 for?",["Keyboard input","Standard output","Standard error","A log file","Nothing, it is reserved"],2,"1 is standard output, 2 is standard error.","Errors go to 2 so they can be separated from normal output when redirecting. Some assignments explicitly require error messages on 2 rather than 1."),
 Q("Your program prints nothing visible, though the loop clearly runs. Most likely cause?",["The loop condition is false","You sent numeric values instead of characters","write returned an error","The newline is missing","The buffer is full"],1,"Values 0 to 9 are control characters, invisible in a terminal.","The fix is the plus-zero conversion. Confirm with cat -e: if you see no characters at all between the prompt and the dollar sign, nothing printable was emitted."),
 Q("What does cat -e show you?",["Compilation errors","Every line ending, as a dollar sign","Memory leaks","The exit code","Hidden files"],1,"It makes the invisible end-of-line byte visible.","It also displays other control characters. For piscine work its single most valuable use is confirming whether a trailing newline exists, because assignments are strict about it."),
 Q("Which is true about printf in the piscine?",["It is always allowed","It is forbidden unless a brief explicitly permits it","It is allowed only in headers","It is faster than write","It is required for numbers"],1,"Each brief lists its allowed functions, and printf appears only rarely.","Using a forbidden function is minus forty-two — worse than not submitting. Read the allowed line before you write anything, every single time.")],
debug:[
 D("write(1, c, 1);","The variable <code>c</code> is a char. What is wrong?",["The file descriptor should be 0","It passes the value instead of the address","The count should be sizeof(c)","write returns void","Nothing is wrong"],1,"write expects an address to start reading from; passing the character's value makes it treat that number as a memory location.","The compiler warns about the type mismatch, and -Werror turns that into a refusal. Without those flags it would compile and then crash or print garbage."),
 D("void\tft_putchar(char c)\n{\n\twrite(1, &c, 2);\n}","This compiles and runs. What does it print?",["Nothing","The character twice","The character plus one unpredictable byte","A newline","A compile warning only"],2,"It writes two bytes starting at the character's address, but only one byte belongs to you.","This is reading out of bounds by one. It often looks fine because the neighbouring stack byte happens to be printable or zero — classic undefined behaviour that survives testing and fails at grading."),
 D("i = 0;\nwhile (i < 5)\n{\n\tft_putchar(i);\n\ti++;\n}","Why does the terminal show nothing?",["The loop never runs","Values 0 to 4 are invisible control characters","ft_putchar needs a newline","The index is not initialised","write is buffered"],1,"You printed the numbers themselves, not the characters that represent them.","Adding the character zero shifts them into the printable digit range, 48 to 57. This same conversion is at the heart of every number-printing exercise."),
 D("void\tprint_line(char *s)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (s[i] != '\\0')\n\t\tft_putchar(s[i]);\n\ti++;\n}","This hangs. Why?",["The terminator test is wrong","The step is outside the loop body because braces are missing","ft_putchar is undefined","The parameter should be char","The index starts too low"],1,"Without braces the while owns only the print statement; the increment runs once, after the loop has already finished.","Indentation lies here — it looks like the increment is inside. This is why some teams brace every block regardless of size. At minimum, be suspicious whenever a loop body has two statements and no braces."),
 D("ft_putchar('\\n');\nft_putchar('a');","The brief asks for a letter followed by a newline. What is wrong?",["The newline must be double-quoted","The two calls are in the wrong order","A newline cannot be printed with ft_putchar","The letter needs double quotes","Nothing is wrong"],1,"The output arrives in the order you emit it, so this prints the newline first.","Trivial to see here, harder inside a loop. When output order looks wrong, read your calls top to bottom as a stream of bytes rather than as intentions.")],
practice:[
 R("Write <code>ft_putchar</code> from memory.","One line of body.","void\tft_putchar(char c)\n{\n\twrite(1, &c, 1);\n}",["Return type void","Parameter <code>char c</code>","Second argument <code>&amp;c</code>","Third argument 1"],"If you pick one thing to be automatic before anything else, pick this one."),
 R("Write a complete program that prints the letter <code>a</code> and a newline: include, function, main.","The function must be defined before it is used.","#include <unistd.h>\n\nvoid\tft_putchar(char c)\n{\n\twrite(1, &c, 1);\n}\n\nint\tmain(void)\n{\n\tft_putchar('a');\n\tft_putchar('\\n');\n\treturn (0);\n}",["Include at the top","Function defined before main","<code>int main(void)</code> with the void","Return in parentheses"],"main returns int because that value is the exit code the shell reads with echo $?."),
 R("Write <code>put_n_times</code>: prints a given character a given number of times.","A loop with a call inside it.","void\tput_n_times(char c, int n)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (i < n)\n\t{\n\t\tft_putchar(c);\n\t\ti++;\n\t}\n}",["Declaration at the top with a blank line after","Condition uses the parameter","Behaves correctly when n is 0"],"Check n = 0: the condition is tested first, so the loop simply does not run. Correct behaviour for free."),
 R("Write a nested loop that prints a rectangle of <code>#</code>, <code>w</code> wide and <code>h</code> tall, one row per line.","Two counters. Watch where the inner one is reset.","i = 0;\nwhile (i < h)\n{\n\tj = 0;\n\twhile (j < w)\n\t{\n\t\tft_putchar('#');\n\t\tj++;\n\t}\n\tft_putchar('\\n');\n\ti++;\n}",["<code>j = 0;</code> inside the outer loop","Newline after the inner loop","Both loops have their step"],"Resetting the inner counter inside the outer body is the single most common nested-loop bug.")],
assign:[
 S("C00","ft_print_alphabet","void ft_print_alphabet(void);","write","Print the lowercase alphabet on one line, in order, with no newline unless the brief says so.","Generate the letters from the counter rather than typing twenty-six calls. That habit pays off immediately in the next exercise."),
 S("C00","ft_print_reverse_alphabet","void ft_print_reverse_alphabet(void);","write","The same alphabet, walked in the other direction.","The mirror of the previous one. If you hardcoded the first, you will hardcode this too — and neither will teach you anything."),
 S("C00","ft_print_numbers","void ft_print_numbers(void);","write","Print the digits in ascending order on one line.","The counter is a number; the screen needs a character. That conversion is the whole exercise."),
 S("C00","ft_is_negative","void ft_is_negative(int n);","write","Print a single character indicating whether the integer is negative.","Decide what zero counts as before you write the condition. The brief tells you — read it rather than assuming."),
 S("C00","ft_print_comb","void ft_print_comb(void);","write","Print every combination of three different digits in ascending order, separated as the brief specifies.","Three nested loops, and the separator must not appear after the last combination. That final-item exception is the part everyone forgets."),
 S("C00","ft_print_comb2","void ft_print_comb2(void);","write","Print every pair of two-digit numbers in ascending order.","Numbers below ten need a leading zero. Printing them as raw digits produces the wrong width."),
 S("C00","ft_print_combn","void ft_print_combn(int n);","write","Print every combination of n different digits in ascending order.","This one usually needs recursion, because the number of nested loops is not known in advance."),
 S("C01","ft_putstr","void ft_putstr(char *str);","write","Display a string on standard output.","Two things combine here: the walking loop and the single-character primitive. Nothing new, only assembly."),
 S("C04","ft_putstr","void ft_putstr(char *str);","write","The same function again, this time as part of the conversion module.","Repeats appear across modules on purpose. Rewriting from memory rather than copying is the entire point.")],
chall:[
 X("ft_countdown","Print the digits from nine down to zero, then a newline.","P2","It is a program, so it needs a main. And the digits are characters, not values."),
 X("ft_print_numbers","Print the digits in ascending order.","P2","This one is a function, not a program, and the brief is specific about the trailing newline."),
 X("maff_alpha","Print the alphabet with alternating case according to position.","P4","Decide carefully whether positions are counted from zero or one — the example in the brief settles it."),
 X("maff_revalpha","The same alternating pattern, walked backwards.","P4","Mirror of the previous one, but check which letter the alternation starts on."),
 X("ft_putstr","Display a string.","P2","A function rather than a program. Nothing extra printed.")]},
{id:"flow",grp:"Foundation",tit:"Conditions, loops & off-by-one",
lead:"C has no true or false. It has zero, which is false, and everything else, which is true. Every branch and every loop you write rests on that single fact.",
theory:[
 C("if (5)     /* true */\nif (-3)    /* true */\nif (0)     /* false — the only one */"),
 W("<b>The costliest trap in the piscine: <code>=</code> against <code>==</code>.</b> One stores, the other asks. <code>if (x = 5)</code> puts five into x and, since five is not zero, answers yes every time. It compiles silently and gives wrong results forever."),
 I("Read every <code>if</code> out loud. If you hear yourself saying <i>store five in x</i>, it is wrong. You should be hearing <i>if x equals five</i>."),
 H("Combining conditions"),
 TB(["Operator","Meaning","Stops early when"],[["<code>&&</code>","and","the first is false"],["<code>||</code>","or","the first is true"],["<code>!</code>","not","—"]]),
 K("<b>Short-circuit is a safety tool, not trivia.</b> In <code>A && B</code>, if A is false then B is never evaluated. So you put the condition that <i>protects</i> first and the risky one second."),
 C("while (str[i] != '\\0' && str[i] == other[i])"),
 P("Reverse those two and you read a position that may not exist. It will not always crash — which is worse, because it passes your tests and fails at grading."),
 P("The same mechanism guards arithmetic: in <code>n != 0 && 100 / n > 5</code> the division never happens when n is zero. Integer division by zero is undefined behaviour and usually fatal."),
 W("When you mix <code>&&</code> with <code>||</code>, add parentheses. C groups them the way you expect, but the reader — including you next week, and the grader asking you to explain — should not have to work it out."),
 H("A loop is three pieces"),
 C("int\ti;\n\ni = 0;\nwhile (i < 5)\n{\n\tft_putchar('x');\n\ti++;\n}"),
 TB(["Piece","Where","If missing"],[["Start","before the loop","you read garbage"],["Stop","the condition","it does not compile"],["Step","the body","<b>infinite loop</b>"]]),
 I("Point at all three with your finger every time you write a loop. Literally. If one is missing, that is where the bug is."),
 P("The condition is checked <b>before</b> each pass, including the first, so a loop can run zero times. That is not a flaw — it is exactly the right behaviour for an empty input."),
 H("Off-by-one"),
 C("while (i < 3)    /* 3 passes: 0, 1, 2 */\nwhile (i <= 3)   /* 4 passes: 0, 1, 2, 3 */"),
 P("An array of size n has indexes 0 to n-1, never n. Half of all segmentation faults live in that <i>never</i>. Before writing the condition, say out loud how many passes you want and count them on your fingers.")],
quiz:[
 Q("In C, what counts as false?",["Only the value false","Zero and negative values","Only zero","Zero and the empty string","Zero and NULL only"],2,"Zero alone is false; everything else, negatives included, is true.","This explains a classic mistake: writing if (ft_strcmp(a, b)) meaning <i>they are equal</i>. It is the opposite — those functions return zero when equal, so the condition is true only when they differ."),
 Q("if (x = 5) ft_putchar('s'); What happens?",["Compile error","Prints only if x was already 5","Stores 5 in x and always prints","Never prints","Prints twice"],2,"The assignment yields 5, which is not zero, so the branch always runs.","In C an assignment is an expression producing the assigned value — that is what allows a = b = 0. Here that flexibility works against you, and no warning is guaranteed."),
 Q("With an empty string, in while (str[i] != '\\0' && str[i] == 'x'), is the second condition ever evaluated?",["Yes, once","No, never","Only if str[0] is x","Once per pass","Depends on the compiler"],1,"str[0] is already the terminator, so the first condition fails and && stops.","An empty string is not a string with nothing in it — it holds one byte, the terminator. So str[0] exists and reading it is perfectly safe."),
 Q("i = 0; while (i <= 3) i++; How many passes?",["3","4","5","Infinite","0"],1,"i takes 0, 1, 2 and 3 inside the loop.","One character of difference from the strictly-less version, one extra pass. Combined with array indexing, that extra pass is a read outside your memory."),
 Q("Why does the order matter in if (n != 0 && 100 / n > 5)?",["Style only","It prevents a division by zero","It runs faster","It avoids a warning","It does not matter"],1,"Short-circuit means the division is skipped entirely when n is zero.","Reversing the two turns a correct program into one that crashes on a specific input. This is the same protective pattern you use when walking strings."),
 Q("A while loop runs zero times. Is that a bug?",["Always","Never","It depends — the condition is tested before the first pass","Only with unsigned counters","Only in the Norm"],2,"Testing first is the defined behaviour, and it is often exactly what you want.","It is why a loop over an empty string does nothing gracefully, with no special case needed. If you wanted a guaranteed first pass you would need do-while, which the Norm bans anyway.")],
debug:[
 D("i = 0;\nwhile (str[i] != '\\0')\n{\n\tft_putchar(str[i]);\n}","What happens when this runs?",["Prints the string correctly","Prints nothing","Prints the first character forever","Segmentation fault immediately","Compile error"],2,"The step is missing, so the index never moves and the condition stays true.","Notice it does not crash — it happily prints until you kill it. Infinite loops are frustrating precisely because they look like they are working. Ctrl+C is your escape."),
 D("while (str[i] == other[i] && str[i] != '\\0')\n\ti++;","How many separate problems are in these two lines?",["None","Only the uninitialised index","Only the condition order","Both: order and initialisation","Three: order, initialisation and a missing brace"],3,"The index was never set, and the guard belongs first, not second.","Comparing before checking the terminator reads past the end of one string. It frequently appears to work, because the neighbouring byte happens to differ — which is exactly how this survives testing."),
 D("i = 0;\nn = 0;\nwhile (str[i] != '\\0')\n{\n\tif (str[i] == 'a')\n\t{\n\t\tn++;\n\t\ti++;\n\t}\n}","Why does this hang on most inputs?",["The counter is wrong","The step sits inside the if, so non-matching characters never advance","The comparison should be assignment","Braces are missing","The condition should use <code>&&</code>"],1,"When the character is not an a, nothing changes and the condition remains true forever.","This is the classic slip when adding a condition to a walking loop. The index must advance on every pass; only the counter belongs inside the branch."),
 D("int\ttab[3];\n\ni = 0;\nwhile (i <= 3)\n{\n\ttab[i] = 0;\n\ti++;\n}","What is wrong?",["The array is too small for the loop by one slot","The array should be size 4","The index should start at 1","Nothing, it is fine","<code>tab[i]</code> should be <code>*tab</code>"],0,"Valid indexes are 0, 1 and 2. Writing at index 3 is one past the end.","It may work silently for a long time, quietly corrupting whatever sits next on the stack, and then produce a failure somewhere unrelated. This is why the bound is written as strictly less than the size."),
 D("if (c >= 'a' && c <= 'z' || c >= 'A' && c <= 'Z')","This works, yet a grader flags it. Why?",["The operators are wrong","It should use two ifs","Mixing && and || without parentheses is unreadable and Norm-flagged","<code>&&</code> binds looser than <code>||</code>","The ranges are inverted"],2,"C groups it correctly because && binds tighter, but the intent is not visible to a reader.","If you hesitate for even a second when asked to explain the grouping at defence, that hesitation costs you. Two characters of parentheses remove the question entirely.")],
practice:[
 R("Write an if/else that prints <code>y</code> when <code>c</code> is a digit and <code>n</code> otherwise.","A range test, single quotes everywhere.","if (c >= '0' && c <= '9')\n\tft_putchar('y');\nelse\n\tft_putchar('n');",["Both bounds joined by <code>&&</code>","<code>&gt;=</code> and <code>&lt;=</code>","Single quotes on the digits"],"Writing '0' rather than 48 keeps intent visible and works regardless of character set."),
 R("Write a loop condition that advances while the current character is <code>'a'</code>, never reading past the end.","Two conditions. The guard goes first.","while (str[i] != '\\0' && str[i] == 'a')\n\ti++;",["Terminator check first","<code>&&</code> joining them","<code>!=</code> for the terminator, <code>==</code> for the letter"],"Order is the whole exercise. Reversed, you compare a position that may not exist."),
 R("Write a loop that visits every valid index of an int array <code>tab</code> of size <code>size</code>, setting each to zero.","Think about the largest index that actually exists.","i = 0;\nwhile (i < size)\n{\n\ttab[i] = 0;\n\ti++;\n}",["<code>&lt; size</code>, not <code>&lt;= size</code>","Starts at 0","Step present"],"size is the count, not the last index. The last index is always size minus one."),
 R("Rewrite this <code>for</code> as a Norm-compliant <code>while</code>:<br><code>for (i = 0; i &lt; 5; i++) ft_putchar('x');</code>","The three pieces come apart into three places.","i = 0;\nwhile (i < 5)\n{\n\tft_putchar('x');\n\ti++;\n}",["Start before the loop","Stop in the condition","Step at the end of the body","Braces present"],"Seeing the same loop both ways is the fastest route to internalising that a for hides three separate things.")],
assign:[
 S("C01","ft_ft","void ft_ft(int *nbr);","None","Take a pointer to an int and set the value it points at to a fixed number.","Trivially short, and deliberately so: it exists purely to prove you understand that the asterisk in the body is doing the work.")],
chall:[
 X("tab_mult","Print a multiplication table for a number given as an argument.","P1, P8","The layout in the brief is exact — spacing and separators included. Match it character for character."),
 X("rev_print","Print a string backwards, followed by a newline.","P1, P2","You must reach the end before you can start printing, so this is two passes, not one.")]},

{id:"ascii",grp:"Foundation",tit:"ASCII, classification & character maths",
lead:"There are no letters in a computer. There are numbers and a translation table. Once that lands, half the piscine turns into arithmetic.",
theory:[
 C("ft_putchar('a' + 1);   /* 97 + 1 = 98 -> b */\nft_putchar(5 + '0');   /* 5 + 48 = 53 -> 5 */"),
 TB(["Character","Value","Worth memorising because"],[["<code>'\\0'</code>","<b>0</b>","it ends every string"],["<code>'\\t'</code>","9","word exercises test with tabs"],["<code>'\\n'</code>","10","assignments are strict about it"],["space","32","the first printable character"],["<code>'0'</code>–<code>'9'</code>","48–57","digits are contiguous"],["<code>'A'</code>–<code>'Z'</code>","65–90","uppercase block"],["<code>'a'</code>–<code>'z'</code>","97–122","lowercase block"],["<code>~</code>","126","the last printable one"]]),
 K("The gap between the two letter blocks is <b>exactly 32</b>. But write <code>c - 'A' + 'a'</code> rather than <code>c + 32</code>: identical result, and it shows the reasoning instead of a memorised constant."),
 H("The two conversions to know cold"),
 C("'7' - '0'        /* character -> number */\n7 + '0'          /* number -> character */\nc - 'a'          /* letter -> alphabet position, 0 to 25 */"),
 P("These work only because each block is contiguous. That single property is the engine behind every conversion exercise in the piscine, from reading a number out of text to printing one back."),
 H("Classifying without the standard library"),
 C("c >= '0' && c <= '9'\nc >= 'a' && c <= 'z'\nc >= 'A' && c <= 'Z'\nc == ' ' || c == '\\t'\nc >= 32 && c <= 126"),
 W("<code>isalpha</code> and friends from <code>ctype.h</code> would do this out of the box, and they are banned. Every brief that needs classification says <i>Allowed functions: None</i>, which is why you write the ranges by hand."),
 I("Turn each range into a tiny function — <code>ft_is_digit</code>, <code>ft_is_alpha</code>, <code>ft_is_space</code>. Readable, comfortably inside the 25-line limit, and you write them once instead of five times."),
 H("The wrap-around problem"),
 P("Shift <code>'z'</code> forward by one and you get a brace, not an <code>'a'</code>. Addition knows nothing about alphabets. The clean fix is to leave ASCII space entirely: subtract <code>'a'</code> to get a position from 0 to 25, do the arithmetic there with the modulo operator, and add <code>'a'</code> back at the end."),
 C("(c - 'a' + n) % 26 + 'a'"),
 K("One expression, no branches, no special cases. Any solution that shifts first and then corrects with an <code>if</code> is doing more work and hiding a bug.")],
quiz:[
 Q("c = 'z'; c = c + 1; Which character is in c?",["'a'","'{'","'z'","'A'","'y'"],1,"123 is the brace character. Addition has no concept of an alphabet.","Wrapping is the core of every letter-shifting exercise. Working in distance-from-a and applying modulo removes the problem rather than patching it."),
 Q("What is '5' - '0'?",["5","53","48","the character 5","-43"],0,"53 minus 48 is 5, the number the character represents.","This works only because the digits are contiguous in the table. The reverse conversion, adding the character zero, is how you print a digit."),
 Q("Which condition correctly tests whether c is a letter?",["c >= 'a' && c <= 'z' && c >= 'A' && c <= 'Z'","(c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')","c >= 'A' && c <= 'z'","c >= 'a' || c <= 'z' || c >= 'A' || c <= 'Z'","c >= 'A' || c <= 'z'"],1,"A letter is in one block or the other, and each block needs both bounds joined by and.","The middle option is the good trap: it does span A to z, but it also swallows the six symbols sitting between the two blocks — bracket, backslash, caret, underscore and friends."),
 Q("Which is the most defensible way to lowercase an uppercase letter?",["c + 32","c - 32","c - 'A' + 'a'","c | 32","c * 2"],2,"Same result as adding 32, but it states the reasoning.","The bitwise version genuinely works — it sets the sixth bit — and is used in real code. But if you cannot explain the ASCII layout behind it at defence, the cleverness counts against you."),
 Q("Why do the assignments make you write range tests by hand?",["Ranges are faster","ctype.h is not portable","Because ctype.h is on the forbidden list","Ranges use less memory","Because chars are signed"],2,"Every brief needing classification lists no allowed functions.","Using a forbidden function is minus forty-two. The pedagogical point is that you should understand the table well enough not to need a library for something this simple.")],
debug:[
 D("if (c >= 'A' && c <= 'z')\n\treturn (1);","This is meant to detect letters. What slips through?",["Nothing, it is correct","Digits","The six symbols between Z and a","Spaces","Uppercase letters"],2,"Between 90 and 97 sit bracket, backslash, bracket, caret, underscore and backtick.","It would pass a casual test with words and fail on any input containing an underscore — which is exactly the kind of input a grader tries."),
 D("c = c + 32;","This is meant to lowercase a letter. When does it break?",["Never","When c is already lowercase","When c is a digit or symbol","When c is uppercase","Only with accents"],1,"Applied to a lowercase letter it pushes past z into the symbol range.","Any case conversion needs a range check first. And a digit or symbol would also be mangled, which is why the fix is a guard rather than a different constant."),
 D("if (c >= 0 && c <= 9)\n\treturn (1);","This never detects a digit character. Why?",["The operators are reversed","It compares against the values 0 to 9, not the characters","It should use <code>||</code>","c must be an int","Digits are not contiguous"],1,"The characters for digits are 48 to 57; values 0 to 9 are unprintable control codes.","Missing quotes turns a correct idea into a test that only matches invisible bytes. Writing the quoted forms consistently prevents it."),
 D("i = 0;\nwhile (str[i] != '\\0')\n{\n\tstr[i] = str[i] - 'A' + 'a';\n\ti++;\n}","Applied to a mixed string, what goes wrong?",["Nothing","Non-uppercase characters get mangled","It only converts the first letter","It hangs","It writes past the end"],1,"The conversion is applied unconditionally, so digits, spaces and already-lowercase letters are shifted too.","A space becomes something unprintable, and a lowercase letter runs past z. Transformations always need the classification test wrapped around them."),
 D("c = (c - 'a' + 13) % 26;","This shifts a letter by thirteen but prints garbage. What is missing?",["The modulo should be 25","The base must be added back at the end","It should use <code>'A'</code>","The shift should be negative","Nothing, printing is at fault"],1,"After the modulo you hold a position from 0 to 25, not a character.","Adding the base letter back converts the position into a real character again. Forgetting the final addition is the single most common error in shift exercises.")],
practice:[
 R("Write the four classification conditions: digit, lowercase, uppercase, and letter.","Range comparisons, with parentheses when you mix the operators.","c >= '0' && c <= '9'\nc >= 'a' && c <= 'z'\nc >= 'A' && c <= 'Z'\n(c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')",["Single quotes on every character","<code>&gt;=</code> and <code>&lt;=</code> throughout","<code>&&</code> within each range","Parentheses around each range in the last"],"A fifth you will need constantly: whitespace, which is space or tab."),
 R("Write <code>to_lower</code>: returns the lowercase form if the character is an uppercase letter, unchanged otherwise.","Guard first, convert second.","char\tto_lower(char c)\n{\n\tif (c >= 'A' && c <= 'Z')\n\t\treturn (c - 'A' + 'a');\n\treturn (c);\n}",["Range check before converting","<code>c - 'A' + 'a'</code>, not <code>c + 32</code>","Non-letters returned unchanged"],"The guard is what makes it safe on mixed input, which is what every real brief tests with."),
 R("Write <code>digit_value</code>: takes a digit character and returns the number it represents.","One subtraction.","int\tdigit_value(char c)\n{\n\treturn (c - '0');\n}",["Subtracts <code>'0'</code>, not 48","Returns an int","Takes a char"],"Writing the quoted zero means you never have to remember the table and it survives any character set."),
 R("Write an expression that shifts a lowercase letter <code>c</code> forward by <code>n</code> places, wrapping past z.","Leave ASCII space, do the arithmetic, come back.","(c - 'a' + n) % 26 + 'a'",["Subtracts <code>'a'</code> first","Modulo 26","Adds <code>'a'</code> back at the end"],"One expression with no branches. Anything longer is patching a problem you could have avoided.")],
assign:[
 S("C02","ft_str_is_alpha","int ft_str_is_alpha(char *str);","None","Return 1 if the string contains only alphabetical characters, 0 otherwise. An empty string returns 1.","The empty-string case is stated explicitly and is easy to get right by accident and wrong on purpose. Decide what your loop does before it starts."),
 S("C02","ft_str_is_numeric","int ft_str_is_numeric(char *str);","None","Return 1 if the string contains only digits, 0 otherwise. Empty returns 1.","Same shape as the previous one with a different range. If the first took you an hour, this should take five minutes."),
 S("C02","ft_str_is_lowercase","int ft_str_is_lowercase(char *str);","None","Return 1 if every character is lowercase, 0 otherwise. Empty returns 1.","Note it asks about lowercase characters, not about letters. A digit is not lowercase."),
 S("C02","ft_str_is_uppercase","int ft_str_is_uppercase(char *str);","None","Return 1 if every character is uppercase, 0 otherwise. Empty returns 1.","The mirror of the previous one."),
 S("C02","ft_str_is_printable","int ft_str_is_printable(char *str);","None","Return 1 if every character is printable, 0 otherwise. Empty returns 1.","Printable is a range, not a list. Find the two boundary values and the whole function is four lines.")],
chall:[
 X("ulstr","Print the string with the case of every letter swapped.","P1, P3, P4","Non-letters must pass through untouched. Test with digits and punctuation, not just words."),
 X("rotone","Print the string with each letter advanced by one place.","P1, P4","The wrap applies to both cases independently, and case must be preserved."),
